function parseBatchFileInfo(farmName, fileName){
  const farm = sanitizeUserFarmName(farmName);
  const base = `${farm}${SYNC_SUFFIX}`;
  if (!fileName.startsWith(base)) return null;
  if (!fileName.endsWith('.json')) return null;
  if (fileName.endsWith('-file.json')) return null;
  const middle = fileName.slice(base.length, -'.json'.length);
  if (middle === '') return { batchKey: '', label: 'Legacy', isLegacy: true };
  if (!middle.startsWith('-')) return null;
  const key = middle.slice(1);
  return { batchKey: key, label: `Batch ${key}`, isLegacy: false };
}
function compareBatchKeys(a, b){
  const na = parseFloat(String(a).replace(/[^0-9.]/g, ''));
  const nb = parseFloat(String(b).replace(/[^0-9.]/g, ''));
  if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return nb - na;
  return String(b).localeCompare(String(a));
}

function renderBatchListPage(){
  if (!batchHistoryCache) return;
  const { files } = batchHistoryCache;
  const totalCount = files.length;
  const totalPages = Math.max(1, Math.ceil(totalCount / BATCHES_PER_PAGE));
  if (batchHistoryPage >= totalPages) batchHistoryPage = totalPages - 1;
  if (batchHistoryPage < 0) batchHistoryPage = 0;
  const start = batchHistoryPage * BATCHES_PER_PAGE;
  const end = Math.min(start + BATCHES_PER_PAGE, totalCount);
  const pageItems = files.slice(start, end);
  const currentKey = currentBatchKey();
  const rows = pageItems.map(p => {
    const isCurrent = (p.batchKey === currentKey) || (p.isLegacy && !currentKey);
    const sizeStr = fmtBytes(p.size);
    const metaBits = [];
    if (sizeStr) metaBits.push(sizeStr);
    if (p.isLegacy) metaBits.push('original file');
    const meta = metaBits.join(' · ');
    return `
      <div class="batch-row ${isCurrent ? 'current' : ''}" data-batch-key="${escapeAttr(p.batchKey)}">
        <div class="batch-row-info">
          <div class="batch-row-title">

        </div>
      </div>`;
  }).join('');
  const statusEl = document.getElementById('batchListStatus');
  const listEl = document.getElementById('batchListContainer');
  const pagEl = document.getElementById('batchPaginationContainer');
  if (statusEl){
    statusEl.innerHTML = `${totalCount} batch${totalCount === 1 ? '' : 'es'} found`;
    statusEl.classList.remove('error');
  }
  if (listEl) listEl.innerHTML = rows;
  if (pagEl){
    if (totalPages > 1){
      pagEl.innerHTML = `
        <div class="batch-pagination">
          <button class="batch-page-btn" data-batch-page="prev" type="button"
            ${batchHistoryPage === 0 ? 'disabled' : ''}>← Prev</button>
          <span class="batch-page-info">Page ${batchHistoryPage + 1} of ${totalPages}</span>
          <button class="batch-page-btn" data-batch-page="next" type="button"
            ${batchHistoryPage === totalPages - 1 ? 'disabled' : ''}>Next →</button>
        </div>`;
    } else { pagEl.innerHTML = ''; }
  }
  const body = document.getElementById('batchHistoryModalBody');
  if (!body) return;
  body.querySelectorAll('[data-batch-open]').forEach(btn => {
    btn.addEventListener('click', () => { openPastBatch(btn.dataset.batchOpen); });
  });
  body.querySelectorAll('[data-batch-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dir = btn.dataset.batchPage;

      const totalPages2 = Math.max(1, Math.ceil(totalCount2 / BATCHES_PER_PAGE));
      if (dir === 'prev' && batchHistoryPage > 0) batchHistoryPage--;
      else if (dir === 'next' && batchHistoryPage < totalPages2 - 1) batchHistoryPage++;
      renderBatchListPage();
    });
  });
}

/* ---------- Derived ---------- */
function ageInDays(shed, onDate = new Date()){
  if (!shed.placementDate) return 0;
  return Math.max(0, daysBetween(shed.placementDate, onDate));
}
function totalPicked(shed){ return (shed.pickups || []).reduce((s,p) => s + (Number(p.birds) || 0), 0); }
function mortalityRate(shed){ if (!shed.initialPopulation) return 0; return (Number(shed.mortality || 0) / shed.initialPopulation) * 100; }
function finalPickupOf(shed){ return (shed.pickups || []).find(p => p.isFinal); }
function shedsForGroup(g){
  if (!farmData) return [];
  const a = farmData.sheds[(g-1)*2];
  const b = farmData.sheds[(g-1)*2 + 1];
  return [a, b].filter(Boolean);
}

function liveAtStartOfDay(shed, D){
  const d = dateOnly(D);
  if (!shed.placementDate) return 0;
  if (d < dateOnly(shed.placementDate)) return 0;
  if (shed.cleanoutDate && d > dateOnly(shed.cleanoutDate)) return 0;
  const effective = computeEffectivePickups(shed);
  const beforeD = effective
    .filter(p => dateOnly(p.date) < d)
    .reduce((s,p) => s + (Number(p.birds) || 0), 0);
  return Math.max(0, shed.initialPopulation - Number(shed.mortality || 0) - beforeD);
}
function feedPerBirdKg(shed, ageDays){
  if (shed.customFeedKg != null && shed.customFeedKg > 0) return shed.customFeedKg;
  if (ageDays <= 0) return 0;
  const age = Math.min(60, Math.max(1, Math.floor(ageDays)));
  return (ROSS_308_FEED_INTAKE[age] || 234) / 1000;
}
function shedFeedOn(shed, D){
  const age = ageInDays(shed, D);
  const live = liveAtStartOfDay(shed, D);
  if (age <= 0 || live <= 0) return 0;
  return live * feedPerBirdKg(shed, age);
}
function groupDailyFeedOn(sheds, D){ return sheds.reduce((sum, s) => sum + shedFeedOn(s, D), 0); }
function groupFeedToday(sheds, today = new Date()){ return groupDailyFeedOn(sheds, today); }

function fmtFeed(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0 kg';
  const abs = Math.abs(kg);
  if (abs >= 1000) return (kg / 1000).toFixed(2) + ' t';
  return Math.round(kg).toLocaleString() + ' kg';
}
function fmtKgAlways(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0 kg';
  return Math.round(kg).toLocaleString() + ' kg';
}
function fmtTonnesAlways(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0.00 t';
  const t = kg / 1000;
  return t.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' t';
}

/* =========================================================
   PREDICTION ENGINE
========================================================= */
function computePredictions(shed, group){
  const today = dateOnly(new Date());
  const initialPop = Number(shed.initialPopulation) || 0;
  const currentMort = Number(shed.mortality) || 0;
  const currentAge = ageInDays(shed, today);
  const liveNow = liveAtStartOfDay(shed, today);
  const pickups = computeEffectivePickups(shed);
  const finalAge = shed.cleanoutDate ? Math.max(currentAge, ageInDays(shed, shed.cleanoutDate)) : currentAge + 30;
  const targetALW = Number(predState.targetHarvestWeightKg[group]) || 2.65;
  const beta = Number(predState.beta) || 0.27;

  let perfSum = 0, perfCount = 0;
  for (const p of pickups){
    const avg = pickupAvgKg(p);
    if (avg && avg > 0){
      const pAge = pickupAge(shed, p);
      const curveW = rossWeightKg(pAge);
      if (curveW > 0){ perfSum += (avg / curveW); perfCount++; }
    }
  }
  const perfFactor = perfCount > 0 ? (perfSum / perfCount) : 1.0;
  const curveFinal = rossWeightKg(finalAge);
  const perfAdjustedFinal = curveFinal * perfFactor;

  const fit = getShedGompertzFit(shed);
  let estFinalALW;
  if (fit){
    const gompFinal = gompertzWeightAt(fit, finalAge);
    const progressT = Math.min(1, currentAge / Math.max(1, finalAge));
    if (gompFinal != null){
      estFinalALW = gompFinal * (1 - progressT * 0.3) + targetALW * (progressT * 0.3);
    } else {
      estFinalALW = (perfCount > 0)
        ? (perfAdjustedFinal * (1 - progressT * 0.5) + targetALW * (progressT * 0.5))
        : targetALW;
    }
  } else {
    const progressT = Math.min(1, currentAge / Math.max(1, finalAge));
    estFinalALW = (perfCount > 0)
      ? (perfAdjustedFinal * (1 - progressT * 0.5) + targetALW * (progressT * 0.5))
      : targetALW;
  }

  const mortEstimate = estimateShedFinalMortality(shed, finalAge, currentAge);
  const estFinalMort = mortEstimate.estFinalMort;
  const estFinalLive = mortEstimate.estFinalLive;
  const estLivability = mortEstimate.estLivability;

  let totalWeightKg = 0;
  const pickupDetails = [];
  let cumBirds = 0;
  for (const p of pickups){
    const pAge = pickupAge(shed, p);
    const curveAtAge = rossWeightKg(pAge);
    const avgFromExcel = pickupAvgKg(p);
    const avgUsed = (avgFromExcel && avgFromExcel > 0) ? avgFromExcel : (curveAtAge * perfFactor);
    const pickupWeightKg = Number(p.birds || 0) * avgUsed;
    totalWeightKg += pickupWeightKg;
    cumBirds += Number(p.birds || 0);
    pickupDetails.push({
      date: p.date, age: pAge,
      birds: Number(p.birds || 0),
      avgWeightKg: avgUsed,
      totalWeightKg: Number(p.birds || 0) * avgUsed,
      isFinal: !!p.isFinal,
      isPredicted: p.__source === 'predicted',
      cumBirds,
      isEstWeight: !(avgFromExcel && avgFromExcel > 0)
    });
  }
  const finalLiveBirds = Math.max(0, estFinalLive - cumBirds);
  totalWeightKg += finalLiveBirds * estFinalALW;

  let totalFeedKg = 0;
  if (shed.placementDate && shed.cleanoutDate){
    let d = dateOnly(shed.placementDate);
    const end = dateOnly(shed.cleanoutDate);
    while (d <= end){ totalFeedKg += shedFeedOn(shed, d); d = addDays(d, 1); }
  } else if (shed.placementDate){
    let d = dateOnly(shed.placementDate);
    const end = dateOnly(new Date());
    while (d <= end){ totalFeedKg += shedFeedOn(shed, d); d = addDays(d, 1); }
  }
  const fcr = totalWeightKg > 0 ? (totalFeedKg / totalWeightKg) : 0;
  const cfcr = fcr - (estFinalALW - 2.45) * beta;
  const pif = (finalAge > 0 && fcr > 0) ? ((estLivability * estFinalALW) / (finalAge * fcr) * 100) : 0;
  const remainingWeightKg = liveNow * rossWeightKg(currentAge) * perfFactor;
  const confidence = computeConfidence(shed, finalAge);

  return {
    initialPop, currentMort, currentAge, liveNow,
    pickupsCompleted: pickups.length,
    remainingBirds: liveNow, remainingWeightKg,
    finalAge, estFinalALW, estFinalMort, estFinalLive, estLivability,
    totalWeightKg, totalFeedKg, fcr, cfcr, pif, beta,
    perfFactor, confidence, pickupDetails,
    hasWeightData: perfCount > 0,
    gompertzFit: fit
  };
}

function computeGroupPredictions(group){
  const sheds = shedsForGroup(group);
  let totalLiveWeight = 0, totalFeedKg = 0, totalPlaced = 0;
  let totalMortalityEst = 0, totalBirdsAtHarvest = 0;
  let weightedAgeSum = 0, shedsWithData = 0, confidenceSum = 0;
  for (const shed of sheds){
    if (!shed.placementDate) continue;
    const pred = computePredictions(shed, group);
    totalLiveWeight += pred.totalWeightKg;
    totalFeedKg += pred.totalFeedKg;
    totalPlaced += pred.initialPop;
    totalMortalityEst += pred.estFinalMort;
    const harvestedBirds = pred.pickupDetails.reduce((s,p) => s + p.birds, 0);
    const remainingBirds = Math.max(0, pred.estFinalLive - harvestedBirds);
    const batchBirds = harvestedBirds + remainingBirds;
    totalBirdsAtHarvest += batchBirds;
    weightedAgeSum += pred.finalAge * batchBirds;
    confidenceSum += pred.confidence;
    shedsWithData++;
  }
  if (shedsWithData === 0){
    return {
      hasData: false, shedsWithData: 0, shedIds: sheds.map(s => s.id),
      totalLiveWeight: 0, totalFeedKg: 0,
      totalPlaced: 0, totalMortalityEst: 0, totalBirdsAtHarvest: 0,
      avgWeight: 0, weightedAge: 0, livability: 0,
      fcr: 0, cfcr: 0, pif: 0, confidence: 0
    };
  }
  const avgWeight = totalBirdsAtHarvest > 0 ? totalLiveWeight / totalBirdsAtHarvest : 0;
  const weightedAge = totalBirdsAtHarvest > 0 ? weightedAgeSum / totalBirdsAtHarvest : 0;
  const livability = totalPlaced > 0 ? ((totalPlaced - totalMortalityEst) / totalPlaced) * 100 : 0;
  const fcr = totalLiveWeight > 0 ? totalFeedKg / totalLiveWeight : 0;
  const beta = Number(predState.beta) || 0.27;
  const cfcr = fcr > 0 ? fcr - (avgWeight - 2.45) * beta : 0;
  const pif = (weightedAge > 0 && fcr > 0) ? ((livability * avgWeight) / (weightedAge * fcr) * 100) : 0;
  const confidence = Math.round(confidenceSum / shedsWithData);
  return {
    hasData: true, shedsWithData, shedIds: sheds.map(s => s.id),
    totalLiveWeight, totalFeedKg,
    totalPlaced, totalMortalityEst, totalBirdsAtHarvest,
    avgWeight, weightedAge, livability,
    fcr, cfcr, pif, confidence
  };
}

function computeConfidence(shed, finalAge){
  const age = ageInDays(shed, new Date());
  const pickups = shed.pickups || [];
  const samples = shed.inYardSamples || [];
  const gridPoints = TARGET_DAYS.filter(d => Number(shed.targetCurve && shed.targetCurve[d]) > 0).length;
  const hasWeight = pickups.some(p => pickupAvgKg(p) != null);
  const hasSamples = samples.length > 0 || gridPoints > 0;
  const hasFinal = pickups.some(p => p.isFinal);
  const hasFit = !!getShedGompertzFit(shed);
  if (hasFinal) return 100;
  let c = 25;
  c += pickups.length * 8;
  c += gridPoints * 4;
  c += samples.length * 3;
  c += hasWeight ? 8 : 0;
  c += hasSamples ? 5 : 0;
  c += hasFit ? 8 : 0;
  c += Math.floor((age / Math.max(1, finalAge)) * 10);
  return Math.min(95, c);
}
function confidenceLabel(pct){
  if (pct >= 80) return { label: 'High', cls: 'high' };
  if (pct >= 50) return { label: 'Medium', cls: 'medium' };
  return { label: 'Low', cls: 'low' };
}

/* =========================================================
   WHOLE-FARM KPI TOTALS
========================================================= */
function computeFarmTotals(){
  const sheds = (farmData && farmData.sheds) ? farmData.sheds : [];
  let totalLiveWeight = 0, totalFeedAuto = 0, totalPlaced = 0;
  let totalMortalityEst = 0, totalBirdsAtHarvest = 0;
  let weightedAgeSum = 0, shedsWithData = 0;
  let totalCurrentMort = 0;
  for (const shed of sheds){
    if (!shed.placementDate) continue;
    const g = Math.floor((shed.id - 1) / 2) + 1;
    const pred = computePredictions(shed, g);
    totalLiveWeight += pred.totalWeightKg;
    totalFeedAuto += pred.totalFeedKg;
    totalPlaced += pred.initialPop;
    totalMortalityEst += pred.estFinalMort;
    totalCurrentMort += Math.max(0, Number(shed.mortality) || 0);
    const harvestedBirds = pred.pickupDetails.reduce((s,p) => s + p.birds, 0);
    const remainingBirds = Math.max(0, pred.estFinalLive - harvestedBirds);
    const batchBirds = harvestedBirds + remainingBirds;
    totalBirdsAtHarvest += batchBirds;
    weightedAgeSum += pred.finalAge * batchBirds;
    shedsWithData++;
  }

  const autoLeftover = totalFarmLeftover();
  const leftoverKg = (predState.farmLeftoverKg != null
    && Number.isFinite(Number(predState.farmLeftoverKg))
    && Number(predState.farmLeftoverKg) > 0)
    ? Number(predState.farmLeftoverKg)
    : 0;
  const leftoverApplied = leftoverKg > 0;

  if (shedsWithData === 0){
    return {
      hasData: false, shedsWithData: 0,
      totalLiveWeight: 0, totalFeedAuto: 0, totalFeed: 0,
      fcr: 0, cfcr: 0, pif: 0, avgWeight: 0, livability: 0,
      weightedAge: 0, placed: 0, mortality: 0, birdsAtHarvest: 0,
      usingManualFeed: false,
      autoLeftover: null, leftoverApplied: false, leftoverKg: 0,
      totalCurrentMortality: 0, currentMortRate: 0, estMortRate: 0
    };
  }
  const avgWeight = totalBirdsAtHarvest > 0 ? totalLiveWeight / totalBirdsAtHarvest : 0;
  const weightedAge = totalBirdsAtHarvest > 0 ? weightedAgeSum / totalBirdsAtHarvest : 0;
  const livability = totalPlaced > 0 ? ((totalPlaced - totalMortalityEst) / totalPlaced) * 100 : 0;
  const usingManualFeed = predState.farmFeedOverride != null && predState.farmFeedOverride > 0;
  const baseFeed = usingManualFeed ? predState.farmFeedOverride : totalFeedAuto;
  const totalFeed = Math.max(0, baseFeed - leftoverKg);
  const fcr = totalLiveWeight > 0 ? totalFeed / totalLiveWeight : 0;
  const beta = Number(predState.beta) || 0.27;
  const cfcr = fcr > 0 ? fcr - (avgWeight - 2.45) * beta : 0;
  const pif = (weightedAge > 0 && fcr > 0) ? ((livability * avgWeight) / (weightedAge * fcr) * 100) : 0;
  return {
    hasData: true, shedsWithData,
    totalLiveWeight, totalFeedAuto, totalFeed,
    fcr, cfcr, pif, avgWeight, livability,
    weightedAge, placed: totalPlaced, mortality: totalMortalityEst,
    birdsAtHarvest: totalBirdsAtHarvest,
    usingManualFeed,
    autoLeftover, leftoverApplied, leftoverKg,
    totalCurrentMortality: totalCurrentMort,
    currentMortRate: totalPlaced > 0 ? (totalCurrentMort / totalPlaced) * 100 : 0,
    estMortRate: totalPlaced > 0 ? (totalMortalityEst / totalPlaced) * 100 : 0
  };
}
function farmFeedSubText(t){
  if (t.usingManualFeed && t.leftoverApplied){
    return `Manual override − leftover · auto: ${fmtTonnesAlways(t.totalFeedAuto)}`;
  }
  if (t.usingManualFeed){
    return `Manual override · auto: ${fmtTonnesAlways(t.totalFeedAuto)}`;
  }
  if (t.leftoverApplied){
    return `Auto − ${Math.round(t.leftoverKg).toLocaleString()} kg leftover · auto: ${fmtTonnesAlways(t.totalFeedAuto)}`;
  }
  return `Auto-estimated from ${t.shedsWithData} shed${t.shedsWithData === 1 ? '' : 's'}`;
}

/* ---------- Shed forecast ---------- */
function computeForecast(shed, range){
  const today = dateOnly(new Date());
  const rows = [];
  let totalFeed = 0;
  if (!shed.placementDate) return { rows: [], totalFeed: 0, notStarted: true };
  const effective = computeEffectivePickups(shed);
  for (let off = range.start; off <= range.end; off++){
    const d = addDays(today, off);
    const isPast = off < 0;
    const isToday = off === 0;
    if (dateOnly(d) < dateOnly(shed.placementDate)){
      rows.push({ date: d, age: 0, liveStart: 0, perBird: 0, dailyFeed: 0,
        pickups: [], pickupsBirds: 0, liveAfter: 0,
        isFinalDay: false, isToday, isPast, beforePlacement: true });
      continue;
    }
    if (shed.cleanoutDate && dateOnly(d) > dateOnly(shed.cleanoutDate)){
      const pickupsToday = effective.filter(p => iso(p.date) === iso(d));
      rows.push({ date: d, age: ageInDays(shed, d), liveStart: 0, perBird: 0, dailyFeed: 0,
        pickups: pickupsToday,
        pickupsBirds: pickupsToday.reduce((s,p) => s + p.birds, 0),
        liveAfter: 0, isFinalDay: false, isToday, isPast, afterCleanout: true });
      continue;
    }
    const age = ageInDays(shed, d);
    const live = liveAtStartOfDay(shed, d);
    const pickupsToday = effective.filter(p => iso(p.date) === iso(d));
    const pickupsBirds = pickupsToday.reduce((s,p) => s + p.birds, 0);
    const isFinalDay = pickupsToday.some(p => p.isFinal);
    const hasPredicted = pickupsToday.some(p => p.__source === 'predicted');
    const perBird = feedPerBirdKg(shed, age);
    const dailyFeed = live * perBird;
    const liveAfter = Math.max(0, live - pickupsBirds);
    totalFeed += dailyFeed;
    rows.push({ date: d, age, liveStart: live, perBird, dailyFeed,
      pickups: pickupsToday, pickupsBirds, liveAfter,
      isFinalDay, hasPredicted, isToday, isPast });
  }
  return { rows, totalFeed };
}

/* ---------- Silo ---------- */
function readingsSorted(group){
  const s = siloData[group] || { readings: [] };
  return (s.readings || []).slice().sort((a,b) => a.date.localeCompare(b.date));
}
function latestReading(group){ const arr = readingsSorted(group); return arr.length ? arr[arr.length - 1] : null; }
function readingTotalKg(reading){ if (!reading) return 0; return ringsToKg(reading.silo1Rings) + ringsToKg(reading.silo2Rings) + ringsToKg(reading.silo3Rings); }

function deliveriesForGroup(group){
  const s = siloData[group] || { deliveries: [] };
  return (s.deliveries || []).slice().sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
}
function allDeliveriesForGroup(group){
  const real = deliveriesForGroup(group).map(d => ({ ...d, isTest: false }));
  const tests = (testDeliveries[group] || []).map(t => ({ ...t, isTest: true }));
  return real.concat(tests).sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
}
function deliveriesKgOn(group, D){
  const d = dateOnly(D);
  return deliveriesForGroup(group).filter(x => iso(x.date) === iso(d)).reduce((s,x) => s + (Number(x.amountKg) || 0), 0);
}
function deliveriesKgOnAll(group, D){
  const d = dateOnly(D);
  return allDeliveriesForGroup(group).filter(x => iso(x.date) === iso(d)).reduce((s,x) => s + (Number(x.amountKg) || 0), 0);
}
function balanceOnEndOfDay(group, D){
  const latest = latestReading(group);
  if (!latest) return null;
  const latestDate = dateOnly(latest.date);
  const targetD = dateOnly(D);
  const sheds = shedsForGroup(group);
  if (targetD.getTime() === latestDate.getTime()) return readingTotalKg(latest);
  if (targetD > latestDate){
    let bal = readingTotalKg(latest);
    for (let d = addDays(latestDate, 1); d <= targetD; d = addDays(d, 1)){
      bal = bal + deliveriesKgOnAll(group, d) - groupDailyFeedOn(sheds, d);
    }
    return bal;
  }
  let bal = readingTotalKg(latest);
  for (let d = latestDate; d > targetD; d = addDays(d, -1)){
    bal = bal - deliveriesKgOnAll(group, d) + groupDailyFeedOn(sheds, d);
  }
  return bal;
}
function currentBalanceKg(group){ return balanceOnEndOfDay(group, new Date()); }
function consumptionSinceLatestReading(group){
  const latest = latestReading(group);
  if (!latest) return 0;
  const latestDate = dateOnly(latest.date);
  const today = dateOnly(new Date());
  if (latestDate >= today) return 0;
  const sheds = shedsForGroup(group);
  let c = 0;
  for (let d = addDays(latestDate, 1); d <= today; d = addDays(d, 1)) c += groupDailyFeedOn(sheds, d);
  return c;
}
function deliveriesSinceLatestReading(group){
  const latest = latestReading(group);
  if (!latest) return 0;
  const latestDate = dateOnly(latest.date);
  const today = dateOnly(new Date());
  if (latestDate >= today) return 0;
  let d = 0;
  for (let x = addDays(latestDate, 1); x <= today; x = addDays(x, 1)) d += deliveriesKgOn(group, x);
  return d;
}
function computeSiloForecast(group, range){
  const sheds = shedsForGroup(group);
  const today = dateOnly(new Date());
  const rows = [];
  let totalConsumption = 0, totalDelivered = 0;
  for (let off = range.start; off <= range.end; off++){
    const d = addDays(today, off);
    const isPast = off < 0;
    const isToday = off === 0;
    const cons = groupDailyFeedOn(sheds, d);
    const del  = deliveriesKgOnAll(group, d);
    const deliveriesOnDay = allDeliveriesForGroup(group).filter(x => iso(x.date) === iso(d));
    const bal = balanceOnEndOfDay(group, d);
    totalConsumption += cons;
    totalDelivered += del;
    rows.push({ date: d, consumption: cons, delivery: del,
      deliveries: deliveriesOnDay, balance: bal,
      isToday, isPast, isFuture: !isPast && !isToday, isWeekend: isWeekend(d) });
  }
  let depletedDate = null;
  for (const r of rows){
    if (r.balance !== null && r.balance <= 0 && r.consumption > 0 && !r.isPast){ depletedDate = r.date; break; }
  }
  const endBalance = rows.length ? rows[rows.length - 1].balance : null;
  const totalStock = balanceOnEndOfDay(group, today);
  const shortfall = Math.max(0, totalConsumption - (totalStock || 0) - totalDelivered);
  return { rows, totalStock, totalConsumption, totalDelivered, depletedDate, endBalance, shortfall };
}

function shedAgesAtDateForGroup(group, date){
  const sheds = shedsForGroup(group);
  return sheds.map(s => {
    if (!s.placementDate) return null;
    const d = dateOnly(date);
    const p = dateOnly(s.placementDate);
    if (d < p) return null;
    return daysBetween(s.placementDate, d);
  });
}
function formatAgesPair(ages){
  const valid = ages.filter(a => a !== null);
  if (valid.length === 0) return '—';
  if (valid.every(a => a === valid[0])) return valid[0] + 'd';
  return ages.map(a => a === null ? '—' : a + 'd').join(' / ');
}

function projectedLeftoverForGroup(group){
  const sheds = shedsForGroup(group);
  const cleanouts = sheds.map(s => s.cleanoutDate).filter(Boolean);
  if (cleanouts.length === 0) return null;
  const latest = cleanouts.reduce((a,b) => a > b ? a : b);
  const bal = balanceOnEndOfDay(group, latest);
  return { date: latest, balance: bal };
}
function totalFarmLeftover(){
  let sum = 0;
  let any = false;
  [1,2,3,4].forEach(g => {
    const lo = projectedLeftoverForGroup(g);
    if (lo && lo.balance !== null){ sum += lo.balance; any = true; }
  });
  return any ? sum : null;
}

function computeFeedSummary(group){
  const deliveries = deliveriesForGroup(group);
  const buckets = {
    starter:{id:'starter',label:'Starter',tonnes:0,deliveries:0,blocks:0},
    grower:{id:'grower',label:'Grower',tonnes:0,deliveries:0,blocks:0},
    finisher:{id:'finisher',label:'Finisher',tonnes:0,deliveries:0,blocks:0},
    withdrawal:{id:'withdrawal',label:'Withdrawal',tonnes:0,deliveries:0,blocks:0},
    unspecified:{id:'unspecified',label:'Unspecified',tonnes:0,deliveries:0,blocks:0}
  };
  deliveries.forEach(d => {
    const t = (Number(d.amountKg) || 0) / 1000;
    const key = FEED_TYPES.some(f => f.id === d.feedType) ? d.feedType : 'unspecified';
    buckets[key].tonnes += t; buckets[key].deliveries += 1;
  });
  Object.values(buckets).forEach(b => {
    b.blocks = b.tonnes / FEED_BLOCK_T;
  });
  const totalTonnes = Object.values(buckets).reduce((s,b) => s + b.tonnes, 0);
  const totalBlocks = Object.values(buckets).reduce((s,b) => s + b.blocks, 0);
  return { buckets, totalTonnes, totalBlocks };
}

  return `

/* ---------- Silo actions ---------- */
function setSiloRingsForToday(group, siloNum, rings){
  if (!siloData[group]) siloData[group] = { readings: [], deliveries: [] };
  const s = siloData[group];
  const todayIso = iso(new Date());
  let reading = s.readings.find(r => r.date === todayIso);
  if (!reading){
    const prev = s.readings.length ? s.readings[s.readings.length - 1] : null;
    reading = { date: todayIso,
      silo1Rings: prev ? prev.silo1Rings : null,
      silo2Rings: prev ? prev.silo2Rings : null,
      silo3Rings: prev ? prev.silo3Rings : null };
    s.readings.push(reading);
    s.readings.sort((a,b) => a.date.localeCompare(b.date));
  }
  const key = `silo${siloNum}Rings`;
  reading[key] = (rings === null) ? null : normalizeRing(rings);
  saveSiloData(); schedulePush(); render();
}
function addSiloDelivery(group, dateStr, amountT, feedType, note){
  const d = parseExcelDate(dateStr);
  if (!d){ showToast('Pick a valid date.', true); return; }
  const amountKg = Number(amountT) * 1000;
  if (!Number.isFinite(amountKg) || amountKg <= 0){ showToast('Enter a positive amount in tonnes.', true); return; }
  if (!siloData[group]) siloData[group] = { readings: [], deliveries: [] };
  siloData[group].deliveries.push({
    id: String(Date.now()) + Math.random().toString(16).slice(2),
    date: d, amountKg,
    feedType: FEED_TYPES.some(f => f.id === feedType) ? feedType : '',
    note: String(note || '').trim()
  });
  siloData[group].deliveries.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));

  let replacedTestCount = 0;
  if (testDeliveries[group] && testDeliveries[group].length > 0){
    const before = testDeliveries[group].length;
    testDeliveries[group] = testDeliveries[group].filter(t => iso(t.date) !== iso(d));
    replacedTestCount = before - testDeliveries[group].length;
    if (replacedTestCount > 0 &&
        inlineDeliveryState && inlineDeliveryState.group === group &&
        inlineDeliveryState.dateIso === iso(d)){
      inlineDeliveryState = null;
    }
  }

  saveSiloData(); schedulePush(); render();
  if (replacedTestCount > 0){
    showToast(`Delivery of ${amountT} t added on ${fmtShort(d)} — replaced ${replacedTestCount} test deliver${replacedTestCount === 1 ? 'y' : 'ies'}.`);
  } else {
    showToast(`Delivery of ${amountT} t added on ${fmtShort(d)}.`);
  }
}

function openManualPickupModal(shedId, editDateIso){

  const shed = farmData.sheds[shedId - 1];
  if (!shed) return;
  const pickups = shed.pickups || [];
  if (editDateIso){
    const p = pickups.find(x => iso(x.date) === editDateIso);
    if (!p) return;
    const avg = (p.totalWeightKg && p.birds) ? (p.totalWeightKg / p.birds) : null;
    manualPickupState = {
      shedId, mode: 'edit',
      originalDateIso: editDateIso,
      dateIso: iso(p.date),
      ageValue: pickupAge(shed, p),
      ageTouched: (p.ageOverride != null),
      birds: p.birds || '',
      avgWeight: avg != null ? Number(avg.toFixed(3)) : '',
      totalWeight: p.totalWeightKg != null ? Number(p.totalWeightKg.toFixed(2)) : '',

  const scrim = document.getElementById('syncScrim');
  modal.classList.add('open'); scrim.classList.add('open');

function refreshManualPickupCalc(){
  const s = manualPickupState;
  if (!s) return;
  const avgEl   = document.getElementById('mpAvg');
  const totalEl = document.getElementById('mpTotal');
  const birdsEl = document.getElementById('mpBirds');
  const avgChip   = document.getElementById('mpAvgChip');
  const totalChip = document.getElementById('mpTotalChip');
  if (!avgEl || !totalEl || !birdsEl) return;
  const birds = Number(birdsEl.value);
  const avgVal   = avgEl.value === '' ? null : Number(avgEl.value);
  const totalVal = totalEl.value === '' ? null : Number(totalEl.value);
  const birdsOK = Number.isFinite(birds) && birds > 0;
  const avgOK   = avgVal != null && Number.isFinite(avgVal) && avgVal > 0;
  const totalOK = totalVal != null && Number.isFinite(totalVal) && totalVal > 0;
  avgEl.classList.remove('auto-calc');
  totalEl.classList.remove('auto-calc');
  if (avgChip)   avgChip.style.display = 'none';
  if (totalChip) totalChip.style.display = 'none';
  if (s.lastEdited === 'avg' && birdsOK && avgOK){
    const computed = birds * avgVal;
    totalEl.value = computed.toFixed(2);
    totalEl.classList.add('auto-calc');
    if (totalChip) totalChip.style.display = '';
    s.totalWeight = computed; s.avgWeight = avgVal;
  } else if (s.lastEdited === 'total' && birdsOK && totalOK){
    const computed = totalVal / birds;
    avgEl.value = computed.toFixed(3);
    avgEl.classList.add('auto-calc');
    if (avgChip) avgChip.style.display = '';
    s.avgWeight = computed; s.totalWeight = totalVal;
  }
}
function saveManualPickup(){
  const s = manualPickupState;
  if (!s) return;
  const shed = farmData.sheds[s.shedId - 1];
  if (!shed) return;
  const dateStr  = document.getElementById('mpDate').value;
  const ageVal   = Number(document.getElementById('mpAge').value);
  const birdsVal = Number(document.getElementById('mpBirds').value);
  const avgVal   = Number(document.getElementById('mpAvg').value);
  const totalVal = Number(document.getElementById('mpTotal').value);
  const isFinal  = document.getElementById('mpFinal').checked;
  const dateObj = parseExcelDate(dateStr);
  if (!dateObj){ showToast('Pick a valid date.', true); return; }
  if (!Number.isFinite(birdsVal) || birdsVal <= 0){ showToast('Enter a valid number of birds.', true); return; }
  let avg = null, total = null;
  if (s.lastEdited === 'avg'){
    if (!Number.isFinite(avgVal) || avgVal <= 0){ showToast('Enter an average weight or a total weight.', true); return; }
    avg = avgVal; total = birdsVal * avg;
  } else {
    if (!Number.isFinite(totalVal) || totalVal <= 0){ showToast('Enter a total weight or an average weight.', true); return; }
    total = totalVal; avg = total / birdsVal;
  }
  const age = (Number.isFinite(ageVal) && ageVal >= 0) ? Math.floor(ageVal) : 0;
  const ageOverride = s.ageTouched ? age : null;
  const newPickup = {
    date: dateObj, birds: Math.floor(birdsVal), isFinal, variance: null,
    totalWeightKg: total, totalWeightKgFromExcel: null,
    totalWeightKgManual: true, source: 'manual', ageOverride
  };
  if (!shed.pickups) shed.pickups = [];
  if (s.mode === 'add'){
    if (shed.pickups.length >= MAX_PICKUPS_PER_SHED){
      showToast(`This shed already has ${MAX_PICKUPS_PER_SHED} pickups.`, true); return;
    }
    const dup = shed.pickups.find(p => iso(p.date) === iso(dateObj));
    if (dup){ if (!confirm('A pickup already exists for this date. Add another anyway?')) return; }
    shed.pickups.push(newPickup);
  } else {
    const idx = shed.pickups.findIndex(p => iso(p.date) === s.originalDateIso);
    if (idx < 0){ showToast('Pickup not found.', true); return; }
    const original = shed.pickups[idx];
    newPickup.source = original.source || 'excel';
    newPickup.totalWeightKgFromExcel = original.totalWeightKgFromExcel;
    if (newPickup.source === 'manual'){ newPickup.totalWeightKgManual = true; }
    else {
      newPickup.totalWeightKgManual = (original.totalWeightKgFromExcel == null)
        ? true
        : (Math.abs(Number(total) - Number(original.totalWeightKgFromExcel)) > 0.01);
    }
    shed.pickups[idx] = newPickup;
  }
  reflowShedPickups(shed);
  reconcilePredictedPickups(shed);
  saveState(); schedulePush();
  closeManualPickupModal();
  render();
  showToast(s.mode === 'add' ? '✅ Pickup added.' : '✅ Pickup updated.');
}
function reflowShedPickups(shed){
  if (!shed || !Array.isArray(shed.pickups)) return;
  shed.pickups.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  let finalSeen = false;
  for (const p of shed.pickups){
    if (p.isFinal && !finalSeen) finalSeen = true;
    else if (p.isFinal && finalSeen) p.isFinal = false;
  }
  const fp = shed.pickups.find(p => p.isFinal);
  if (fp){
    shed.cleanoutDate = dateOnly(fp.date);
    const totalPicked = shed.pickups.reduce((sum,p) => sum + (Number(p.birds) || 0), 0);
    shed.mortality = Math.max(0, (shed.initialPopulation || 0) - totalPicked);
  }
}
function deleteManualPickup(shedId, dateIso){
  if (!farmData) return;
  const shed = farmData.sheds[shedId - 1];
  if (!shed) return;
  const p = (shed.pickups || []).find(x => iso(x.date) === dateIso);
  if (!p) return;
  const label = p.source === 'manual' ? 'manually-entered' : 'Excel-imported';
  if (!confirm(`Delete this ${label} pickup from ${fmtShort(p.date)}?`)) return;
  shed.pickups = (shed.pickups || []).filter(x => iso(x.date) !== dateIso);
  reflowShedPickups(shed);
  reconcilePredictedPickups(shed);
  saveState(); schedulePush(); render();
  showToast('Pickup deleted.');
}

function openPredictedPickupModal(shedId, editId){
  if (!farmData) return;
  const shed = farmData.sheds[shedId - 1];
  if (!shed) return;
  const ds = getShedDensitySettings(shed);
  const cleanout = shed.cleanoutDate ? dateOnly(shed.cleanoutDate) : null;
  if (editId){
    const pp = (shed.predictedPickups || []).find(x => x.id === editId);
    if (!pp) return;
    predictedPickupState = {
      shedId, mode: 'edit', editId,
      dateIso: iso(pp.date),
      birds: pp.birds,
      isFinal: !!pp.isFinal,
      userEditedBirds: true
    };
  } else {
    if ((shed.predictedPickups || []).length >= MAX_PREDICTED_PICKUPS){
      showToast(`Maximum ${MAX_PREDICTED_PICKUPS} predicted pickups per shed.`, true);
      return;
    }
    let defaultDate = addDays(new Date(), 7);
    if (shed.placementDate){
      let cursor = addDays(new Date(), 1);
      const maxDate = cleanout || addDays(new Date(), 40);
      while (cursor <= maxDate){
        const info = densityOnDate(shed, cursor);
        if (info.density >= ds.triggerDensity){ defaultDate = cursor; break; }
        cursor = addDays(cursor, 1);
      }
    }
    predictedPickupState = {
      shedId, mode: 'add', editId: null,
      dateIso: iso(defaultDate),
      birds: null,
      isFinal: false,
      userEditedBirds: false
    };
  }
  renderPredictedPickupModal();
  const modal = document.getElementById('predictedPickupModal');
  const scrim = document.getElementById('syncScrim');
  modal.classList.add('open'); scrim.classList.add('open');
}

  document.getElementById('predictedPickupModal').classList.remove('open');
  predictedPickupState = null;

}

      if (birdsEl) birdsEl.value = s.birds;

    autoFillBirds();

function savePredictedPickup(){
  const s = predictedPickupState;
  if (!s) return;
  const shed = farmData.sheds[s.shedId - 1];
  if (!shed) return;
  const dateStr = document.getElementById('ppDate').value;
  const birdsStr = document.getElementById('ppBirds').value;
  let dateObj;
  if (s.isFinal){
    if (!shed.cleanoutDate){
      showToast('Set the shed\'s cleanout date first.', true);
      return;
    }
    dateObj = dateOnly(shed.cleanoutDate);
  } else {
    dateObj = parseExcelDate(dateStr);
  }
  if (!dateObj){ showToast('Pick a valid date.', true); return; }
  let birds = Number(birdsStr);
  if (!Number.isFinite(birds) || birds < 0) birds = 0;
  const realMatch = (shed.pickups || []).some(rp => iso(rp.date) === iso(dateObj));
  if (realMatch){
    showToast('A real pickup already exists on this date — predicted pickup not saved.', true);
    return;
  }
  if (!shed.predictedPickups) shed.predictedPickups = [];

      birds: Math.floor(birds),

    });

    shed.predictedPickups[idx] = {

      isFinal: !!s.isFinal
    };

function autoFillPredictedPickupsForShed(shedId){

function autoFillAllSheds(){
  if (!farmData){
    showToast('Import Excel first.', true);
    return;
  }
  const placed = farmData.sheds.filter(s => s.placementDate && s.initialPopulation > 0);
  if (placed.length === 0){
    showToast('No sheds are placed yet.', true);
    return;
  }
  const eligible = placed.filter(s => !(s.pickups || []).some(p => p.isFinal));
  const skipped = placed.length - eligible.length;
  if (eligible.length === 0){
    showToast('All sheds already have their cleanout pickup recorded.', true);
    return;
  }
  if (!confirm(`Auto-fill predicted pickups for ${eligible.length} placed shed${eligible.length === 1 ? '' : 's'}?\n\nExisting predicted pickups will be replaced.${skipped > 0 ? `\n\n(${skipped} shed${skipped === 1 ? '' : 's'} skipped — cleanout already recorded.)` : ''}`)) return;
  let totalRegular = 0, totalFinal = 0, shedsTouched = 0;
  for (const shed of eligible){
    const generated = autoFillPredictedPickups(shed);
    shed.predictedPickups = generated;
    totalRegular += generated.filter(g => !g.isFinal).length;
    totalFinal += generated.filter(g => g.isFinal).length;
    if (generated.length > 0) shedsTouched++;
  }
  saveState(); schedulePush(); render();
  const total = totalRegular + totalFinal;
  if (total === 0){
    showToast('Auto-fill produced no pickups — check placement dates and density settings.', true);
  } else {
    showToast(`✨ Auto-filled ${totalRegular} regular + ${totalFinal} cleanout pickup${total === 1 ? '' : 's'} across ${shedsTouched} shed${shedsTouched === 1 ? '' : 's'}.`);
  }
}

function detectPickupCollisions(currentFarmData, incomingSheds){
  const result = { hasAny: false, byShed: {} };
  if (!currentFarmData || !Array.isArray(currentFarmData.sheds)) return result;
  for (const inc of incomingSheds){
    const cur = currentFarmData.sheds[inc.id - 1];
    if (!cur || !cur.pickups || cur.pickups.length === 0) continue;
    const curDates = new Map();
    cur.pickups.forEach(p => curDates.set(iso(p.date), p));
    const incPickups = inc.pickups || [];
    const incDates = new Set(incPickups.map(p => iso(p.date)));
    const conflicts = [], newOnly = [], existingOnly = [];
    for (const ip of incPickups){
      const k = iso(ip.date);
      if (curDates.has(k)) conflicts.push({ dateIso: k, existing: curDates.get(k), imported: ip });
      else newOnly.push(ip);
    }
    for (const cp of cur.pickups){
      const k = iso(cp.date);
      if (!incDates.has(k)) existingOnly.push(cp);
    }
    if (conflicts.length > 0){
      result.hasAny = true;
      result.byShed[inc.id] = { shedId: inc.id, conflicts, newOnly, existingOnly };
    }
  }
  return result;
}

function finalizeImport(mode){
  if (!pendingImport) return;
  const { file, result, manualTargets, shedRates, shedSamples, shedChickWeights, shedPredictedPickups, shedTargetPickups } = pendingImport;
  const reviewMap = mode === 'review' ? { ...reviewChoices } : null;
  pendingImport = null;
  reviewChoices = {};

  let removedPredictedCount = 0;

  const finalSheds = result.sheds.map(inc => {
    const cur = farmData ? farmData.sheds[inc.id - 1] : null;
    const curPickups = (cur && cur.pickups) ? cur.pickups : [];
    const incPickups = inc.pickups || [];
    let finalPickups;
    if (!cur || curPickups.length === 0){
      finalPickups = incPickups.map(p => ({ ...p }));
    } else if (mode === 'replace'){
      finalPickups = incPickups.map(p => ({ ...p }));
    } else if (mode === 'skip'){
      finalPickups = curPickups.map(p => ({ ...p }));
    } else {
      const incMap = new Map();
      incPickups.forEach(p => incMap.set(iso(p.date), p));
      const curMap = new Map();
      curPickups.forEach(p => curMap.set(iso(p.date), p));
      const allDates = new Set([...incMap.keys(), ...curMap.keys()]);
      finalPickups = [];
      for (const dk of allDates){
        const c = curMap.get(dk);
        const i = incMap.get(dk);
        if (c && i){
          const key = `${inc.id}|${dk}`;
          const choice = reviewMap[key] || 'existing';
          finalPickups.push(choice === 'imported' ? { ...i } : { ...c });
        } else if (i){ finalPickups.push({ ...i }); }
        else if (c){ finalPickups.push({ ...c }); }
      }
    }
    finalPickups.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
    let finalSeen = false;
    for (const p of finalPickups){
      if (p.isFinal && !finalSeen) finalSeen = true;
      else if (p.isFinal && finalSeen) p.isFinal = false;
    }
    if (finalPickups.length === 5 && !finalPickups.some(p => p.isFinal)) finalPickups[4].isFinal = true;

    const tc = manualTargets[inc.id] ? { ...manualTargets[inc.id] } : inc.targetCurve;
    const rate = (shedRates && shedRates[inc.id] != null)
      ? shedRates[inc.id]
      : (inc.mortalityRatePercent != null ? inc.mortalityRatePercent : DEFAULT_MORT_RATE_PCT);
    const cw = (shedChickWeights && shedChickWeights[inc.id] != null)
      ? shedChickWeights[inc.id]
      : (inc.chickWeightKg != null ? inc.chickWeightKg : DEFAULT_CHICK_WEIGHT_KG);
    const samples = (shedSamples && shedSamples[inc.id]) ? shedSamples[inc.id] : [];
    const tpPrev = (cur && cur.targetPickups != null) ? cur.targetPickups
                : (shedTargetPickups && shedTargetPickups[inc.id] != null) ? shedTargetPickups[inc.id]
                : null;
    const tp = (tpPrev != null && Number.isFinite(Number(tpPrev)))
      ? Math.max(MIN_PICKUPS_PER_SHED, Math.min(MAX_PICKUPS_PER_SHED, Math.floor(Number(tpPrev))))
      : null;

    let predicted = (shedPredictedPickups && shedPredictedPickups[inc.id])
      ? shedPredictedPickups[inc.id].map(x => ({ ...x }))
      : ((cur && cur.predictedPickups) ? cur.predictedPickups.map(x => ({ ...x })) : []);

    let cleanoutDate = inc.cleanoutDate;
    let mortality = inc.mortality;
    const fp = finalPickups.find(p => p.isFinal);
    if (fp){
      cleanoutDate = dateOnly(fp.date);
      const totalPicked = finalPickups.reduce((sum,p) => sum + (Number(p.birds) || 0), 0);
      mortality = Math.max(0, (inc.initialPopulation || 0) - totalPicked);
    }

    const realDates = new Set(finalPickups.map(p => iso(p.date)));
    const hasRealFinal = finalPickups.some(p => p.isFinal);
    if (hasRealFinal){
      removedPredictedCount += predicted.length;
      predicted = [];
    } else {
      const before = predicted.length;
      predicted = predicted.filter(pp => !realDates.has(iso(pp.date)));
      removedPredictedCount += (before - predicted.length);
      if (cleanoutDate){
        predicted.forEach(pp => { if (pp.isFinal) pp.date = dateOnly(cleanoutDate); });
        predicted.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
      }
    }

    const densitySettings = (cur && cur.densitySettings) ? { ...cur.densitySettings } : { useGlobal: true, maxDensity: null, triggerDensity: null, targetDensity: null };
    return {
      ...inc,
      pickups: finalPickups,
      predictedPickups: predicted,
      targetPickups: tp,
      densitySettings,
      targetCurve: tc,
      cleanoutDate, mortality,
      mortalityRatePercent: rate,
      chickWeightKg: cw,
      inYardSamples: samples
    };
  });

  if (!predState.batchNumber && result.batchNumber){
    predState.batchNumber = sanitizeBatchNumber(result.batchNumber);
    savePredState();
  }
  farmData = {
    batchNumber: predState.batchNumber || result.batchNumber || '',
    importDate: new Date().toISOString(),
    fileName: file.name,
    biasFactor: (farmData && farmData.biasFactor) ? farmData.biasFactor : DEFAULT_BIAS_FACTOR,
    sheds: finalSheds
  };
  activeTab = 'g1';
  saveState();
  (async () => {
    if (syncFarmName && syncConnectedAt){ await uploadExcelToCloud(file); }
    else { schedulePush(); }
    render();
    const manualTargetCount = Object.keys(manualTargets).length;
    const modeLabel = mode === 'replace' ? 'replaced' : (mode === 'skip' ? 'kept existing' : 'merged');
    showToast(
      `✅ Imported ${result.matched} shed${result.matched === 1 ? '' : 's'}` +
      (result.skipped ? ` · ${result.skipped} row(s) skipped` : '') +
      ` · pickups ${modeLabel}` +
      (manualTargetCount > 0 ? ` · kept ${manualTargetCount} in-yard curve${manualTargetCount === 1 ? '' : 's'}` : '') +
      (removedPredictedCount > 0 ? ` · removed ${removedPredictedCount} predicted pickup${removedPredictedCount === 1 ? '' : 's'}` : '') +
      (farmData.batchNumber ? ` · Batch ${farmData.batchNumber}` : '')
    );
  })();
}
function triggerImport(){
  const input = document.getElementById('excelFile');

async function handleFile(file){
  if (!file) return;
  if (typeof XLSX === 'undefined'){ showToast('Excel reader not available. Check your internet connection.', true); return; }
  if (file.size > MAX_EXCEL_WARN_BYTES){
    const mb = (file.size / (1024*1024)).toFixed(1);
    if (!confirm(`This file is ${mb} MB — larger than usual.\n\nLoading and cloud upload may take a few seconds.\n\nContinue?`)) return;
  }
  try {
    const manualTargets = {}, shedRates = {}, shedSamples = {}, shedChickWeights = {}, shedPredictedPickups = {}, shedTargetPickups = {};
    if (farmData && Array.isArray(farmData.sheds)){
      farmData.sheds.forEach(s => {
        const tc = s.targetCurve || {};
        if (tc[7] || tc[14] || tc[21] || tc[28]){ manualTargets[s.id] = { ...tc }; }
        if (s.mortalityRatePercent != null && Number.isFinite(Number(s.mortalityRatePercent))){
          shedRates[s.id] = Number(s.mortalityRatePercent);
        }
        if (s.chickWeightKg != null && Number.isFinite(Number(s.chickWeightKg)) && s.chickWeightKg > 0){
          shedChickWeights[s.id] = Number(s.chickWeightKg);
        }
        if (Array.isArray(s.inYardSamples) && s.inYardSamples.length > 0){
          shedSamples[s.id] = s.inYardSamples.map(x => ({ ...x }));
        }
        if (Array.isArray(s.predictedPickups) && s.predictedPickups.length > 0){
          shedPredictedPickups[s.id] = s.predictedPickups.map(x => ({ ...x }));
        }
        if (s.targetPickups != null && Number.isFinite(Number(s.targetPickups))){
          shedTargetPickups[s.id] = Number(s.targetPickups);
        }
      });
    }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const result = parseShedsFromWorkbook(wb);
    const collisions = detectPickupCollisions(farmData, result.sheds);
    if (collisions.hasAny){
      pendingImport = { file, result, manualTargets, shedRates, shedSamples, shedChickWeights, shedPredictedPickups, shedTargetPickups, collisions };
      openImportConflictModal();
      return;
    }
    pendingImport = { file, result, manualTargets, shedRates, shedSamples, shedChickWeights, shedPredictedPickups, shedTargetPickups, collisions: { hasAny: false, byShed: {} } };
    finalizeImport('replace');
  } catch (err){
    console.error(err);
    showToast('Import failed: ' + (err && err.message ? err.message : 'Unknown error.'), true);
  }
}

function updateShedField(shedIdx, key, rawValue){
  if (!farmData) return;
  const shed = farmData.sheds[shedIdx]; if (!shed) return;
  if (key === 'placementDate' || key === 'cleanoutDate'){
    shed[key] = rawValue ? parseExcelDate(rawValue) : null;
    if (key === 'cleanoutDate'){
      const fp = finalPickupOf(shed);
      if (fp) shed.cleanoutDate = dateOnly(fp.date);
      reconcilePredictedPickups(shed);
    }
  } else if (key === 'initialPopulation'){
    const n = Number(rawValue);
    shed.initialPopulation = Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
  } else if (key === 'mortality'){
    const n = Number(rawValue);
    shed.mortality = Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
  } else if (key === 'customFeedKg'){
    const s = String(rawValue ?? '').trim();
    if (s === '') shed.customFeedKg = null;
    else { const n = Number(s); shed.customFeedKg = (Number.isFinite(n) && n > 0) ? n : null; }
  } else if (key === 'mortalityRatePercent'){
    const n = Number(rawValue);
    if (Number.isFinite(n) && n >= 0) shed.mortalityRatePercent = Math.max(0, Math.min(MAX_MORT_RATE_PCT, n));
  } else if (key === 'chickWeightGrams'){
    const n = Number(rawValue);
    if (Number.isFinite(n) && n > 0){
      const kg = n / 1000;
      if (kg >= MIN_CHICK_WEIGHT_KG && kg <= MAX_CHICK_WEIGHT_KG) shed.chickWeightKg = kg;
    }
  }
  saveState(); schedulePush(); scheduleRender(60);
}

function setPickupTotalWeight(shedId, pickupDateIso, value){

/* ---------- Main Rendering ---------- */
function scheduleRender(delay = 50){
  const active = document.activeElement;
  const activeId = active ? active.id : null;
  let selStart = null, selEnd = null;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')){
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
  }
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    render();
    if (activeId){
      const el = document.getElementById(activeId);
      if (el){
        el.focus();
        if (selStart != null && typeof el.setSelectionRange === 'function'){
          try { el.setSelectionRange(selStart, selEnd); } catch(e){}
        }

function rangeLabel(range){
  if (range.start === -7 && range.end === 0)  return 'Last 7 days';
  if (range.start === 0  && range.end === 0)  return 'Today only';
  if (range.start === 0  && range.end === 7)  return 'Next 7 days';
  if (range.start === 0  && range.end === 14) return 'Next 14 days';
  if (range.start === 0  && range.end === 21) return 'Next 21 days';
  if (range.start < 0 && range.end === 0) return `Last ${Math.abs(range.start)} days`;
  if (range.start === 0 && range.end > 0) return `Next ${range.end} days`;
  return `${range.start} to ${range.end} days`;
}

function renderShedForecastTable(shed, forecast){

  }
  const rows = forecast.rows.map(r => {
    const weekend = isWeekend(r.date);
    const rowClasses = [
      weekend ? 'is-weekend' : '',
      r.isPast ? 'is-past' : '',
      r.isToday ? 'is-today' : '',
      r.pickupsBirds > 0 && !r.hasPredicted ? 'pickup-day' : '',
      r.hasPredicted ? 'predicted-pickup-day' : '',

    ].filter(Boolean).join(' ');

    </div>`;

function renderSiloForecastTable(forecast, group){
  if (forecast.rows.length === 0) return `<div class="forecast-empty">No forecast available.</div>`;
  const hasReading = forecast.rows.some(r => r.balance !== null);
  const rows = forecast.rows.map(r => {
    const baseClickable = !r.isPast && !r.isWeekend;
    const hasRealDelivery = (r.deliveries || []).some(d => !d.isTest);
    const isBlocked = baseClickable && hasRealDelivery;
    const isClickable = baseClickable && !hasRealDelivery;
    const isInlineOpen = inlineDeliveryState &&
      inlineDeliveryState.group === group &&
      inlineDeliveryState.dateIso === iso(r.date) &&
      isClickable;
    const rowClasses = [
      r.isWeekend ? 'is-weekend' : '',
      r.isPast ? 'is-past' : '',
      r.isToday ? 'is-today' : '',
      r.delivery > 0 ? 'pickup-day' : '',
      isClickable ? 'fdr-clickable' : '',
      isBlocked ? 'fdr-blocked' : '',
      isInlineOpen ? 'fdr-open' : ''
    ].filter(Boolean).join(' ');
    const clickAttrs = baseClickable
      ? ` data-forecast-date="${iso(r.date)}" data-forecast-group="${group}"${isBlocked ? ' data-blocked="1"' : ''}`
      : '';

    let deliveryCell = '—';
    if (r.delivery > 0){
      const realDels = r.deliveries.filter(d => !d.isTest);
      const testDels = r.deliveries.filter(d => d.isTest);
      const chunks = [];
      if (realDels.length){
        const realKg = realDels.reduce((s,x) => s + (Number(x.amountKg) || 0), 0);
        const types = Array.from(new Set(realDels.map(d => d.feedType).filter(Boolean)));
        const typeTags = types.map(t => feedTypeTagHtml(t)).join('');
        chunks.push(`<span class="delivery-pill">+${(realKg / 1000).toFixed(1)} t</span>${typeTags ? ' ' + typeTags : ''}`);
      }
      testDels.forEach(td => {
        const kg = Number(td.amountKg) || 0;
        chunks.push(`<span class="delivery-pill test">🚜 +${(kg/1000).toFixed(1)} t</span><button class="test-x" type="button" data-remove-test="${group}|${td.id}" title="Remove this test delivery">✕</button>`);
      });
      deliveryCell = chunks.join(' ');
    }

    if (isInlineOpen){
      deliveryCell += `
        <div class="inline-del">
          <input type="number" class="inline-del-input" placeholder="tonnes" min="0.1" step="0.1" value="" />
          <button type="button" class="inline-del-btn test" data-inline-test="${group}|${iso(r.date)}" title="Add as test delivery (no feed type, session only)">🚜 Test</button>
          <button type="button" class="inline-del-btn actual" data-inline-actual="${group}|${iso(r.date)}" title="Record as actual delivery">✅ Actual</button>
          <button type="button" class="inline-del-btn cancel" data-inline-cancel="1" title="Cancel">✕</button>
        </div>`;
    }

    let balCell = '—';
    let balCls = '';
    let statusCell = '';
    if (r.balance !== null){
      const bal = r.balance;
      balCls = bal > 0 ? 'balance-pos' : 'balance-neg';
      balCell = Math.round(bal).toLocaleString() + ' kg';
      if (r.isPast) statusCell = '<span class="tag muted">Actual</span>';
      else if (bal <= 0 && r.consumption > 0) statusCell = '<span class="tag red">Empty</span>';
      else if (bal < 5000) statusCell = '<span class="tag amber">Low</span>';
    }
    const todayTag = r.isToday ? ' · <span style="color:var(--secondary);font-weight:700;">Today</span>' : '';
    const weekendTag = r.isWeekend ? ' <span class="weekend-pill">Weekend</span>' : '';

    const ages = shedAgesAtDateForGroup(group, r.date);
    const agesStr = formatAgesPair(ages);

    return `
      <tr class="${rowClasses}"${clickAttrs}>
        <td>${fmtShort(r.date)}${todayTag}${weekendTag}</td>
        <td class="num">${agesStr}</td>
        <td class="num">${Math.round(r.consumption).toLocaleString()} kg</td>
        <td>${deliveryCell}</td>
        <td class="num ${balCls}">${balCell}</td>
        <td>${statusCell}</td>
      </tr>`;
  }).join('');
  return `
    <div class="forecast-table-wrap">
      <table class="forecast-table" style="min-width:700px;">
        <thead><tr><th>Date</th><th class="num">Age</th><th class="num">Daily Feed</th><th>Delivery</th>
          <th class="num">End Balance</th><th>Status</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td colspan="2">Totals</td>
            <td class="num">${fmtFeed(forecast.totalConsumption)}</td>
            <td>${forecast.totalDelivered > 0 ? '+' + fmtFeed(forecast.totalDelivered) : '—'}</td>
            <td class="num ${(forecast.endBalance || 0) > 0 ? 'balance-pos' : 'balance-neg'}">${forecast.endBalance !== null ? fmtFeed(forecast.endBalance) : '—'}</td>
            <td>${hasReading ? (forecast.shortfall > 0 ? '<span class="tag red">Shortfall</span>' : '<span class="tag green">OK</span>') : '<span class="tag muted">—</span>'}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

function updateFarmKpiValues(){
  const t = computeFarmTotals();

  if (!t.hasData) return;
  set('kpiLiveWeight', fmtKgAlways(t.totalLiveWeight));
  set('kpiFeed', fmtTonnesAlways(t.totalFeed));
  const sub = el('kpiFeedSub');
  if (sub){ sub.textContent = farmFeedSubText(t); }
  set('kpiFCR', t.fcr.toFixed(3));

  if (msub) msub.textContent = `${t.totalCurrentMortality.toLocaleString()} recorded now · est. ${t.estMortRate.toFixed(2)}% of placed`;

function renderInYardCurvePanel(shed){
  const tc = shed.targetCurve || {};
  const fit = getShedGompertzFit(shed);
  const hasFit = !!fit;
  const samples = shed.inYardSamples || [];
  const biasPct = (currentBiasFactor() * 100).toFixed(0);

  const inputs = TARGET_DAYS.map(day => {
    const v = tc[day];
    const filled = v != null && Number.isFinite(Number(v)) && Number(v) > 0;
    const ref = rossWeightKg(day).toFixed(3);
    let warn = false;
    if (filled){
      const num = Number(v);
      if (num < ROSS_308_WEIGHTS_KG[0] || num > 6) warn = true;
      const prevDay = TARGET_DAYS[TARGET_DAYS.indexOf(day) - 1];
      if (prevDay != null){
        const prevV = tc[prevDay];
        if (prevV != null && Number.isFinite(Number(prevV)) && Number(prevV) > 0 && num <= Number(prevV)) warn = true;
      }
    }
    const cls = warn ? 'warn' : (filled ? 'filled' : '');
    return `
      <div class="ptc-input">
        <label>Day ${day}</label>
        <div class="ptc-field">
          <input type="number" step="0.001" min="0" placeholder="${ref}"
            value="${filled ? Number(v).toFixed(3) : ''}"
            class="${cls}"
            data-target-shed="${shed.id}" data-target-day="${day}"
            title="Standard: ${ref} kg" />
          <span class="unit">kg</span>
        </div>
        <span class="ref">Standard: ${ref} kg</span>
      </div>`;
  }).join('');

  let customRows = '';
  if (samples.length > 0){
    customRows = `
      <div class="custom-day-list">
        <div class="custom-day-list-title">Extra reading days</div>
        ${samples.map((x, i) => {
          const age = sampleAge(shed, x);
          const officialBadge = x.isOfficial ? '<span class="tag official-source" style="font-size:9px;padding:1px 6px;">Plant</span>' : '';
          return `
            <div class="custom-day-row">
              <span class="cd-day">Day ${age}</span>
              <span class="cd-date">${fmtShortNoYear(x.date)}</span>
              ${officialBadge}
              <span class="cd-weight">${x.avgWeightKg.toFixed(3)} kg</span>
              <span class="cd-actions">
                <button class="edit" type="button" data-sample-edit="${shed.id}|${i}" title="Edit">✎</button>
                <button class="del" type="button" data-sample-delete="${shed.id}|${i}" title="Delete">✕</button>
              </span>
            </div>`;
        }).join('')}
      </div>`;
  }

  let sourcePill, sourceText;
  if (hasFit){
    sourcePill = '<span class="pill gompertz">AI curve</span>';
    const nGrid = TARGET_DAYS.filter(d => tc[d] > 0).length;
    const nCustom = samples.length;
    const nPickups = (shed.pickups || []).filter(p => pickupAvgKg(p)).length;
    const parts = [];
    if (nGrid > 0) parts.push(`${nGrid} check-day${nGrid === 1 ? '' : 's'}`);
    if (nCustom > 0) parts.push(`${nCustom} extra reading${nCustom === 1 ? '' : 's'}`);
    if (nPickups > 0) parts.push(`${nPickups} pickup weight${nPickups === 1 ? '' : 's'}`);
    sourceText = `Based on <strong>${parts.join(' + ') || 'chick weight only'}</strong>`;
  } else {
    const nTotal = TARGET_DAYS.filter(d => tc[d] > 0).length + samples.length;
    if (nTotal === 0){
      sourcePill = '<span class="pill standard">Standard curve</span>';
      sourceText = 'Enter your shed scale readings above to sharpen the forecast';
    } else if (nTotal === 1){
      sourcePill = '<span class="pill target">Reading only</span>';
      sourceText = 'One reading logged — enter more to unlock the AI curve';
    } else {
      sourcePill = '<span class="pill target">Adjusted standard</span>';
      sourceText = 'Not enough readings for the AI curve — using the adjusted standard curve';
    }
  }

  return `
    <div class="pred-target-curve">
      <div class="ptc-head">
        <span class="ptc-title">📏 In-Yard Growth Curve</span>
        <button class="btn-sample-add" data-sample-add="${shed.id}" type="button" title="Add a reading for a day other than 7/14/21/28">

      </div>

}
