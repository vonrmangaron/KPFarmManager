<html lang="en">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --surface-soft:#F6F1E8; --line:#E8DFD1;
  --ink:#2B2116; --muted:#8C7B68;
  --primary:#E0A339; --primary-dark:#A8721F; --primary-soft:#F6E4C1;
  --secondary:#B08463; --secondary-soft:#F0E4D6;
  --danger:#C1502E; --danger-soft:#F5DDD2;
  --success:#4C7A3B; --success-soft:#E4EFDD;
  --past-row: rgba(140,123,104,0.06);
  --pickup-row: #FCF6E6;
  --pickup-final-row: #F8ECD0;
  --weekend-tint: rgba(249,115,22,0.22);
  --weekend-border: #EA580C;
  --shadow-sm:0 1px 2px rgba(43,33,22,0.06);
  --shadow-md:0 8px 22px rgba(43,33,22,0.09);
  --shadow-lg:0 16px 40px rgba(43,33,22,0.16);
}
body.theme-dark{
  --bg:#1A2438; --surface:#28324D; --surface-soft:#212A42; --line:#3C4869;
  --ink:#EAEEF7; --muted:#9AA6BE;
  --primary:#F0A840; --primary-dark:#FFC876; --primary-soft:#3D3320;
  --secondary:#6FA8E8; --secondary-soft:#20304E;
  --danger:#F0685A; --danger-soft:#3A2321;
  --success:#6FB85C; --success-soft:#24382A;
  --past-row: rgba(154,166,190,0.06);
  --pickup-row: rgba(240,168,64,0.14);
  --pickup-final-row: rgba(240,168,64,0.26);
  --weekend-tint: rgba(240,168,64,0.24);
  --weekend-border: #F97316;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.30);
  --shadow-md:0 8px 22px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;}
h1,h2,h3,h4,.brand,.btn-primary,.tab-btn,.fpill,.stab{font-family:'Sora',sans-serif;}

.shell{min-height:100%;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.brand{font-weight:700;font-size:20px;letter-spacing:0.1px;color:var(--ink);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.brand-icon{width:30px;height:30px;border-radius:7px;display:inline-block;
  vertical-align:middle;flex-shrink:0;}
.brand .accent{background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.theme-btn{border:1px solid var(--line);background:var(--surface-soft);
  color:var(--ink);width:40px;height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;transition:background .15s ease,transform .12s ease;}
.theme-btn:hover{background:var(--primary-soft);color:var(--primary-dark);transform:translateY(-1px);}

.sync-btn{border:1px solid var(--line);background:var(--surface-soft);
  color:var(--ink);height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;padding:0 14px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  transition:background .15s ease,transform .12s ease;max-width:220px;}
.sync-btn:hover{background:var(--primary-soft);color:var(--primary-dark);transform:translateY(-1px);}
.sync-btn.connected{border-color:var(--success);background:var(--success-soft);color:var(--success);}
.sync-btn.syncing{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);}
.sync-btn.error{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
.sync-btn .sync-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.sync-btn .sync-ico{font-size:15px;line-height:1;}
.sync-btn .sync-spin{animation:sync-spin 1s linear infinite;display:inline-block;}
@keyframes sync-spin{to{transform:rotate(360deg);}}

.new-batch-btn{border:1px solid var(--primary);background:var(--primary-soft);
  color:var(--primary-dark);height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:0 16px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  transition:background .15s ease,transform .12s ease,color .15s ease;
  white-space:nowrap;}
.new-batch-btn:hover{background:var(--primary);color:#fff;transform:translateY(-1px);}
body.theme-dark .new-batch-btn{border-color:var(--primary-dark);background:var(--primary-soft);color:var(--primary-dark);}
body.theme-dark .new-batch-btn:hover{background:var(--primary-dark);color:#1A2438;}

.batch-history-btn{border:1px solid var(--secondary);background:var(--secondary-soft);
  color:var(--secondary);height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:0 16px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  transition:background .15s ease,transform .12s ease,color .15s ease;
  white-space:nowrap;}
.batch-history-btn:hover{background:var(--secondary);color:#fff;transform:translateY(-1px);}
body.theme-dark .batch-history-btn{border-color:var(--secondary);background:var(--secondary-soft);color:var(--secondary);}
body.theme-dark .batch-history-btn:hover{background:var(--secondary);color:#1A2438;}

.sync-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:9999;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);
  width:460px;max-width:calc(100vw - 32px);max-height:88vh;
  display:none;flex-direction:column;overflow:hidden;}
.sync-modal.open{display:flex;}
.sync-modal.wide{width:540px;}
.sync-modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--line);}
.sync-modal-head h3{margin:0;font-size:16px;font-weight:800;
  display:flex;align-items:center;gap:8px;}
.sync-modal-head button{border:none;background:transparent;font-size:20px;
  color:var(--muted);cursor:pointer;line-height:1;}
.sync-modal-head button:hover{color:var(--danger);}
.sync-modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.sync-modal-body label{font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.sync-modal-body input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-soft);color:var(--ink);padding:11px 13px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:15px;}
.sync-modal-body input[type="text"]:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);}
.sync-hint{font-size:11.5px;color:var(--muted);line-height:1.5;}
.sync-hint strong{color:var(--danger);font-weight:700;}
.sync-status-card{background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.sync-status-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
.sync-status-row .lbl{color:var(--muted);font-weight:600;}
.sync-status-row .val{color:var(--ink);font-weight:700;font-family:'Sora',sans-serif;
  text-align:right;word-break:break-word;}
.sync-status-row .val.ok{color:var(--success);}
.sync-status-row .val.err{color:var(--danger);}
.sync-actions{display:flex;flex-direction:column;gap:8px;}
.sync-btn-row{display:flex;gap:8px;}
.sync-btn-row > *{flex:1;}
.btn-sync-primary{border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;
  padding:11px 18px;transition:filter .15s ease;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;}
.btn-sync-primary:hover{filter:brightness(1.06);}
.btn-sync-primary:disabled{opacity:0.5;cursor:default;filter:none;}
.btn-sync-primary.ghost{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line);}
.btn-sync-primary.ghost:hover{background:var(--primary-soft);color:var(--primary-dark);}
.btn-sync-primary.danger{background:linear-gradient(135deg,#C1502E,#8F3B22);}
body.theme-dark .btn-sync-primary{color:#1A2438;}
body.theme-dark .btn-sync-primary.ghost{color:var(--ink);}
.sync-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.3);
  z-index:9998;display:none;}
.sync-scrim.open{display:block;}

.new-batch-checkbox-label{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:10px;
  font-size:12.5px;
  color:var(--ink);
  cursor:pointer;
  text-transform:none;
  letter-spacing:0;
  font-weight:500;
  font-family:'Inter',sans-serif;
}
.new-batch-checkbox-label input[type="checkbox"]{
  width:16px;height:16px;accent-color:var(--primary-dark);cursor:pointer;flex-shrink:0;
}
.new-batch-checkbox-label:hover{background:var(--primary-soft);border-color:var(--primary-soft);}

.nb-question{
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:14.5px;
  color:var(--ink);
  margin:2px 0 -2px;
}

/* Batch History rows */
.batch-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.batch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:12px;
  transition:background .15s ease,border-color .15s ease,transform .1s ease;
}
.batch-row:hover{
  transform:translateY(-1px);
  border-color:var(--primary-soft);
}
.batch-row.current{
  background:linear-gradient(135deg,rgba(76,122,59,0.10),rgba(76,122,59,0.04));
  border-color:var(--success);
}
.batch-row-info{flex:1;min-width:0;}
.batch-row-title{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  font-family:'Sora',sans-serif;
  font-weight:800;
  font-size:14px;
  color:var(--ink);
}
.batch-row.current .batch-row-title{color:var(--success);}
.batch-current-badge{
  display:inline-block;
  font-size:9.5px;
  font-weight:800;
  padding:2px 7px;
  border-radius:999px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  background:var(--success);
  color:#fff;
  font-family:'Sora',sans-serif;
}
.batch-row-meta{
  font-size:11.5px;
  color:var(--muted);
  margin-top:3px;
}
.batch-row-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}
.batch-open-btn{
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:12.5px;
  padding:7px 14px;
  cursor:pointer;
  transition:filter .12s ease,transform .1s ease;
}
.batch-open-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
body.theme-dark .batch-open-btn{color:#1A2438;}
.batch-dl-btn{
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--muted);
  font-size:14px;
  padding:6px 10px;
  cursor:pointer;
  transition:background .12s ease,color .12s ease;
  line-height:1;
}
.batch-dl-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-soft);}
.batch-list-status{
  text-align:center;
  padding:24px 20px;
  color:var(--muted);
  font-size:13px;
  font-style:italic;
}
.batch-list-status.error{color:var(--danger);font-style:normal;}

/* Batch History pagination */
.batch-pagination{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  background:var(--surface-soft);
  border:1px solid var(--line);
  border-radius:10px;
  margin-top:4px;
}
.batch-page-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:12.5px;
  padding:7px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:background .12s ease, color .12s ease, border-color .12s ease, transform .1s ease;
  white-space:nowrap;
}
.batch-page-btn:hover:not(:disabled){
  background:var(--primary-soft);
  color:var(--primary-dark);
  border-color:var(--primary-soft);
  transform:translateY(-1px);
}
.batch-page-btn:disabled{
  opacity:0.4;
  cursor:default;
}
.batch-page-info{
  font-family:'Inter',sans-serif;
  font-size:12px;
  color:var(--muted);
  font-weight:600;
  text-align:center;
  flex:1;
  min-width:0;
}

.farm-found-body{padding:20px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.farm-found-icon{font-size:42px;line-height:1;text-align:center;margin-bottom:2px;}
.farm-found-title{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;
  text-align:center;color:var(--ink);margin-bottom:2px;}
.farm-found-title strong{color:var(--primary-dark);}
.farm-found-sub{font-size:12.5px;color:var(--muted);text-align:center;
  line-height:1.5;margin-bottom:4px;}
.farm-found-meta{background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.ff-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
.ff-row .lbl{color:var(--muted);font-weight:600;}
.ff-row .val{color:var(--ink);font-weight:700;font-family:'Sora',sans-serif;
  text-align:right;word-break:break-word;max-width:60%;}
.ff-choices{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.ff-choice{border:1px solid var(--line);background:var(--surface-soft);
  border-radius:12px;padding:12px 14px;cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;
  font-family:'Inter',sans-serif;transition:background .15s ease,transform .1s ease,border-color .15s ease;}
.ff-choice:hover{transform:translateY(-1px);}
.ff-choice .ff-icon{font-size:22px;line-height:1;flex-shrink:0;width:28px;text-align:center;}
.ff-choice .ff-choice-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:var(--ink);}
.ff-choice .ff-choice-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ff-choice.primary{background:linear-gradient(135deg,rgba(76,122,59,0.10),rgba(76,122,59,0.04));
  border-color:var(--success);}
.ff-choice.primary:hover{background:var(--success-soft);}
.ff-choice.primary .ff-choice-title{color:var(--success);}
.ff-choice.secondary{background:linear-gradient(135deg,rgba(176,132,99,0.10),rgba(176,132,99,0.04));
  border-color:var(--secondary);}
.ff-choice.secondary:hover{background:var(--secondary-soft);}
.ff-choice.secondary .ff-choice-title{color:var(--secondary);}
.ff-choice.danger{border-color:var(--danger-soft);}
.ff-choice.danger:hover{background:var(--danger-soft);}
.ff-choice.danger .ff-choice-title{color:var(--danger);}
.ff-cancel{border:none;background:transparent;color:var(--muted);
  font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;
  padding:8px;cursor:pointer;text-align:center;width:100%;}
.ff-cancel:hover{color:var(--danger);}

.batch-input{display:flex;align-items:center;gap:8px;background:var(--surface-soft);
  border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 14px;}
.batch-input label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.batch-input input{border:none;background:transparent;outline:none;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;
  color:var(--ink);min-width:110px;padding:3px 0;}
.batch-input input::placeholder{color:var(--muted);font-weight:500;}
.batch-input input[readonly]{color:var(--primary-dark);cursor:default;}

.btn-primary{border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:999px;
  box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:8px;
  transition:transform .12s ease,filter .12s ease;font-family:'Sora',sans-serif;}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);}
body.theme-dark .btn-primary{color:#1A2438;}

.btn-cloud{border:1.5px dashed var(--secondary);background:var(--secondary-soft);
  color:var(--secondary);cursor:pointer;font-weight:700;font-size:16px;
  padding:14px 28px;border-radius:14px;font-family:'Sora',sans-serif;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .15s ease,color .15s ease;}
.btn-cloud:hover{background:var(--secondary);color:#fff;}

.barn-stripe{height:4px;background:linear-gradient(90deg,var(--primary),var(--secondary));}

.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs{display:flex;gap:4px;padding:10px 0;min-width:max-content;}
.tab-btn{border:1px solid transparent;background:transparent;color:var(--muted);
  font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer;
  transition:background .15s ease,color .15s ease;white-space:nowrap;}
.tab-btn:hover{background:var(--surface-soft);color:var(--ink);}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;box-shadow:var(--shadow-sm);}
.tab-btn.tab-predictions{background:linear-gradient(135deg,rgba(76,122,59,0.14),rgba(76,122,59,0.06));
  color:var(--success);border:1px dashed var(--success);}
.tab-btn.tab-predictions:hover{background:var(--success-soft);}
.tab-btn.tab-predictions.active{background:linear-gradient(135deg,var(--success),#36602A);
  color:#fff;border-color:transparent;border-style:solid;}
body.theme-dark .tab-btn.active{color:#1A2438;}
body.theme-dark .tab-btn.tab-predictions.active{color:#1A2438;}

/* CluckWise tab — sits after the Predictions tab in the tabs nav */
.tab-btn.tab-cluckwise{
  background:linear-gradient(135deg,rgba(31,122,140,0.14),rgba(31,122,140,0.06));
  color:#1F7A8C;
  border:1px dashed #7BC9D4;
}
.tab-btn.tab-cluckwise:hover{
  background:#1F7A8C;
  color:#fff;
  border-color:#1F7A8C;
  border-style:solid;
}
body.theme-dark .tab-btn.tab-cluckwise{
  color:#8FD9E3;
  border-color:#3E7B87;
  background:linear-gradient(135deg,rgba(31,122,140,0.30),rgba(31,122,140,0.14));
}
body.theme-dark .tab-btn.tab-cluckwise:hover{

<script>
/* =========================================================
   ProdWise.VM
   - Ross 308 as-hatched curve (Aviagen 2022 combined M/F)
   - Mode-aware AI forecast (pickups → targets → standard)
   - Whole Farm KPI card with manual feed override
   - Per-shed density (fixed 3,162 m² floor area)
   - Per-batch cloud files (suffix added to file keys)
   - New Batch reset with 2-phase farm choice + JSON backup
   - Batch History browser with pagination (4 per page)
   - CluckWise as a tab in the top tabs row
========================================================= */

const STORAGE_KEY = 'prodwise_vm_phase2_v1';
const VIEW_KEY    = 'prodwise_vm_shedview_v1';
const THEME_KEY   = 'prodwise_vm_theme_v1';
const SILO_KEY_V2 = 'prodwise_vm_silo_v2';
const SILO_KEY    = 'prodwise_vm_silo_v3';
const SESSION_KEY = 'prodwise_session_init_v1';
const SYNC_FARMNAME_KEY = 'prodwise_sync_farmname_v1';
const PRED_KEY    = 'prodwise_predictions_v1';
const SHED_COUNT  = 8;
const FEED_BLOCK_T = 60;
const FIXED_FLOOR_AREA_M2 = 3162;

const CLUCKWISE_URL = './cluckwise/';
const SYNC_WORKER_URL = 'https://prodplan-sync.vonrmangaron.workers.dev';
const SYNC_REPO = 'vonrmangaron/farmdata';
const SYNC_SUFFIX = '-feed';
const SYNC_APP_TAG = 'prodwise';
const MAX_EXCEL_WARN_BYTES = 2 * 1024 * 1024;

const DEFAULT_VIEWS = { 1:'planner', 2:'planner', 3:'planner', 4:'planner' };
const CONE_KG   = 10000;
const RING_KG   = 8000;
const MAX_RINGS = 5;

const ROSS_308_WEIGHTS_KG = {
  0: 0.044, 7: 0.2135, 14: 0.533, 21: 1.012, 28: 1.6165,
  35: 2.2955, 42: 2.998, 49: 3.6815, 56: 4.318
};

const TARGET_DAYS = [7, 14, 21, 28];

function ringsToKg(r){
  if (r === null || r === undefined || r === '' || isNaN(r)) return 0;
  const n = Number(r);
  if (n < 0) return 0;
  if (n === 0) return CONE_KG;
  return CONE_KG + RING_KG * Math.min(MAX_RINGS, Math.floor(n));
}

const FEED_TYPES = [
  { id:'starter', label:'Starter' },
  { id:'grower', label:'Grower' },
  { id:'finisher', label:'Finisher' },
  { id:'withdrawal', label:'Withdrawal' }
];
function feedTypeLabel(id){
  const f = FEED_TYPES.find(x => x.id === id);
  return f ? f.label : 'Unspecified';
}
function feedTypeTagHtml(id){
  const cls = id && FEED_TYPES.some(f => f.id === id) ? id : 'unspecified';
  return `<span class="feed-tag ${cls}">${feedTypeLabel(id)}</span>`;
}

const ROSS_308_FEED_INTAKE = {
  1:19,2:15,3:19,4:24,5:28,6:33,7:37,8:42,9:47,10:51,
  11:56,12:60,13:65,14:69,15:74,16:78,17:83,18:88,19:92,20:97,
  21:101,22:106,23:110,24:115,25:119,26:124,27:129,28:133,29:138,30:142,
  31:147,32:151,33:156,34:160,35:165,36:170,37:174,38:179,39:183,40:188,
  41:192,42:197,43:201,44:206,45:211,46:215,47:220,48:223,49:225,50:227,
  51:229,52:230,53:231,54:233,55:233,56:234,57:234,58:234,59:234,60:234
};

const KEYS = {
  shedId:    ['Shed','shed','ShedId','Shed ID','ShedID','Shed#','Shed No','ShedNo'],
  batch:     ['BatchNumber','Batch Number','Batch','Batch#'],
  placement: ['PlacementDate','Placement Date','Placement','Placement_Dt'],
  cleanout:  ['CleanoutDate','Cleanout Date','Cleanout','Cleanout_Dt'],
  population:['InitialPopulation','Initial Population','Population','InitPop','InitialPop'],
  mortality: ['Mortality','MortalityCount','Mortality Count','TotalMortality'],
  customFeed:['CustomFeedKg','Custom Feed Kg','CustomFeed','Custom Feed'],
};

let farmData = null;
let activeTab = 'g1';
let shedRange = { start: 0, end: 0 };
let siloRange = { start: 0, end: 14 };
let shedViewByGroup = { ...DEFAULT_VIEWS };
let siloData = {
  1: { readings: [], deliveries: [] },
  2: { readings: [], deliveries: [] },
  3: { readings: [], deliveries: [] },
  4: { readings: [], deliveries: [] }
};
let predState = {
  beta: 0.27,
  targetHarvestWeightKg: { 1: 2.65, 2: 2.65, 3: 2.65, 4: 2.65 },
  predGroup: 1,
  predView: 'both',
  dailyRange: { start: 1, end: 52 },
  farmFeedOverride: null,
  deliveriesOpen: true,
  batchNumber: ''
};
let newBatchModalPhase = 'choice';   // 'choice' | 'batchNumber'
let batchHistoryCache = null;        // { farmName, files: [...] } after successful fetch
let batchHistoryPage = 0;

let renderTimer = null;

let syncFarmName = null;
let syncSha = null;
let syncExcelSha = null;
let syncExcelMeta = null;
let syncConnectedAt = null;
let syncLastSyncAt = null;
let syncState = 'idle';
let pushDebounceTimer = null;
let pushMaxWaitTimer = null;
let pushPending = false;
let pushInFlight = false;

/* ---------- Date helpers ---------- */
function dateOnly(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function iso(d){
  if (!d) return '';
  const x = dateOnly(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function addDays(d, n){ const x = new Date(dateOnly(d)); x.setDate(x.getDate()+n); return dateOnly(x); }
function daysBetween(a, b){ return Math.round((dateOnly(b) - dateOnly(a)) / 86400000); }
function isWeekend(d){ const day = dateOnly(d).getDay(); return day === 0 || day === 6; }
function isMilestoneDay(age){ return Number.isFinite(age) && age > 0 && age % 7 === 0; }
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(d){
  if (!d) return '—';
  const x = dateOnly(d);
  return `${WD[x.getDay()]} ${String(x.getDate()).padStart(2,'0')} ${MO[x.getMonth()]} ${x.getFullYear()}`;
}
function fmtShortNoYear(d){
  if (!d) return '—';
  const x = dateOnly(d);
  return `${WD[x.getDay()]} ${String(x.getDate()).padStart(2,'0')} ${MO[x.getMonth()]}`;
}
function todayIso(){ return iso(new Date()); }
function fmtRelativeTime(ts){
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'} ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
  const days = Math.floor(hrs / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}
function fmtBytes(n){
  if (!Number.isFinite(n) || n <= 0) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/1024/1024).toFixed(2)} MB`;
}

function parseExcelDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v.getTime())) return dateOnly(v);
  if (typeof v === 'number' && isFinite(v)){
    if (v <= 0) return null;
    const ms = Math.round((v - 25569) * 86400 * 1000);
    const utc = new Date(ms);
    return dateOnly(new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate()));
  }
  let s = String(v).trim();
  if (!s) return null;
  s = s.split(' ')[0].trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m){
    const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  s = s.replace(/[-.]/g, '/');
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m){
    const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if (m){
    const yy2 = Number(m[3]);
    const yy = yy2 <= 79 ? 2000 + yy2 : 1900 + yy2;
    const d = new Date(yy, Number(m[2])-1, Number(m[1]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  return null;
}
function isInvalidCleanout(v){
  if (v == null || v === '') return true;
  if (typeof v === 'number' && v === 0) return true;
  const s = String(v).trim();
  if (!s || s === '0/1/1900' || s === '1/1/1900' || s === '1900-01-01') return true;
  return parseExcelDate(v) === null;
}
function parseBool(v){
  const s = String(v ?? '').trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === 'y' || s === '1';
}
function getVal(row, keys){
  for (const k of keys){
    if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== ''){
      return row[k];
    }
  }
  return '';
}

/* ---------- Ross 308 curve ---------- */
function rossWeightKg(ageDays){
  if (!Number.isFinite(ageDays)) return ROSS_308_WEIGHTS_KG[0];
  if (ageDays <= 0) return ROSS_308_WEIGHTS_KG[0];
  if (ageDays >= 56) return ROSS_308_WEIGHTS_KG[56];
  const ages = Object.keys(ROSS_308_WEIGHTS_KG).map(Number).sort((a,b) => a-b);
  for (let i = 0; i < ages.length - 1; i++){
    const a0 = ages[i], a1 = ages[i+1];
    if (ageDays >= a0 && ageDays <= a1){
      const t = (ageDays - a0) / (a1 - a0);
      return ROSS_308_WEIGHTS_KG[a0] + t * (ROSS_308_WEIGHTS_KG[a1] - ROSS_308_WEIGHTS_KG[a0]);
    }
  }
  return ROSS_308_WEIGHTS_KG[56];
}

function findRossAgeForWeight(weightKg){
  const w = Number(weightKg);
  if (!Number.isFinite(w) || w <= ROSS_308_WEIGHTS_KG[0]) return 0;
  if (w >= ROSS_308_WEIGHTS_KG[56]) return 56;
  const ages = Object.keys(ROSS_308_WEIGHTS_KG).map(Number).sort((a,b) => a-b);
  for (let i = 0; i < ages.length - 1; i++){
    const a0 = ages[i], a1 = ages[i+1];
    const w0 = ROSS_308_WEIGHTS_KG[a0], w1 = ROSS_308_WEIGHTS_KG[a1];
    if (w >= w0 && w <= w1){
      const t = (w - w0) / (w1 - w0);
      return a0 + t * (a1 - a0);
    }
  }
  return 56;
}

/* ---------- Excel parse ---------- */
function parseShedsFromWorkbook(workbook){
  const sheetName =
    workbook.SheetNames.find(n => String(n).toLowerCase() === 'sheds')
    || workbook.SheetNames[0];
  if (!sheetName) throw new Error('No worksheet found in the file.');
  const ws = workbook.Sheets[sheetName];
  if (!ws) throw new Error('The worksheet appears to be empty.');

  const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false, dateNF: 'dd/mm/yyyy' });
  if (!rows.length) throw new Error('No data rows found in the file.');

  const sheds = Array.from({length: SHED_COUNT}, (_, i) => ({
    id: i + 1, placementDate: null, initialPopulation: 0, cleanoutDate: null,
    mortality: 0, customFeedKg: null, pickups: [],
    targetCurve: { 7: null, 14: null, 21: null, 28: null }
  }));

  let batchNumber = '', matched = 0, skipped = 0;

  for (const row of rows){
    const shedId = Number(getVal(row, KEYS.shedId));
    if (!Number.isFinite(shedId) || shedId < 1 || shedId > SHED_COUNT){ skipped++; continue; }
    const idx = shedId - 1;

    const bn = String(getVal(row, KEYS.batch) || '').trim();
    if (!batchNumber && bn) batchNumber = bn;

    const placement  = parseExcelDate(getVal(row, KEYS.placement));
    const population = Number(getVal(row, KEYS.population));
    const mortality  = Number(getVal(row, KEYS.mortality));
    const customFeed = Number(getVal(row, KEYS.customFeed));
    const cleanoutRaw = getVal(row, KEYS.cleanout);

    if (placement) sheds[idx].placementDate = placement;
    if (Number.isFinite(population) && population > 0) sheds[idx].initialPopulation = Math.floor(population);
    if (Number.isFinite(mortality)) sheds[idx].mortality = Math.floor(mortality);
    if (Number.isFinite(customFeed) && customFeed > 0) sheds[idx].customFeedKg = customFeed;

    let cleanout = parseExcelDate(cleanoutRaw);
    if (isInvalidCleanout(cleanoutRaw) && placement) cleanout = addDays(placement, 52);
    sheds[idx].cleanoutDate = cleanout;

    const pickups = [];
    for (let p = 1; p <= 5; p++){
      const dRaw = getVal(row, [`Pickup${p}Date`, `Pickup ${p} Date`, `P${p}Date`, `P${p} Date`]);
      const bRaw = getVal(row, [`Pickup${p}Birds`, `Pickup ${p} Birds`, `P${p}Birds`, `P${p} Birds`]);
      const fRaw = getVal(row, [`Pickup${p}Final`, `Pickup ${p} Final`, `P${p}Final`]);
      const vRaw = getVal(row, [`Pickup${p}Variance`, `Pickup ${p} Variance`, `P${p}Variance`]);
      const wRaw = getVal(row, [
        `Pickup${p}Weight`, `Pickup ${p} Weight`,
        `Pickup${p}TotalWeight`, `Pickup ${p} Total Weight`,
        `Pickup${p}TotalWt`, `Pickup ${p} Total Wt`,
        `P${p}Weight`, `P${p} Weight`
      ]);
      const d = parseExcelDate(dRaw);
      const b = Number(bRaw);
      const w = Number(wRaw);
      if (d && Number.isFinite(b) && b > 0){
        const totalWeight = (Number.isFinite(w) && w > 0) ? w : null;
        pickups.push({
          date: d, birds: Math.floor(b),
          isFinal: parseBool(fRaw),
          variance: Number.isFinite(Number(vRaw)) ? Number(vRaw) : null,
          totalWeightKg: totalWeight,
          totalWeightKgFromExcel: totalWeight,
          totalWeightKgManual: false
        });
      }
    }

    pickups.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
    let finalSeen = false;
    for (const p of pickups){
      if (p.isFinal && !finalSeen) finalSeen = true;
      else if (p.isFinal && finalSeen) p.isFinal = false;
    }
    if (pickups.length === 5 && !pickups.some(p => p.isFinal)) pickups[4].isFinal = true;

    const fp = pickups.find(p => p.isFinal);
    if (fp){
      sheds[idx].cleanoutDate = dateOnly(fp.date);
      const totalPicked = pickups.reduce((s,p) => s + p.birds, 0);
      sheds[idx].mortality = Math.max(0, sheds[idx].initialPopulation - totalPicked);
    }

    sheds[idx].pickups = pickups;
    matched++;
  }

  if (matched === 0){
    throw new Error("No shed rows found. Make sure the 'Shed' column contains numbers 1 through 8.");
  }
  return { sheds, batchNumber, matched, skipped, sheetName };
}

}

/* =========================================================
   WEIGHT HELPERS
========================================================= */
function weightedPickups(shed){
  return (shed.pickups || [])
    .filter(p => p.totalWeightKg && p.totalWeightKg > 0 && p.birds > 0)
    .slice()
    .sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
}
function lastWeightedPickup(shed){
  const arr = weightedPickups(shed);
  return arr.length ? arr[arr.length - 1] : null;
}
function pickupAvgKg(p){
  if (!p || !p.totalWeightKg || !p.birds) return null;
  return p.totalWeightKg / p.birds;
}
function observedDailyGain(shed){
  const arr = weightedPickups(shed);
  if (arr.length === 0) return null;
  if (arr.length === 1){
    const p = arr[0];
    const age = ageInDays(shed, p.date);
    const avg = pickupAvgKg(p);
    if (age <= 0 || avg == null) return null;
    return (avg - ROSS_308_WEIGHTS_KG[0]) / age;
  }
  const first = arr[0];
  const last = arr[arr.length - 1];
  const a0 = ageInDays(shed, first.date);
  const a1 = ageInDays(shed, last.date);
  const w0 = pickupAvgKg(first);
  const w1 = pickupAvgKg(last);
  if (a1 <= a0 || w0 == null || w1 == null) return null;
  return (w1 - w0) / (a1 - a0);
}

function actualWeightOn(shed, date){
  const arr = weightedPickups(shed);
  if (arr.length === 0) return null;
  const d = dateOnly(date);
  const age = ageInDays(shed, d);

  const exact = arr.find(p => iso(p.date) === iso(d));
  if (exact) return pickupAvgKg(exact);

  const before = [...arr].reverse().find(p => dateOnly(p.date) < d);
  const after  = arr.find(p => dateOnly(p.date) > d);

  if (before && after){
    const a0 = ageInDays(shed, before.date);
    const a1 = ageInDays(shed, after.date);
    const w0 = pickupAvgKg(before);
    const w1 = pickupAvgKg(after);
    if (a1 === a0) return w0;
    const t = (age - a0) / (a1 - a0);
    return w0 + t * (w1 - w0);
  }
  if (!before && after){
    const a1 = ageInDays(shed, after.date);
    const w1 = pickupAvgKg(after);
    const g = observedDailyGain(shed) || 0;
    return Math.max(ROSS_308_WEIGHTS_KG[0], w1 - (a1 - age) * g);
  }
  if (before && !after){
    const a0 = ageInDays(shed, before.date);
    const w0 = pickupAvgKg(before);
    const g = observedDailyGain(shed) || 0;
    return w0 + (age - a0) * g;
  }
  return null;
}

function forecastFromPickups(shed, date){
  const last = lastWeightedPickup(shed);
  if (!last) return null;
  const lastAge = ageInDays(shed, last.date);
  const lastW = pickupAvgKg(last);
  const targetAge = ageInDays(shed, date);
  if (targetAge <= lastAge) return lastW;
  const g = observedDailyGain(shed) || 0;
  return lastW + (targetAge - lastAge) * g;
}

function getTargetCurve(shed){
  const t = shed.targetCurve || {};
  const pts = [];
  TARGET_DAYS.forEach(day => {
    const v = Number(t[day]);
    if (Number.isFinite(v) && v > 0) pts.push({ day, kg: v });
  });
  return pts.sort((a,b) => a.day - b.day);
}
function hasTargetCurve(shed){
  return getTargetCurve(shed).length > 0;
}
function forecastFromTargetCurve(shed, date){
  const pts = getTargetCurve(shed);
  if (pts.length === 0) return null;
  const age = ageInDays(shed, date);
  if (age <= 0) return ROSS_308_WEIGHTS_KG[0];
  const anchors = [{ day: 0, kg: ROSS_308_WEIGHTS_KG[0] }, ...pts];
  if (age <= anchors[0].day) return anchors[0].kg;
  if (age >= anchors[anchors.length-1].day){
    const last = anchors[anchors.length-1];
    const prev = anchors[anchors.length-2] || { day: 0, kg: ROSS_308_WEIGHTS_KG[0] };
    const slope = (last.kg - prev.kg) / (last.day - prev.day);
    return Math.max(0, last.kg + (age - last.day) * slope);
  }
  for (let i = 0; i < anchors.length - 1; i++){
    const a0 = anchors[i], a1 = anchors[i+1];
    if (age >= a0.day && age <= a1.day){
      const t = (age - a0.day) / (a1.day - a0.day);
      return a0.kg + t * (a1.kg - a0.kg);
    }
  }
  return null;
}

function forecastWeightModeAware(shed, date){
  const last = lastWeightedPickup(shed);
  if (last){
    return { kg: forecastFromPickups(shed, date), mode: 'ai-pickup' };
  }
  if (hasTargetCurve(shed)){
    const kg = forecastFromTargetCurve(shed, date);
    if (kg != null) return { kg, mode: 'ai-target' };
  }
  return { kg: rossWeightKg(ageInDays(shed, date)), mode: 'standard' };
}

function daysVsTarget(currentAge, currentWeightKg){
  if (!Number.isFinite(currentAge) || !Number.isFinite(currentWeightKg) || currentWeightKg <= 0) return null;
  const rossAge = findRossAgeForWeight(currentWeightKg);
  return rossAge - currentAge;
}

function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function base64ToBlob(base64, mime){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

            14: (tc[14] != null && Number.isFinite(Number(tc[14])) && Number(tc[14]) > 0) ? Number(tc[14]) : null,
            21: (tc[21] != null && Number.isFinite(Number(tc[21])) && Number(tc[21]) > 0) ? Number(tc[21]) : null,
            28: (tc[28] != null && Number.isFinite(Number(tc[28])) && Number(tc[28]) > 0) ? Number(tc[28]) : null
          }
        };
      })
    };
    saveState();
  }

  if (payload.siloData && typeof payload.siloData === 'object'){
    const incoming = {};
    [1,2,3,4].forEach(g => {
      const s = payload.siloData[g] || {};
      incoming[g] = {
        readings: Array.isArray(s.readings) ? s.readings.map(r => ({
          date: String(r.date || ''),
          silo1Rings: normalizeRing(r.silo1Rings),
          silo2Rings: normalizeRing(r.silo2Rings),
          silo3Rings: normalizeRing(r.silo3Rings)
        })).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)).sort((a,b) => a.date.localeCompare(b.date)) : [],
        deliveries: Array.isArray(s.deliveries) ? s.deliveries.map(d => ({
          id: d.id || String(Date.now()) + Math.random().toString(16).slice(2),
          date: d.date ? dateOnly(d.date) : null,
          amountKg: Number(d.amountKg) || 0,
          feedType: FEED_TYPES.some(f => f.id === d.feedType) ? d.feedType : '',
          note: d.note || ''
        })).filter(d => d.date && d.amountKg > 0) : []
      };
    });
    siloData = incoming;
    saveSiloData();
  }

  if (payload.predictions && typeof payload.predictions === 'object'){
    const p = payload.predictions;
    if (Number.isFinite(p.beta)) predState.beta = Math.max(0, Math.min(0.6, p.beta));
    if (p.targetHarvestWeightKg && typeof p.targetHarvestWeightKg === 'object'){
      [1,2,3,4].forEach(g => {
        const n = Number(p.targetHarvestWeightKg[g]);
        if (Number.isFinite(n) && n > 0) predState.targetHarvestWeightKg[g] = n;
      });
    }
    if (p.farmFeedOverride != null && Number.isFinite(Number(p.farmFeedOverride)) && Number(p.farmFeedOverride) > 0){
      predState.farmFeedOverride = Number(p.farmFeedOverride);
    } else if (p.farmFeedOverride === null){
      predState.farmFeedOverride = null;
    }
    savePredState();
  }

  const prefs = payload.preferences || {};
  if (prefs.shedViewByGroup && typeof prefs.shedViewByGroup === 'object'){
    const next = { ...DEFAULT_VIEWS };
    [1,2,3,4].forEach(g => {
      if (['shed1','shed2','both','planner'].includes(prefs.shedViewByGroup[g])) next[g] = prefs.shedViewByGroup[g];
    });
    shedViewByGroup = next; saveShedViews();
  }
  if (prefs.shedRange && typeof prefs.shedRange === 'object'){
    const s = Number(prefs.shedRange.start), e = Number(prefs.shedRange.end);
    if (Number.isFinite(s) && Number.isFinite(e) && s <= e){ shedRange = { start:s, end:e }; }
  }
  if (prefs.siloRange && typeof prefs.siloRange === 'object'){
    const s = Number(prefs.siloRange.start), e = Number(prefs.siloRange.end);
    if (Number.isFinite(s) && Number.isFinite(e) && s <= e){ siloRange = { start:s, end:e }; }
  }
  if (prefs.theme === 'dark' || prefs.theme === 'light'){ applyTheme(prefs.theme); saveTheme(prefs.theme); }
  if (typeof prefs.deliveriesOpen === 'boolean'){ predState.deliveriesOpen = prefs.deliveriesOpen; }

  syncExcelMeta = newExcelMeta;
  const newUploadedAt = newExcelMeta && newExcelMeta.uploadedAt;
  if (!options.isFirstPull && oldExcelUploadedAt && newUploadedAt && oldExcelUploadedAt !== newUploadedAt){
    showToast('📄 Excel updated on another device — re-import to load it.', true);
  }
  return true;
}

async function fetchFromCloud(){
  if (!syncFarmName) return { ok: false, reason: 'no-farm' };
  try {
    const res = await fetch(buildSyncUrl(syncFarmName));
    if (res.status === 404) return { ok: true, notFound: true };
    if (!res.ok) return { ok: false, reason: 'http-' + res.status };
    const result = await res.json();
    if (result.notFound) return { ok: true, notFound: true };
    return { ok: true, data: result.data, sha: result.sha };
  } catch (e){ return { ok: false, reason: e.message || 'network-error' }; }
}
async function pullFromCloud(silent){
  if (!syncFarmName) return false;
  syncState = 'pulling'; renderSyncButton();
  const r = await fetchFromCloud();
  if (!r.ok){
    syncState = 'error'; renderSyncButton();
    if (!silent) showToast('Could not sync — check your connection.', true);
    return false;
  }
  if (r.notFound){
    syncState = 'idle'; renderSyncButton();
    await pushToCloud();
    if (!silent) showToast('Connected — created a new file for this farm.');
    return true;
  }
  syncSha = r.sha || null;
  const ok = applyCloudPayload(r.data);
  if (!ok){
    syncState = 'error'; renderSyncButton();
    if (!silent) showToast('Cloud file is not a ProdWise backup.', true);
    return false;
  }
  syncLastSyncAt = Date.now(); saveSyncState();
  syncState = 'idle'; renderSyncButton(); render();
  if (!silent) showToast('Synced ✓');
  return true;
}
async function pushToCloud(){
  if (!syncFarmName) return false;
  syncState = 'pushing'; renderSyncButton();
  try {
    const body = { sha: syncSha, data: buildCloudPayload() };
    const res = await fetch(buildSyncUrl(syncFarmName), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.status === 409){
      const fresh = await fetch(buildSyncUrl(syncFarmName)).then(r => r.json()).catch(() => null);
      if (fresh && fresh.sha){
        syncSha = fresh.sha;
        const retry = await fetch(buildSyncUrl(syncFarmName), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha: syncSha, data: buildCloudPayload() })
        });
        if (!retry.ok) throw new Error('Sync retry failed');
        const rr = await retry.json();
        if (rr && rr.sha) syncSha = rr.sha;
      } else throw new Error('Could not refresh cloud state');
    } else if (!res.ok) throw new Error('Sync server responded ' + res.status);
    else {
      const result = await res.json();
      if (result && result.sha) syncSha = result.sha;
    }
    syncLastSyncAt = Date.now(); saveSyncState();
    syncState = 'idle'; renderSyncButton();
    return true;
  } catch (e){
    console.error('Push failed', e);
    syncState = 'error'; renderSyncButton();
    return false;
  }
}
function schedulePush(){
  if (!syncFarmName || !syncConnectedAt) return;
  pushPending = true;
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(runScheduledPush, 2000);
  if (!pushMaxWaitTimer) pushMaxWaitTimer = setTimeout(runScheduledPush, 30000);
}
async function runScheduledPush(){
  clearTimeout(pushDebounceTimer); pushDebounceTimer = null;
  clearTimeout(pushMaxWaitTimer); pushMaxWaitTimer = null;
  if (!pushPending) return;
  if (pushInFlight){ pushDebounceTimer = setTimeout(runScheduledPush, 2000); return; }
  pushPending = false; pushInFlight = true;
  try { await pushToCloud(); } finally { pushInFlight = false; }
}
function flushPendingPush(){
  if (!pushPending) return;
  clearTimeout(pushDebounceTimer); pushDebounceTimer = null;
  clearTimeout(pushMaxWaitTimer); pushMaxWaitTimer = null;
  pushPending = false; pushToCloud();
}
async function uploadExcelToCloud(file){
  if (!syncFarmName) return false;
  syncState = 'pushing'; renderSyncButton();
  try {
    const buf = await file.arrayBuffer();
    const base64 = arrayBufferToBase64(buf);
    const uploadedAt = new Date().toISOString();
    const wrapperData = { name: file.name || 'sheds.xlsx', size: file.size || buf.byteLength, uploadedAt, base64 };
    let res = await fetch(buildExcelWrapperUrl(syncFarmName), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: syncExcelSha, data: wrapperData })
    });
    if (res.status === 409){
      const fresh = await fetch(buildExcelWrapperUrl(syncFarmName)).then(r => r.json()).catch(() => null);
      if (fresh && fresh.sha){
        syncExcelSha = fresh.sha;
        res = await fetch(buildExcelWrapperUrl(syncFarmName), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha: syncExcelSha, data: wrapperData })
        });
      }
    }
    if (!res.ok) throw new Error('Excel upload failed: ' + res.status);
    const result = await res.json().catch(() => null);
    if (result && result.sha) syncExcelSha = result.sha;
    syncExcelMeta = { name: wrapperData.name, size: wrapperData.size, uploadedAt };
    saveSyncState();
    await pushToCloud();
    syncState = 'idle'; renderSyncButton();
    return true;
  } catch (e){
    console.error('Excel upload failed', e);
    syncState = 'error'; renderSyncButton();
    showToast('Excel saved locally, but cloud upload failed.', true);
    return false;
  }
}
async function downloadExcelFromCloud(){
  if (!syncFarmName) return;
  try {
    const res = await fetch(buildExcelWrapperUrl(syncFarmName));
    if (!res.ok){ showToast('Could not fetch the stored Excel.', true); return; }
    const result = await res.json();
    const wrapper = result && result.data;
    if (!wrapper || !wrapper.base64){ showToast('No stored Excel found.', true); return; }
    const blob = base64ToBlob(wrapper.base64, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = wrapper.name || 'sheds.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Stored Excel downloaded.');
  } catch (e){ console.error(e); showToast('Download failed.', true); }
}
async function connectSync(farmName){
  const clean = sanitizeUserFarmName(farmName);
  if (!clean){ showToast('Enter a farm name.', true); return; }
  syncFarmName = clean; syncSha = null; syncExcelSha = null; syncExcelMeta = null;
  syncConnectedAt = null; syncLastSyncAt = null;
  saveSyncState(); closeSyncModal(); renderSyncButton();
  syncState = 'pulling'; renderSyncButton();
  const r = await fetchFromCloud();
  syncState = 'idle'; renderSyncButton();
  if (!r.ok){ showToast('Could not reach the sync server.', true); return; }
  if (r.notFound){
    syncConnectedAt = Date.now(); saveSyncState();
    await pushToCloud();
    showToast('Connected — created a new file for this farm.');
    renderSyncButton(); return;
  }
  syncSha = r.sha || null;
  showFarmFoundPrompt(r.data, r.sha);
}
function disconnectSync(){
  if (!syncFarmName) return;
  if (!confirm('Disconnect cloud sync?\n\nYour data stays on this device and in the cloud. You can reconnect with the same farm name any time.')) return;
  syncFarmName = null; syncSha = null; syncExcelSha = null; syncExcelMeta = null;

  showToast('Disconnected.');
}

function downloadCurrentBatchAsJson(){

  payload.exportedAt = new Date().toISOString();
  payload.exportedBy = 'ProdWise.VM';
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toISOString().slice(0, 10);
  a.download = `${farmLabel}-feed-${batchLabel}-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('📥 Batch backup downloaded.');
}

    try { downloadCurrentBatchAsJson(); } catch(e){ console.error(e); }

function parseBatchFileInfo(farmName, fileName){
  const farm = sanitizeUserFarmName(farmName);
  const base = `${farm}${SYNC_SUFFIX}`;
  if (!fileName.startsWith(base)) return null;
  if (!fileName.endsWith('.json')) return null;
  if (fileName.endsWith('-file.json')) return null;
  const middle = fileName.slice(base.length, -'.json'.length);
  if (middle === '') return { batchKey: '', label: 'Legacy', isLegacy: true };
  if (!middle.startsWith('-')) return null;
  const key = middle.slice(1);
  return { batchKey: key, label: `Batch ${key}`, isLegacy: false };
}
function compareBatchKeys(a, b){
  const na = parseFloat(String(a).replace(/[^0-9.]/g, ''));
  const nb = parseFloat(String(b).replace(/[^0-9.]/g, ''));
  if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) return nb - na;
  return String(b).localeCompare(String(a));
}

  if (batchHistoryPage >= totalPages) batchHistoryPage = totalPages - 1;
  if (batchHistoryPage < 0) batchHistoryPage = 0;

  const start = batchHistoryPage * BATCHES_PER_PAGE;
  const end = Math.min(start + BATCHES_PER_PAGE, totalCount);
  const pageItems = files.slice(start, end);

  const rows = pageItems.map(p => {

    const sizeStr = fmtBytes(p.size);

    statusEl.innerHTML = `${totalCount} batch${totalCount === 1 ? '' : 'es'} found`;
    statusEl.classList.remove('error');
  }

  if (pagEl){
    if (totalPages > 1){
      pagEl.innerHTML = `
        <div class="batch-pagination">
          <button class="batch-page-btn" data-batch-page="prev" type="button"
            ${batchHistoryPage === 0 ? 'disabled' : ''}>← Prev</button>
          <span class="batch-page-info">Page ${batchHistoryPage + 1} of ${totalPages}</span>

    });

  body.querySelectorAll('[data-batch-page]').forEach(btn => {
    btn.addEventListener('click', () => {

      const totalPages2 = Math.max(1, Math.ceil(totalCount2 / BATCHES_PER_PAGE));
      if (dir === 'prev' && batchHistoryPage > 0) batchHistoryPage--;
      else if (dir === 'next' && batchHistoryPage < totalPages2 - 1) batchHistoryPage++;
      renderBatchListPage();
    });
  });

async function downloadPastBatch(targetBatchKey){

/* ---------- Derived ---------- */
function ageInDays(shed, onDate = new Date()){
  if (!shed.placementDate) return 0;
  return Math.max(0, daysBetween(shed.placementDate, onDate));
}
function totalPicked(shed){ return (shed.pickups || []).reduce((s,p) => s + (Number(p.birds) || 0), 0); }
function mortalityRate(shed){ if (!shed.initialPopulation) return 0; return (Number(shed.mortality || 0) / shed.initialPopulation) * 100; }
function finalPickupOf(shed){ return (shed.pickups || []).find(p => p.isFinal); }
function shedsForGroup(g){
  if (!farmData) return [];
  const a = farmData.sheds[(g-1)*2];
  const b = farmData.sheds[(g-1)*2 + 1];
  return [a, b].filter(Boolean);
}
function liveAtStartOfDay(shed, D){
  const d = dateOnly(D);
  if (!shed.placementDate) return 0;
  if (d < dateOnly(shed.placementDate)) return 0;
  if (shed.cleanoutDate && d > dateOnly(shed.cleanoutDate)) return 0;
  const beforeD = (shed.pickups || [])
    .filter(p => dateOnly(p.date) < d)
    .reduce((s,p) => s + p.birds, 0);
  return Math.max(0, shed.initialPopulation - Number(shed.mortality || 0) - beforeD);
}
function feedPerBirdKg(shed, ageDays){
  if (shed.customFeedKg != null && shed.customFeedKg > 0) return shed.customFeedKg;
  if (ageDays <= 0) return 0;
  const age = Math.min(60, Math.max(1, Math.floor(ageDays)));
  return (ROSS_308_FEED_INTAKE[age] || 234) / 1000;
}
function shedFeedOn(shed, D){
  const age = ageInDays(shed, D);
  const live = liveAtStartOfDay(shed, D);
  if (age <= 0 || live <= 0) return 0;
  return live * feedPerBirdKg(shed, age);
}
function groupDailyFeedOn(sheds, D){ return sheds.reduce((sum, s) => sum + shedFeedOn(s, D), 0); }
function groupFeedToday(sheds, today = new Date()){ return groupDailyFeedOn(sheds, today); }

function fmtFeed(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0 kg';
  const abs = Math.abs(kg);
  if (abs >= 1000) return (kg / 1000).toFixed(2) + ' t';
  return Math.round(kg).toLocaleString() + ' kg';
}
function fmtKgAlways(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0 kg';
  return Math.round(kg).toLocaleString() + ' kg';
}
function fmtTonnesAlways(kg){
  if (!Number.isFinite(kg) || kg === 0) return '0.00 t';
  const t = kg / 1000;
  return t.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' t';
}

/* =========================================================
   PREDICTION ENGINE
========================================================= */
function computePredictions(shed, group){
  const today = dateOnly(new Date());
  const initialPop = Number(shed.initialPopulation) || 0;
  const currentMort = Number(shed.mortality) || 0;
  const currentAge = ageInDays(shed, today);
  const liveNow = liveAtStartOfDay(shed, today);
  const pickups = (shed.pickups || []).slice().sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  const finalAge = shed.cleanoutDate ? Math.max(currentAge, ageInDays(shed, shed.cleanoutDate)) : currentAge + 30;
  const targetALW = Number(predState.targetHarvestWeightKg[group]) || 2.65;
  const beta = Number(predState.beta) || 0.27;

  let perfSum = 0, perfCount = 0;
  for (const p of pickups){
    const avg = pickupAvgKg(p);
    if (avg && avg > 0){
      const pAge = ageInDays(shed, p.date);
      const curveW = rossWeightKg(pAge);
      if (curveW > 0){ perfSum += (avg / curveW); perfCount++; }
    }
  }
  const perfFactor = perfCount > 0 ? (perfSum / perfCount) : 1.0;
  const curveFinal = rossWeightKg(finalAge);
  const perfAdjustedFinal = curveFinal * perfFactor;
  const progressT = Math.min(1, currentAge / Math.max(1, finalAge));
  const estFinalALW = (perfCount > 0)
    ? (perfAdjustedFinal * (1 - progressT * 0.5) + targetALW * (progressT * 0.5))
    : targetALW;

  const dailyMortRate = currentAge > 0 ? (currentMort / currentAge) : 0;
  const daysRemaining = Math.max(0, finalAge - currentAge);
  const estFinalMort = Math.min(initialPop, Math.round(currentMort + dailyMortRate * daysRemaining));
  const estFinalLive = Math.max(0, initialPop - estFinalMort);
  const estLivability = initialPop > 0 ? ((estFinalLive / initialPop) * 100) : 0;

  let totalWeightKg = 0;
  const pickupDetails = [];
  let cumBirds = 0;
  for (const p of pickups){
    const pAge = ageInDays(shed, p.date);
    const curveAtAge = rossWeightKg(pAge);
    const avgFromExcel = pickupAvgKg(p);
    const avgUsed = (avgFromExcel && avgFromExcel > 0) ? avgFromExcel : (curveAtAge * perfFactor);
    const pickupWeightKg = Number(p.birds || 0) * avgUsed;
    totalWeightKg += pickupWeightKg;
    cumBirds += Number(p.birds || 0);
    pickupDetails.push({
      date: p.date, age: pAge,
      birds: Number(p.birds || 0),
      avgWeightKg: avgUsed,
      totalWeightKg: Number(p.birds || 0) * avgUsed,
      isFinal: !!p.isFinal, cumBirds,
      isEstWeight: !(avgFromExcel && avgFromExcel > 0)
    });
  }
  const finalLiveBirds = Math.max(0, estFinalLive - cumBirds);
  totalWeightKg += finalLiveBirds * estFinalALW;

  let totalFeedKg = 0;
  if (shed.placementDate && shed.cleanoutDate){
    let d = dateOnly(shed.placementDate);
    const end = dateOnly(shed.cleanoutDate);
    while (d <= end){ totalFeedKg += shedFeedOn(shed, d); d = addDays(d, 1); }
  } else if (shed.placementDate){
    let d = dateOnly(shed.placementDate);
    const end = dateOnly(new Date());
    while (d <= end){ totalFeedKg += shedFeedOn(shed, d); d = addDays(d, 1); }
  }
  const fcr = totalWeightKg > 0 ? (totalFeedKg / totalWeightKg) : 0;
  const cfcr = fcr - (estFinalALW - 2.45) * beta;
  const pif = (finalAge > 0 && fcr > 0) ? ((estLivability * estFinalALW) / (finalAge * fcr) * 100) : 0;
  const remainingWeightKg = liveNow * rossWeightKg(currentAge) * perfFactor;
  const confidence = computeConfidence(shed, finalAge);

  return {
    initialPop, currentMort, currentAge, liveNow,
    pickupsCompleted: pickups.length,
    remainingBirds: liveNow, remainingWeightKg,
    finalAge, estFinalALW, estFinalMort, estFinalLive, estLivability,
    totalWeightKg, totalFeedKg, fcr, cfcr, pif, beta,
    perfFactor, confidence, pickupDetails,
    hasWeightData: perfCount > 0
  };
}
function computeConfidence(shed, finalAge){
  const age = ageInDays(shed, new Date());
  const pickups = shed.pickups || [];
  const hasWeight = pickups.some(p => pickupAvgKg(p) != null);
  const hasTargets = hasTargetCurve(shed);
  const hasFinal = pickups.some(p => p.isFinal);
  if (hasFinal) return 100;
  let c = 30;
  c += pickups.length * 10;
  c += hasWeight ? 10 : 0;
  c += hasTargets ? 5 : 0;
  c += Math.floor((age / Math.max(1, finalAge)) * 10);
  return Math.min(95, c);
}
function confidenceLabel(pct){
  if (pct >= 80) return { label: 'High', cls: 'high' };
  if (pct >= 50) return { label: 'Medium', cls: 'medium' };
  return { label: 'Low', cls: 'low' };
}

/* =========================================================
   WHOLE-FARM KPI TOTALS
========================================================= */
function computeFarmTotals(){
  const sheds = (farmData && farmData.sheds) ? farmData.sheds : [];
  let totalLiveWeight = 0;
  let totalFeedAuto = 0;
  let totalPlaced = 0;
  let totalMortalityEst = 0;
  let totalBirdsAtHarvest = 0;
  let weightedAgeSum = 0;
  let shedsWithData = 0;

  for (const shed of sheds){
    if (!shed.placementDate) continue;
    const g = Math.floor((shed.id - 1) / 2) + 1;
    const pred = computePredictions(shed, g);

    totalLiveWeight += pred.totalWeightKg;
    totalFeedAuto += pred.totalFeedKg;
    totalPlaced += pred.initialPop;
    totalMortalityEst += pred.estFinalMort;

    const harvestedBirds = pred.pickupDetails.reduce((s,p) => s + p.birds, 0);
    const remainingBirds = Math.max(0, pred.estFinalLive - harvestedBirds);
    const batchBirds = harvestedBirds + remainingBirds;
    totalBirdsAtHarvest += batchBirds;
    weightedAgeSum += pred.finalAge * batchBirds;

    shedsWithData++;
  }

  if (shedsWithData === 0){
    return {
      hasData: false, shedsWithData: 0,
      totalLiveWeight: 0, totalFeedAuto: 0, totalFeed: 0,
      fcr: 0, cfcr: 0, pif: 0, avgWeight: 0, livability: 0,
      weightedAge: 0, placed: 0, mortality: 0, birdsAtHarvest: 0,
      usingManualFeed: false
    };
  }

  const avgWeight = totalBirdsAtHarvest > 0 ? totalLiveWeight / totalBirdsAtHarvest : 0;
  const weightedAge = totalBirdsAtHarvest > 0 ? weightedAgeSum / totalBirdsAtHarvest : 0;
  const livability = totalPlaced > 0 ? ((totalPlaced - totalMortalityEst) / totalPlaced) * 100 : 0;

  const usingManualFeed = predState.farmFeedOverride != null && predState.farmFeedOverride > 0;
  const totalFeed = usingManualFeed ? predState.farmFeedOverride : totalFeedAuto;

  const fcr = totalLiveWeight > 0 ? totalFeed / totalLiveWeight : 0;
  const beta = Number(predState.beta) || 0.27;
  const cfcr = fcr > 0 ? fcr - (avgWeight - 2.45) * beta : 0;
  const pif = (weightedAge > 0 && fcr > 0) ? ((livability * avgWeight) / (weightedAge * fcr) * 100) : 0;

  return {
    hasData: true, shedsWithData,
    totalLiveWeight, totalFeedAuto, totalFeed,
    fcr, cfcr, pif, avgWeight, livability,
    weightedAge, placed: totalPlaced, mortality: totalMortalityEst,
    birdsAtHarvest: totalBirdsAtHarvest,
    usingManualFeed
  };
}

/* ---------- Shed forecast (group pages) ---------- */
function computeForecast(shed, range){
  const today = dateOnly(new Date());
  const rows = [];
  let totalFeed = 0;
  if (!shed.placementDate) return { rows: [], totalFeed: 0, notStarted: true };
  for (let off = range.start; off <= range.end; off++){
    const d = addDays(today, off);
    const isPast = off < 0;
    const isToday = off === 0;
    if (dateOnly(d) < dateOnly(shed.placementDate)){
      rows.push({ date: d, age: 0, liveStart: 0, perBird: 0, dailyFeed: 0,
        pickups: [], pickupsBirds: 0, liveAfter: 0,
        isFinalDay: false, isToday, isPast, beforePlacement: true });
      continue;
    }
    if (shed.cleanoutDate && dateOnly(d) > dateOnly(shed.cleanoutDate)){
      const pickupsToday = (shed.pickups || []).filter(p => iso(p.date) === iso(d));
      rows.push({ date: d, age: ageInDays(shed, d), liveStart: 0, perBird: 0, dailyFeed: 0,
        pickups: pickupsToday,
        pickupsBirds: pickupsToday.reduce((s,p) => s + p.birds, 0),
        liveAfter: 0, isFinalDay: false, isToday, isPast, afterCleanout: true });
      continue;
    }
    const age = ageInDays(shed, d);
    const live = liveAtStartOfDay(shed, d);
    const pickupsToday = (shed.pickups || []).filter(p => iso(p.date) === iso(d));
    const pickupsBirds = pickupsToday.reduce((s,p) => s + p.birds, 0);
    const isFinalDay = pickupsToday.some(p => p.isFinal);
    const perBird = feedPerBirdKg(shed, age);
    const dailyFeed = live * perBird;
    const liveAfter = Math.max(0, live - pickupsBirds);
    totalFeed += dailyFeed;
    rows.push({ date: d, age, liveStart: live, perBird, dailyFeed,
      pickups: pickupsToday, pickupsBirds, liveAfter,
      isFinalDay, isToday, isPast });
  }
  return { rows, totalFeed };
}

/* ---------- Silo ---------- */
function readingsSorted(group){
  const s = siloData[group] || { readings: [] };
  return (s.readings || []).slice().sort((a,b) => a.date.localeCompare(b.date));
}
function latestReading(group){ const arr = readingsSorted(group); return arr.length ? arr[arr.length - 1] : null; }
function readingTotalKg(reading){ if (!reading) return 0; return ringsToKg(reading.silo1Rings) + ringsToKg(reading.silo2Rings) + ringsToKg(reading.silo3Rings); }
function deliveriesForGroup(group){ const s = siloData[group] || { deliveries: [] }; return (s.deliveries || []).slice().sort((a,b) => dateOnly(a.date) - dateOnly(b.date)); }
function deliveriesKgOn(group, D){
  const d = dateOnly(D);
  return deliveriesForGroup(group).filter(x => iso(x.date) === iso(d)).reduce((s,x) => s + (Number(x.amountKg) || 0), 0);
}
function balanceOnEndOfDay(group, D){
  const latest = latestReading(group);
  if (!latest) return null;
  const latestDate = dateOnly(latest.date);
  const targetD = dateOnly(D);
  const sheds = shedsForGroup(group);
  if (targetD.getTime() === latestDate.getTime()) return readingTotalKg(latest);
  if (targetD > latestDate){
    let bal = readingTotalKg(latest);
    for (let d = addDays(latestDate, 1); d <= targetD; d = addDays(d, 1)){
      bal = bal + deliveriesKgOn(group, d) - groupDailyFeedOn(sheds, d);
    }
    return bal;
  }
  let bal = readingTotalKg(latest);
  for (let d = latestDate; d > targetD; d = addDays(d, -1)){
    bal = bal - deliveriesKgOn(group, d) + groupDailyFeedOn(sheds, d);
  }
  return bal;
}
function currentBalanceKg(group){ return balanceOnEndOfDay(group, new Date()); }
function consumptionSinceLatestReading(group){
  const latest = latestReading(group);
  if (!latest) return 0;
  const latestDate = dateOnly(latest.date);
  const today = dateOnly(new Date());
  if (latestDate >= today) return 0;
  const sheds = shedsForGroup(group);
  let c = 0;
  for (let d = addDays(latestDate, 1); d <= today; d = addDays(d, 1)) c += groupDailyFeedOn(sheds, d);
  return c;
}
function deliveriesSinceLatestReading(group){
  const latest = latestReading(group);
  if (!latest) return 0;
  const latestDate = dateOnly(latest.date);
  const today = dateOnly(new Date());
  if (latestDate >= today) return 0;
  let d = 0;
  for (let x = addDays(latestDate, 1); x <= today; x = addDays(x, 1)) d += deliveriesKgOn(group, x);
  return d;
}
function computeSiloForecast(group, range){
  const sheds = shedsForGroup(group);
  const today = dateOnly(new Date());
  const rows = [];
  let totalConsumption = 0, totalDelivered = 0;
  for (let off = range.start; off <= range.end; off++){
    const d = addDays(today, off);
    const isPast = off < 0;
    const isToday = off === 0;
    const cons = groupDailyFeedOn(sheds, d);
    const del  = deliveriesKgOn(group, d);
    const deliveriesOnDay = deliveriesForGroup(group).filter(x => iso(x.date) === iso(d));
    const bal = balanceOnEndOfDay(group, d);
    totalConsumption += cons;
    totalDelivered += del;
    rows.push({ date: d, consumption: cons, delivery: del,
      deliveries: deliveriesOnDay, balance: bal,
      isToday, isPast, isFuture: !isPast && !isToday, isWeekend: isWeekend(d) });
  }
  let depletedDate = null;
  for (const r of rows){
    if (r.balance !== null && r.balance <= 0 && r.consumption > 0 && !r.isPast){ depletedDate = r.date; break; }
  }
  const endBalance = rows.length ? rows[rows.length - 1].balance : null;
  const totalStock = balanceOnEndOfDay(group, today);
  const shortfall = Math.max(0, totalConsumption - (totalStock || 0) - totalDelivered);
  return { rows, totalStock, totalConsumption, totalDelivered, depletedDate, endBalance, shortfall };
}

/* ---------- Feed Summary ---------- */
function computeFeedSummary(group){
  const deliveries = deliveriesForGroup(group);
  const buckets = {
    starter:{id:'starter',label:'Starter',tonnes:0,deliveries:0,blocks:0,remainder:0},
    grower:{id:'grower',label:'Grower',tonnes:0,deliveries:0,blocks:0,remainder:0},
    finisher:{id:'finisher',label:'Finisher',tonnes:0,deliveries:0,blocks:0,remainder:0},
    withdrawal:{id:'withdrawal',label:'Withdrawal',tonnes:0,deliveries:0,blocks:0,remainder:0},
    unspecified:{id:'unspecified',label:'Unspecified',tonnes:0,deliveries:0,blocks:0,remainder:0}
  };
  deliveries.forEach(d => {
    const t = (Number(d.amountKg) || 0) / 1000;
    const key = FEED_TYPES.some(f => f.id === d.feedType) ? d.feedType : 'unspecified';
    buckets[key].tonnes += t; buckets[key].deliveries += 1;
  });
  Object.values(buckets).forEach(b => {
    b.blocks = Math.floor(b.tonnes / FEED_BLOCK_T);
    b.remainder = b.tonnes - (b.blocks * FEED_BLOCK_T);
  });
  const totalTonnes = Object.values(buckets).reduce((s,b) => s + b.tonnes, 0);
  const totalBlocks = Object.values(buckets).reduce((s,b) => s + b.blocks, 0);
  return { buckets, totalTonnes, totalBlocks };
}
function renderFeedSummary(group){
  const summary = computeFeedSummary(group);
  const activeRows = ['starter','grower','finisher','withdrawal','unspecified']
    .map(k => summary.buckets[k]).filter(b => b.tonnes > 0);
  if (activeRows.length === 0){
    return `
      <div class="feed-summary">
        <div class="feed-summary-title">📊 Feed Summary
          <span class="sub">· per feed type · 1 block = 60 T</span></div>
        <div class="feed-summary-empty">No deliveries scheduled yet — add one above to see the block count.</div>
      </div>`;
  }
  const rows = activeRows.map(b => `
    <tr class="${b.blocks > 0 ? 'has-blocks' : ''}">
      <td>${feedTypeTagHtml(b.id)}</td>
      <td class="num">${b.tonnes.toFixed(2)} t</td>
      <td class="num">${b.deliveries}</td>
      <td class="num">${b.blocks > 0 ? `<span class="block-count">${b.blocks}</span>` : `<span class="block-count zero">0</span>`}</td>
      <td class="num rem">${b.remainder > 0.01 ? b.remainder.toFixed(2) + ' t' : '—'}</td>
    </tr>
  `).join('');
  return `
    <div class="feed-summary">
      <div class="feed-summary-title">📊 Feed Summary
        <span class="sub">· per feed type · 1 block = 60 T</span></div>
      <table class="feed-summary-table">
        <thead><tr><th>Type</th><th class="num">Total</th><th class="num">Deliveries</th>
          <th class="num">60 T blocks</th><th class="num">Remainder</th></tr></thead>
        <tbody>
          ${rows}
          <tr style="background:var(--surface-soft);font-weight:800;font-family:'Sora',sans-serif;">
            <td>Total</td>
            <td class="num">${summary.totalTonnes.toFixed(2)} t</td>
            <td class="num">${activeRows.reduce((s,b) => s + b.deliveries, 0)}</td>
            <td class="num">${summary.totalBlocks}</td>
            <td class="num rem">—</td>
          </tr>
        </tbody>
      </table>
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;">
        Each 60 T of the same feed type counts as <strong>1 block</strong>.
        Example: 30 T Grower + 30 T Grower = 60 T → <strong>1 block</strong>.
      </div>
    </div>`;
}

/* ---------- Silo actions ---------- */
function setSiloRingsForToday(group, siloNum, rings){
  if (!siloData[group]) siloData[group] = { readings: [], deliveries: [] };
  const s = siloData[group];
  const todayIso = iso(new Date());
  let reading = s.readings.find(r => r.date === todayIso);
  if (!reading){
    const prev = s.readings.length ? s.readings[s.readings.length - 1] : null;
    reading = { date: todayIso,
      silo1Rings: prev ? prev.silo1Rings : null,
      silo2Rings: prev ? prev.silo2Rings : null,
      silo3Rings: prev ? prev.silo3Rings : null };
    s.readings.push(reading);
    s.readings.sort((a,b) => a.date.localeCompare(b.date));
  }
  const key = `silo${siloNum}Rings`;
  reading[key] = (rings === null) ? null : normalizeRing(rings);
  saveSiloData(); schedulePush(); render();
}
function addSiloDelivery(group, dateStr, amountT, feedType, note){

/* ---------- Import ---------- */
function triggerImport(){
  const input = document.getElementById('excelFile');
  input.value = ''; input.click();
}
async function handleFile(file){
  if (!file) return;
  if (typeof XLSX === 'undefined'){ showToast('Excel reader not available. Check your internet connection.', true); return; }
  if (file.size > MAX_EXCEL_WARN_BYTES){
    const mb = (file.size / (1024*1024)).toFixed(1);
    if (!confirm(`This file is ${mb} MB — larger than usual.\n\nLoading and cloud upload may take a few seconds.\n\nContinue?`)) return;
  }
  const willReplaceLocal = !!farmData;
  const willReplaceCloudExcel = !!(syncFarmName && syncConnectedAt && syncExcelMeta && syncExcelMeta.name);
  if (willReplaceLocal || willReplaceCloudExcel){
    let msg = '';
    if (willReplaceLocal){
      msg += 'This will replace your current shed data with the new file.\n\nManual pickup weight edits and target curves will be kept.';
    }
    if (willReplaceCloudExcel){
      if (msg) msg += '\n\n';
      const metaAge = syncExcelMeta.uploadedAt ? ` (uploaded ${fmtRelativeTime(new Date(syncExcelMeta.uploadedAt).getTime())})` : '';
      msg += `⚠️ The stored Excel on the cloud (${syncExcelMeta.name}${metaAge}) will also be replaced with this new file.`;
    }
    msg += '\n\nContinue?';
    if (!confirm(msg)) return;
  }
  try {
    const manualWeights = {};
    const manualTargets = {};
    if (farmData && Array.isArray(farmData.sheds)){
      farmData.sheds.forEach(s => {
        (s.pickups || []).forEach(p => {
          if (p.totalWeightKgManual && p.totalWeightKg != null){
            manualWeights[`${s.id}_${iso(p.date)}`] = {
              totalWeightKg: p.totalWeightKg,
              totalWeightKgFromExcel: p.totalWeightKgFromExcel
            };
          }
        });
        const tc = s.targetCurve || {};
        if (tc[7] || tc[14] || tc[21] || tc[28]){
          manualTargets[s.id] = { ...tc };
        }
      });
    }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const result = parseShedsFromWorkbook(wb);
    result.sheds.forEach(s => {
      (s.pickups || []).forEach(p => {
        const key = `${s.id}_${iso(p.date)}`;
        if (manualWeights[key]){
          p.totalWeightKg = manualWeights[key].totalWeightKg;
          p.totalWeightKgManual = true;
          if (p.totalWeightKgFromExcel == null && manualWeights[key].totalWeightKgFromExcel != null){
            p.totalWeightKgFromExcel = manualWeights[key].totalWeightKgFromExcel;
          }
        }
      });
      if (manualTargets[s.id]){
        s.targetCurve = { ...manualTargets[s.id] };
      }
    });
    if (!predState.batchNumber && result.batchNumber){
      predState.batchNumber = sanitizeBatchNumber(result.batchNumber);
      savePredState();
    }
    farmData = {
      batchNumber: predState.batchNumber || result.batchNumber || '',
      importDate: new Date().toISOString(),
      fileName: file.name,
      sheds: result.sheds
    };
    activeTab = 'g1';
    saveState();
    if (syncFarmName && syncConnectedAt){ await uploadExcelToCloud(file); }
    else { schedulePush(); }
    render();
    const manualWeightCount = Object.keys(manualWeights).length;
    const manualTargetCount = Object.keys(manualTargets).length;
    showToast(
      `✅ Imported ${result.matched} shed${result.matched === 1 ? '' : 's'}` +
      (result.skipped ? ` · ${result.skipped} row(s) skipped` : '') +
      (manualWeightCount > 0 ? ` · kept ${manualWeightCount} weight edit${manualWeightCount === 1 ? '' : 's'}` : '') +
      (manualTargetCount > 0 ? ` · kept ${manualTargetCount} target curve${manualTargetCount === 1 ? '' : 's'}` : '') +
      (farmData.batchNumber ? ` · Batch ${farmData.batchNumber}` : '')
    );
  } catch (err){
    console.error(err);
    showToast('Import failed: ' + (err && err.message ? err.message : 'Unknown error.'), true);
  }
}

/* ---------- Editing ---------- */
function updateShedField(shedIdx, key, rawValue){
  if (!farmData) return;
  const shed = farmData.sheds[shedIdx]; if (!shed) return;
  if (key === 'placementDate' || key === 'cleanoutDate'){
    shed[key] = rawValue ? parseExcelDate(rawValue) : null;
    if (key === 'cleanoutDate'){
      const fp = finalPickupOf(shed);
      if (fp) shed.cleanoutDate = dateOnly(fp.date);
    }
  } else if (key === 'initialPopulation'){
    const n = Number(rawValue);
    shed.initialPopulation = Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
  } else if (key === 'mortality'){
    const n = Number(rawValue);
    shed.mortality = Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
  } else if (key === 'customFeedKg'){
    const s = String(rawValue ?? '').trim();
    if (s === '') shed.customFeedKg = null;
    else { const n = Number(s); shed.customFeedKg = (Number.isFinite(n) && n > 0) ? n : null; }
  }
  saveState(); schedulePush(); scheduleRender(60);
}
function setBatchNumber(v){
  const s = String(v ?? '').trim();
  if (!s){
    if (predState.batchNumber) return;
    predState.batchNumber = '';
    if (farmData) farmData.batchNumber = '';
    savePredState(); saveState(); schedulePush();
    return;
  }
  if (predState.batchNumber) return;
  predState.batchNumber = s;
  if (farmData) farmData.batchNumber = s;
  savePredState(); saveState(); schedulePush();
}
function setShedView(group, view){
  if (!['shed1','shed2','both','planner'].includes(view)) return;
  shedViewByGroup[group] = view;
  saveShedViews(); schedulePush(); render();
}

/* ---------- Predictions interactions ---------- */
function setPickupTotalWeight(shedId, pickupDateIso, value){
  if (!farmData) return;
  const shed = farmData.sheds[shedId - 1]; if (!shed) return;
  const pickup = (shed.pickups || []).find(p => iso(p.date) === pickupDateIso); if (!pickup) return;
  const v = String(value).trim();
  if (v === ''){ pickup.totalWeightKg = null; pickup.totalWeightKgManual = false; }
  else {
    const n = Number(v); if (!Number.isFinite(n) || n <= 0) return;
    pickup.totalWeightKg = n;
    pickup.totalWeightKgManual = true;
    if (pickup.totalWeightKgFromExcel == null) pickup.totalWeightKgFromExcel = n;
  }
  saveState(); schedulePush(); render();
}
function revertPickupTotalWeight(shedId, pickupDateIso){
  if (!farmData) return;
  const shed = farmData.sheds[shedId - 1]; if (!shed) return;
  const pickup = (shed.pickups || []).find(p => iso(p.date) === pickupDateIso); if (!pickup) return;
  pickup.totalWeightKg = pickup.totalWeightKgFromExcel || null;
  pickup.totalWeightKgManual = false;
  saveState(); schedulePush(); render();
}
function setTargetCurveValue(shedId, day, value){
  if (!farmData) return;
  const shed = farmData.sheds[shedId - 1]; if (!shed) return;
  if (!shed.targetCurve) shed.targetCurve = { 7: null, 14: null, 21: null, 28: null };
  const v = String(value).trim();
  if (v === ''){ shed.targetCurve[day] = null; }
  else { const n = Number(v); shed.targetCurve[day] = (Number.isFinite(n) && n > 0) ? n : null; }
  saveState(); schedulePush(); render();
}
function setPredBeta(v){
  let n = Number(v); if (!Number.isFinite(n)) n = 0.27;
  n = Math.max(0, Math.min(0.6, n));
  predState.beta = n;
  savePredState(); schedulePush(); render();
}
function setTargetHarvestWeight(group, v){
  let n = Number(v); if (!Number.isFinite(n) || n <= 0) n = 2.65;
  n = Math.max(0.5, Math.min(5, n));
  predState.targetHarvestWeightKg[group] = n;
  savePredState(); schedulePush(); render();
}
function setPredGroup(g){ predState.predGroup = g; savePredState(); render(); }
function setPredView(v){
  if (!['shed1','shed2','both'].includes(v)) return;
  predState.predView = v; savePredState(); render();
}
function setPredDailyRange(start, end){
  let s = Number(start), e = Number(end);
  if (!Number.isFinite(s)) s = 1;
  if (!Number.isFinite(e)) e = 52;
  s = Math.max(0, Math.min(200, Math.floor(s)));
  e = Math.max(0, Math.min(200, Math.floor(e)));
  if (e < s) e = s;
  predState.dailyRange = { start: s, end: e };
  savePredState(); schedulePush(); render();
}
function setFarmFeedOverride(rawVal){
  const s = String(rawVal ?? '').trim();
  if (s === ''){ predState.farmFeedOverride = null; }
  else {
    const n = Number(s);
    predState.farmFeedOverride = (Number.isFinite(n) && n > 0) ? n : null;
  }
  savePredState(); schedulePush();
}

function scheduleRender(delay = 50){
  const active = document.activeElement;
  const activeId = active ? active.id : null;
  let selStart = null, selEnd = null;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')){
    try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){}
  }
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    render();
    if (activeId){
      const el = document.getElementById(activeId);
      if (el){
        el.focus();
        if (selStart != null && typeof el.setSelectionRange === 'function'){
          try { el.setSelectionRange(selStart, selEnd); } catch(e){}
        }
      }
    }
  }, delay);
}

  const feedToday = groupFeedToday(sheds, today);

function rangeLabel(range){
  if (range.start === -7 && range.end === 0)  return 'Last 7 days';
  if (range.start === 0  && range.end === 0)  return 'Today only';
  if (range.start === 0  && range.end === 7)  return 'Next 7 days';
  if (range.start === 0  && range.end === 14) return 'Next 14 days';
  if (range.start === 0  && range.end === 21) return 'Next 21 days';
  if (range.start < 0 && range.end === 0) return `Last ${Math.abs(range.start)} days`;
  if (range.start === 0 && range.end > 0) return `Next ${range.end} days`;
  return `${range.start} to ${range.end} days`;
}

function renderShedForecastTable(shed, forecast){

      r.isPast ? 'is-past' : '',
      r.isToday ? 'is-today' : '',

    ].filter(Boolean).join(' ');
