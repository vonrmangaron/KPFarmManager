function renderDailyPerformance(shed){
  if (!shed.placementDate){
    return `
      <div class="pickups-block" style="margin-top:14px;">
        <h4>📅 Daily Performance — Actual + AI Forecast</h4>
        <div class="forecast-empty">No placement date set — forecast unavailable.</div>
      </div>`;
  }

  const today    = dateOnly(new Date());
  const last     = lastWeightedPickup(shed);
  const currentAge = ageInDays(shed, today);
  const fit = getShedGompertzFit(shed);
  const effective = computeEffectivePickups(shed);

  let startDay, endDay;
  if (dailyRangeState.mode === 'cycle'){
    startDay = Math.max(0, Math.floor(dailyRangeState.start));
    endDay   = Math.max(startDay, Math.floor(dailyRangeState.end));
  } else {
    startDay = Math.max(0, currentAge + Math.floor(dailyRangeState.start));
    endDay   = Math.max(startDay, currentAge + Math.floor(dailyRangeState.end));
  }

  const rows = [];
  for (let day = startDay; day <= endDay; day++){
    const d        = addDays(shed.placementDate, day);
    const age      = day;
    const live     = liveAtStartOfDay(shed, d);
    const pickupsToday = effective.filter(p => iso(p.date) === iso(d));
    const pickupsBirds = pickupsToday.reduce((s,p) => s + p.birds, 0);
    const hasPredicted = pickupsToday.some(p => p.__source === 'predicted');
    const isToday  = iso(d) === iso(today);
    const isPast   = d < today;
    const wknd     = isWeekend(d);
    const standard = age > 0 ? rossWeightKg(age) : 0;
    const isMilestone = isMilestoneDay(age);
    const gridVal = (shed.targetCurve && shed.targetCurve[age] != null && Number(shed.targetCurve[age]) > 0)
      ? Number(shed.targetCurve[age])
      : null;
    const customOn = (shed.inYardSamples || []).find(x => sampleAge(shed, x) === age);

    let weight = null;
    let weightType = null;
    let band = null;
    if (age > 0){
      const f = forecastWeightModeAware(shed, d);
      if (f.kg != null){
        weight = f.kg;
        band = f.band || null;
        if (f.mode === 'gompertz') weightType = 'gompertz';
        else if (f.mode === 'ross-scaled') weightType = 'ross-scaled';
        else if (f.mode === 'ai-pickup') weightType = 'ai-pickup';
        else if (f.mode === 'ai-target') weightType = 'ai-target';
        else weightType = 'standard';
      }
    }

    let daysVar = null;
    if (weight != null && age > 0){ daysVar = daysVsTarget(age, weight); }

    rows.push({
      date: d, day, age, live, pickupsBirds, hasPredicted,
      standard, weight, weightType, daysVar, band,
      isToday, isPast, isWeekend: wknd, isMilestone,
      gridVal, customOn
    });
  }

  let sourceNote = '';
  if (fit){
    const nGrid = TARGET_DAYS.filter(d => shed.targetCurve && shed.targetCurve[d] > 0).length;
    const nCustom = (shed.inYardSamples || []).length;
    const nPickups = (shed.pickups || []).filter(p => pickupAvgKg(p)).length;
    const parts = [];
    if (nGrid > 0) parts.push(`${nGrid} check-day${nGrid === 1 ? '' : 's'}`);
    if (nCustom > 0) parts.push(`${nCustom} extra reading${nCustom === 1 ? '' : 's'}`);
    if (nPickups > 0) parts.push(`${nPickups} pickup weight${nPickups === 1 ? '' : 's'}`);
    sourceNote = `Based on ${parts.join(', ') || 'chick weight only'}.`;
  } else if (last){
    const gain = observedDailyGain(shed);
    sourceNote = gain != null
      ? `Based on pickup weights — observed gain of ${(gain * 1000).toFixed(1)} g/day.`
      : `Based on pickup weights.`;
  } else if (TARGET_DAYS.some(d => shed.targetCurve && shed.targetCurve[d] > 0) || (shed.inYardSamples || []).length > 0){
    sourceNote = `Based on your shed scale readings.`;
  } else {
    sourceNote = `No readings yet — showing the standard growth curve.`;
  }

  const hasAnyPredicted = effective.some(p => p.__source === 'predicted');
  if (hasAnyPredicted){
    sourceNote += ` <strong style="color:var(--secondary);">Planned pickups are included in this forecast.</strong>`;
  }

  return `
    <div class="pickups-block" style="margin-top:14px;">
      <h4>📅 Daily Performance — Actual + AI Forecast
        <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;">
          · Day ${startDay}–${endDay} of cycle · ⭐ = check day · 📏 = weighed
        </span>
      </h4>
      <div class="forecast-table-wrap">
        <table class="pred-daily-table" style="min-width:820px;">
          <thead>
            <tr>
              <th>Date</th>
              <th class="num">Age</th>
              <th class="num">Live birds</th>
              <th class="num">Weight (kg)</th>
              <th class="num">Standard (kg)</th>
              <th class="num">Days vs Standard</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const cls = [
                r.isToday ? 'is-today' : '',
                r.isWeekend ? 'is-weekend' : '',
                r.hasPredicted ? 'predicted-pickup-row' : '',
                (r.weightType === 'gompertz' || r.weightType === 'ai-pickup' || r.weightType === 'ai-target' || r.weightType === 'ross-scaled') ? 'is-forecast-row' : ''
              ].filter(Boolean).join(' ');
              const todayTag = r.isToday ? ' · <span style="color:var(--secondary);font-weight:700;">Today</span>' : '';
              const wkndTag  = r.isWeekend ? ' <span class="weekend-pill">Weekend</span>' : '';
              const pickupNote = r.pickupsBirds > 0
                ? ` <span style="font-size:10px;color:${r.hasPredicted ? 'var(--secondary)' : 'var(--primary-dark)'};font-weight:700;">−${r.pickupsBirds.toLocaleString()}${r.hasPredicted ? ' (plan)' : ''}</span>`
                : '';
              const milestoneBadge = r.isMilestone ? `<span class="milestone-pill" title="Check day">★ Day ${r.age}</span>` : '';

              let readingBadge = '';
              if (r.gridVal != null){
                readingBadge = `<span class="sample-pill" title="Shed scale reading: ${r.gridVal.toFixed(3)} kg">📏</span>`;
              } else if (r.customOn){
                readingBadge = `<span class="sample-pill" title="${r.customOn.isOfficial ? 'Plant weight' : 'Shed scale'}: ${r.customOn.avgWeightKg.toFixed(3)} kg">📏</span>`;
              }

              let weightCell = '—';
              if (r.weight != null){
                const bandStr = (r.band != null && r.weightType === 'gompertz') ? `<span class="conf-band">±${(r.band*100).toFixed(0)}%</span>` : '';
                if      (r.weightType === 'gompertz')   weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span>${bandStr}<span class="w-pill gompertz">AI curve</span>`;
                else if (r.weightType === 'ross-scaled') weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill forecast">Adjusted</span>`;
                else if (r.weightType === 'ai-pickup')  weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill forecast">From pickup</span>`;
                else if (r.weightType === 'ai-target')  weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill ai-target">From targets</span>`;
                else if (r.weightType === 'standard')   weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill standard">Standard</span>`;
              }

              let daysCell = '—';
              let daysCls  = '';
              if (r.daysVar != null){
                if (Math.abs(r.daysVar) < 0.1){ daysCell = 'On target'; daysCls = 'days-neu'; }
                else if (r.daysVar > 0){ daysCell = `${r.daysVar.toFixed(1)}d ahead`; daysCls = 'days-pos'; }
                else { daysCell = `${Math.abs(r.daysVar).toFixed(1)}d behind`; daysCls = 'days-neg'; }
              }

              const stdCell = r.age > 0 ? r.standard.toFixed(3) : '—';

              return `
                <tr class="${cls}">
                  <td>${fmtShort(r.date)}${todayTag}${wkndTag}${readingBadge}</td>
                  <td class="num">${r.age}d${milestoneBadge}</td>
                  <td class="num">${r.live.toLocaleString()}${pickupNote}</td>
                  <td class="num">${weightCell}</td>
                  <td class="num" style="color:var(--muted);">${stdCell}</td>
                  <td class="num ${daysCls}">${daysCell}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;">
        ${sourceNote}
      </div>
    </div>`;
}
function renderDaysBehind(shed){
  const today = dateOnly(new Date());
  const currentAge = ageInDays(shed, today);
  if (currentAge <= 0) return '';
  const f = forecastWeightModeAware(shed, today);
  if (!f || f.kg == null) return '';
  const currentWeight = f.kg;
  const band = f.band || null;
  const daysVar = daysVsTarget(currentAge, currentWeight);
  let status, cls, icon;
  if (daysVar == null || Math.abs(daysVar) < 0.5){ status = 'On Target';             cls = 'on-track';     icon = '✅'; }
  else if (daysVar > 0)                          { status = 'Ahead of Standard';     cls = 'ahead';        icon = '🟢'; }
  else if (daysVar >= -3)                        { status = 'Slightly Behind';       cls = 'behind';       icon = '🟡'; }
  else                                           { status = 'Significantly Behind';  cls = 'behind-major'; icon = '🔴'; }
  let daysText;
  if (daysVar == null || Math.abs(daysVar) < 0.1){ daysText = 'Matching the standard growth curve'; }
  else if (daysVar > 0){ daysText = `${daysVar.toFixed(1)} day${Math.abs(daysVar - 1) < 0.05 ? '' : 's'} ahead of the standard`; }
  else { daysText = `${Math.abs(daysVar).toFixed(1)} day${Math.abs(daysVar - 1) < 0.05 ? '' : 's'} behind the standard`; }
  const bandStr = band != null ? ` <span style="color:var(--muted);font-weight:500;">(±${(band*100).toFixed(0)}% margin)</span>` : '';
  return `
    <div class="pred-days-behind ${cls}">
      <span class="dbi-lbl">📏 vs standard growth</span>
      <span class="dbi-val">${icon} ${status}</span>
      <span class="dbi-note">
        <strong>${daysText}</strong>
        · Currently <strong>${currentWeight.toFixed(3)} kg</strong>${bandStr} at day <strong>${currentAge}</strong>
      </span>
    </div>`;
}
function renderPickupPlanBlock(shed){
  const pps = (shed.predictedPickups || []).slice().sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  const realDates = new Set((shed.pickups || []).map(p => iso(p.date)));
  const realPickups = (shed.pickups || []);
  const hasRealFinal = realPickups.some(p => p.isFinal);
  const ds = getShedDensitySettings(shed);
  const useGlobalDensity = ds.useGlobal !== false;
  const targetN = ds.targetPickups;
  const realCount = realPickups.length;

  const activePps = pps.filter(pp => !realDates.has(iso(pp.date)));

  let simList = [...realPickups.map(p => ({ date: p.date, birds: Number(p.birds) || 0 }))];
  const rows = [];
  for (const pp of pps){
    const isSuperseded = realDates.has(iso(pp.date));
    const dateObj = pp.date;
    const age = ageInDays(shed, dateObj);
    const weight = (forecastWeightModeAware(shed, dateObj).kg) || 0;
    const beforeBirds = Math.max(0,
      (shed.initialPopulation || 0) - Number(shed.mortality || 0) -
      simList.filter(x => dateOnly(x.date) < dateOnly(dateObj)).reduce((s,x) => s + (Number(x.birds) || 0), 0)
    );
    const densityBefore = (beforeBirds * weight) / FIXED_FLOOR_AREA_M2;
    const afterBirds = Math.max(0, beforeBirds - (Number(pp.birds) || 0));
    const densityAfter = (afterBirds * weight) / FIXED_FLOOR_AREA_M2;
    rows.push({
      pp, age, weight, beforeBirds, afterBirds, densityBefore, densityAfter,
      isSuperseded
    });
    if (!isSuperseded){ simList.push({ date: pp.date, birds: Number(pp.birds) || 0 }); }
  }
  simList.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));

  const predictedCount = pps.length;
  const totalPlannedCount = realCount + predictedCount;

  let progressHtml = '';
  if (hasRealFinal){
    progressHtml = `<span class="progress-done">✅ Batch complete — cleanout recorded</span>`;
  } else if (totalPlannedCount >= targetN && predictedCount > 0){
    progressHtml = `<span class="progress-ok">✅ Plan complete — ${realCount} real + ${predictedCount} planned = ${totalPlannedCount}/${targetN}</span>`;
  } else if (totalPlannedCount >= targetN){
    progressHtml = `<span class="progress-ok">✅ Target reached — ${realCount} real pickups</span>`;
  } else {
    progressHtml = `<span class="progress-short">⚠️ ${realCount} real + ${predictedCount} planned = ${totalPlannedCount}/${targetN} — ${targetN - totalPlannedCount} more needed</span>`;
  }

  const targetInputHtml = `
    <div class="pp-target-row">
      <span class="pp-target-label">🎯 Target pickups for this shed</span>
      <input type="number" class="pp-target-input"
        min="${MIN_PICKUPS_PER_SHED}" max="${MAX_PICKUPS_PER_SHED}" step="1"
        value="${targetN}"
        data-shed-target-pickups="${shed.id}"
        title="Total pickups including the final cleanout (${MIN_PICKUPS_PER_SHED} or ${MAX_PICKUPS_PER_SHED})" />
      <span class="pp-target-hint">${MIN_PICKUPS_PER_SHED} or ${MAX_PICKUPS_PER_SHED} (includes the final cleanout)</span>
    </div>`;

  const densityOverrideHtml = `
    <div class="shed-density-override">
      <label>
        <input type="checkbox" data-density-use-global="${shed.id}" ${useGlobalDensity ? 'checked' : ''} />
        Use global density settings
      </label>
      ${!useGlobalDensity ? `
        <span class="ovr-inputs">
          <span>Trigger</span>
          <input type="number" min="20" max="45" step="0.5" value="${ds.triggerDensity}" data-density-override="${shed.id}|triggerDensity" />
          <span>Target</span>
          <input type="number" min="15" max="35" step="0.5" value="${ds.targetDensity}" data-density-override="${shed.id}|targetDensity" />
          <span>Max</span>
          <input type="number" min="28" max="45" step="0.5" value="${ds.maxDensity}" data-density-override="${shed.id}|maxDensity" />
        </span>
      ` : ''}
    </div>`;

  if (hasRealFinal){
    return `
      <div class="pickup-plan-block">
        <h4>
          <span>🎯 Predicted Pickups</span>
          <span style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn-pp-clear" data-pp-clear="${shed.id}" type="button" title="Remove any leftover predicted pickups">🗑️ Clear</button>
          </span>
        </h4>
        <div class="pp-empty" style="background:linear-gradient(135deg,rgba(76,122,59,0.10),rgba(76,122,59,0.04));border-color:var(--success);color:var(--success);font-weight:600;">
          ✅ Target reached — a cleanout pickup is already recorded for this shed.<br>
          No predicted pickups needed.
        </div>
        <div class="pp-summary" style="margin-top:10px;">
          <div>${progressHtml}</div>
          <div><span class="lbl">Real pickups on record:</span> <strong>${realCount}</strong></div>
        </div>
        ${targetInputHtml}
        ${densityOverrideHtml}
      </div>`;
  }

  if (pps.length === 0){
    return `
      <div class="pickup-plan-block">
        <h4>
          <span>🎯 Predicted Pickups</span>
        </h4>
        <div class="pp-empty">
          Plan hypothetical pickups to see how the whole-batch forecast changes.
          The last pickup is the <strong>final cleanout</strong> and sits on the shed's cleanout date.
          Regular predicted pickups trigger when density reaches <strong>${ds.triggerDensity} kg/m²</strong> and bring it back to <strong>${ds.targetDensity} kg/m²</strong>.
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
          <button class="btn-pp-add" data-pp-add="${shed.id}" type="button">＋ Add Predicted Pickup</button>
          <button class="btn-pp-autofill" data-pp-autofill="${shed.id}" type="button" title="Auto-generate the optimal pickup plan">✨ Auto-fill Plan</button>
        </div>
        <div class="pp-summary" style="margin-top:10px;">
          <div>${progressHtml}</div>
        </div>
        ${targetInputHtml}
        ${densityOverrideHtml}
      </div>`;
  }

  const totalActiveRemoval = activePps.reduce((s, pp) => s + (Number(pp.birds) || 0), 0);

  return `
    <div class="pickup-plan-block">
      <h4>
        <span>🎯 Predicted Pickups (${predictedCount})</span>
        <span style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-pp-autofill" data-pp-autofill="${shed.id}" type="button" title="Auto-generate the optimal pickup plan">✨ Auto-fill</button>
          <button class="btn-pp-add" data-pp-add="${shed.id}" type="button">＋ Add</button>
          <button class="btn-pp-clear" data-pp-clear="${shed.id}" type="button" title="Remove all predicted pickups for this shed">🗑️ Clear</button>
        </span>
      </h4>
      <div class="pp-list">
        ${rows.map(r => {
          const classes = ['pp-row'];
          if (r.isSuperseded) classes.push('pp-superseded');
          if (r.pp.isFinal) classes.push('pp-final');
          const badges = [];
          if (r.isSuperseded) badges.push('<span class="pp-badge">Replaced by actual</span>');
          if (r.pp.isFinal) badges.push('<span class="pp-badge final">FINAL CLEANOUT</span>');
          const badgeHtml = badges.join('');
          return `
            <div class="${classes.join(' ')}">
              <div class="pp-info">
                <div class="pp-date">${fmtShort(r.pp.date)} · Day ${r.age} ${badgeHtml}</div>
                <div class="pp-meta">
                  Remove <strong>${(Number(r.pp.birds) || 0).toLocaleString()}</strong> birds
                  · Density ${r.densityBefore.toFixed(1)} → ${r.densityAfter.toFixed(1)} kg/m²
                </div>
              </div>
              <div class="pp-actions">
                <button type="button" data-pp-edit="${shed.id}|${r.pp.id}" title="Edit">✎</button>
                <button type="button" class="danger" data-pp-delete="${shed.id}|${r.pp.id}" title="Delete">✕</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="pp-summary">
        <div>${progressHtml}</div>
        <div><span class="lbl">Total planned removal:</span> <strong>${totalActiveRemoval.toLocaleString()}</strong> birds</div>
      </div>
      ${targetInputHtml}
      ${densityOverrideHtml}
    </div>`;
}
function renderPredictionsShedCard(shed, group){
  const pred = computePredictions(shed, group);
  const grp = computeGroupPredictions(group);
  const groupSheds = shedsForGroup(group);
  const groupHasData = groupSheds.some(s => (s.pickups || []).length > 0)
    || groupSheds.some(s => (s.inYardSamples || []).length > 0)
    || groupSheds.some(s => TARGET_DAYS.some(d => s.targetCurve && s.targetCurve[d] > 0));
  const groupConf = confidenceLabel(grp && grp.hasData ? grp.confidence : pred.confidence);
  const pickups = pred.pickupDetails;

  const today = dateOnly(new Date());
  const fToday = forecastWeightModeAware(shed, today);
  const forecastKg = fToday && fToday.kg ? fToday.kg : 0;
  const densityKg = pred.liveNow * forecastKg;
  const densityVal = densityKg / FIXED_FLOOR_AREA_M2;
  const densityDisplay = pred.liveNow === 0 ? '0.0' : densityVal.toFixed(1);
  const dsCurrent = getShedDensitySettings(shed);
  const densityTone = densityVal > dsCurrent.maxDensity ? 'red' : (densityVal > dsCurrent.triggerDensity ? 'amber' : '');
  const densityStyle = densityTone === 'red'
    ? 'color:var(--danger);'
    : (densityTone === 'amber' ? 'color:var(--primary-dark);' : '');

  const currentMortRate = pred.initialPop > 0 ? ((pred.currentMort / pred.initialPop) * 100).toFixed(2) : '0.00';

  const snapshotHtml = `
    <div class="pred-snapshot">
      <div class="pred-snap-item"><div class="lbl">🐥 Birds placed</div><div class="val">${pred.initialPop.toLocaleString()}</div></div>
      <div class="pred-snap-item"><div class="lbl">📆 Current age</div><div class="val">${pred.currentAge}d</div></div>
      <div class="pred-snap-item">
        <div class="lbl">⚠️ Mortality</div>
        <div class="val">
          <input type="number" class="snapshot-mort-input" min="0" step="1"
            value="${Math.max(0, Number(shed.mortality) || 0)}"
            data-shed="${shed.id - 1}" data-field="mortality"
            id="snapshotMortP_${shed.id}"
            title="Edit actual mortality count for this shed" />
        </div>
        <div class="sub">${currentMortRate}% of placed</div>
      </div>
      <div class="pred-snap-item"><div class="lbl">🐔 Live birds</div><div class="val">${pred.liveNow.toLocaleString()}</div></div>
      <div class="pred-snap-item"><div class="lbl">🔄 Pickups done</div><div class="val">${(shed.pickups || []).length} of ${dsCurrent.targetPickups}</div></div>
      <div class="pred-snap-item">
        <div class="lbl">📐 Density today</div>
        <div class="val" style="${densityStyle}">${densityDisplay} <span style="font-size:11px;font-weight:600;color:var(--muted);">kg/m²</span></div>
        <div class="sub">${pred.liveNow.toLocaleString()} × ${forecastKg.toFixed(3)} kg ÷ 3,162 m²</div>
      </div>
    </div>`;

  const ratePct = shedMortRate(shed);
  const rateBarHtml = `
    <div class="mort-rate-bar">
      <span class="mr-label">🩺 Daily mortality rate</span>
      <input type="range" id="mortRateSlider_${shed.id}" min="0" max="1" step="0.01"
        value="${ratePct}" data-mortrate-shed="${shed.id}" />
      <input type="number" id="mortRateNum_${shed.id}" min="0" max="${MAX_MORT_RATE_PCT}" step="0.01"
        value="${ratePct.toFixed(2)}" data-mortrate-shed="${shed.id}" />
      <span class="mr-unit">% of live birds / day</span>
    </div>`;

  const curvePanelHtml = renderInYardCurvePanel(shed);
  const planBlockHtml = renderPickupPlanBlock(shed);

  const pickupRows = pickups.filter(p => !p.isPredicted).map(p => {
    const stored = (shed.pickups || []).find(x => iso(x.date) === iso(p.date)) || {};
    const isManualWeight = !!stored.totalWeightKgManual;
    const hasExcelFrom = stored.totalWeightKgFromExcel != null;
    const isManualSource = stored.source === 'manual';
    const totalValue = (stored.totalWeightKg != null) ? stored.totalWeightKg : '';
    const warn = totalValue && (totalValue < 100 || totalValue > 40000);
    const avgValue = p.avgWeightKg ? p.avgWeightKg.toFixed(3) : '—';
    const avgWarn = p.avgWeightKg && (p.avgWeightKg < 0.3 || p.avgWeightKg > 5);
    const ageBadge = stored.ageOverride != null ? ' *' : '';
    const sourceBadge = isManualSource ? `<span class="tag manual-source" style="font-size:9px;padding:1px 6px;margin-left:6px;">Manual</span>` : '';
    const showRevert = isManualWeight && hasExcelFrom;
    return `
      <tr class="${p.isFinal ? 'is-final' : ''}">
        <td>${fmtShort(p.date)}${sourceBadge}</td>
        <td class="num" title="${stored.ageOverride != null ? 'Age manually set' : 'Age derived from placement date'}">${p.age}d${ageBadge}</td>
        <td class="num">${p.birds.toLocaleString()}</td>
        <td class="num">
          <input class="pred-pickup-input ${isManualWeight?'manual':''} ${warn?'warn':''}"
            type="number" step="1" min="0"
            value="${totalValue}"
            placeholder="${p.isEstWeight ? 'Standard est.' : 'total kg'}"
            data-pickup-shed="${shed.id}" data-pickup-date="${iso(p.date)}"
            title="${isManualWeight ? 'Manually edited' : (p.isEstWeight ? 'No Excel weight — using standard curve estimate' : 'From Excel')}" />
        </td>
        <td class="pred-avg-cell" style="${avgWarn?'color:var(--danger);':''}">${avgValue}</td>
        <td style="text-align:right;">
          <div class="pickup-actions">
            <button class="pickup-actions-btn" type="button"
              data-pickup-actions-btn="${shed.id}|${iso(p.date)}"
              aria-label="Pickup actions">⋯</button>
            <div class="pickup-actions-menu">
              <button type="button" data-pickup-edit="${shed.id}|${iso(p.date)}">✎ Edit pickup</button>
              ${showRevert ? `<button type="button" data-pickup-revert="${shed.id}|${iso(p.date)}">↺ Revert weight to Excel</button>` : ''}
              <button type="button" class="danger" data-pickup-delete="${shed.id}|${iso(p.date)}">✕ Delete pickup</button>
            </div>
          </div>
        </td>
      </tr>`;
  }).join('');

  const realPickupCount = (shed.pickups || []).length;
  const pickupTableHtml = realPickupCount === 0
    ? `<div class="forecast-empty">No pickups yet — estimates unlock after the first pickup.</div>`
    : `
      <div class="pickups-scroll">
        <table class="pickups-table" style="font-size:12.5px;min-width:560px;">
          <thead>
            <tr><th>Date</th><th class="num">Age</th><th class="num">Birds</th>
              <th class="num">Total wt (kg)</th><th class="num">Avg wt (kg/bird)</th>
              <th style="width:44px;text-align:right;">Actions</th></tr>
          </thead>
          <tbody>${pickupRows}</tbody>
        </table>
      </div>`;

  const canAdd = realPickupCount < MAX_PICKUPS_PER_SHED;
  const pill = pickupPlanPillHtml(shed);
  const pickupHeaderHtml = `
    <h4 class="pickup-header">
      <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Pickup History — average weight computed from total ÷ birds</span>
        ${pill}
      </span>
      <button class="btn-pickup-add"
        data-pickup-add="${shed.id}"
        type="button"
        ${canAdd ? '' : 'disabled'}
        title="${canAdd ? 'Add a pickup manually' : 'Maximum 5 pickups reached'}">
        ＋ Add Actual Pickup
      </button>
    </h4>`;

  const groupLabel = grp && grp.hasData ? `Group ${group} Combined Result` : `Group ${group} Result`;
  const groupShedsLabel = groupSheds.map(s => `Shed ${s.id}`).join(' + ');

  const estimatesHtml = (groupHasData && grp && grp.hasData) ? `
    <div class="pred-estimates-head">
      <span>📊 ${groupLabel}</span>
      <span class="sub">· ${groupShedsLabel} · batch result</span>
    </div>
    <div class="pred-estimates">
      <div class="pred-est-tile amber">
        <div class="lbl">Est. Final Avg Weight</div>
        <div class="val">${grp.avgWeight.toFixed(3)} <span style="font-size:12px;font-weight:600;color:var(--muted);">kg</span></div>
      </div>
      <div class="pred-est-tile"><div class="lbl">Est. Final FCR</div><div class="val">${grp.fcr.toFixed(3)}</div></div>
      <div class="pred-est-tile green"><div class="lbl">Est. Final cFCR</div><div class="val">${grp.cfcr.toFixed(3)}</div></div>
      <div class="pred-est-tile green"><div class="lbl">Est. Livability</div><div class="val">${grp.livability.toFixed(2)}%</div></div>
      <div class="pred-est-tile"><div class="lbl">Est. Mortality</div><div class="val">${grp.totalMortalityEst.toLocaleString()}</div></div>
      <div class="pred-est-tile"><div class="lbl">Est. Total Live Wt</div><div class="val">${fmtFeed(grp.totalLiveWeight)}</div></div>
      <div class="pred-est-tile amber" style="grid-column: span 2;">
        <div class="lbl">Est. Final PIF</div>
        <div class="val">${grp.pif.toFixed(2)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px;">Overall score: weight × survival ÷ (age × FCR)</div>
      </div>
    </div>` : `
    <div class="pred-empty" style="margin-top:14px;">
      <strong>Group estimates unlock after the first reading or pickup.</strong><br>
      Enter shed scale readings at Day 7/14/21/28, or import Excel with pickup data.
    </div>`;

  const confidenceHtml = (groupHasData && grp && grp.hasData) ? `
    <div class="pred-confidence">
      <span style="font-weight:700;font-size:11px;text-transform:uppercase;
        letter-spacing:0.06em;color:var(--muted);">Group Confidence</span>
      <div class="bar"><div class="bar-fill ${groupConf.cls}" style="width:${grp.confidence}%"></div></div>
      <span class="pct" style="color:${groupConf.cls === 'low' ? 'var(--danger)' : (groupConf.cls === 'medium' ? 'var(--primary-dark)' : 'var(--success)')};">
        ${grp.confidence}%
      </span>
      <span style="font-size:11px;color:var(--muted);">${groupConf.label}</span>
    </div>` : '';

  const daysBehindHtml = renderDaysBehind(shed);
  const dailyPerfHtml = renderDailyPerformance(shed);

  return `
    <article class="pred-shed-card" id="pred-shed-card-${shed.id}">
      <div class="pred-shed-head">
        <h3>🏠 Shed ${shed.id}</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span class="tag muted">Age ${pred.currentAge}d</span>
          <span class="tag amber">Live ${pred.liveNow.toLocaleString()}</span>
          ${pred.gompertzFit ? `<span class="tag green">AI curve</span>` : ''}
          ${realPickupCount > 0 ? `<span class="tag green">${realPickupCount} pickup${realPickupCount === 1 ? '' : 's'}</span>` : ''}
        </div>
      </div>
      <div class="pred-shed-body">
        ${snapshotHtml}
        ${rateBarHtml}
        ${curvePanelHtml}
        ${daysBehindHtml}
        ${forecastDayBarHtml()}
        ${dailyPerfHtml}
        <div class="pickups-block" style="margin-top:14px;">
          ${pickupHeaderHtml}
          ${pickupTableHtml}
        </div>
        ${planBlockHtml}
        ${estimatesHtml}
        ${confidenceHtml}
      </div>
    </article>`;
}

/* ---------- Event wiring ---------- */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(loadTheme());
  loadSyncState();
  loadPredState();

  const saved = loadState();
  if (saved) farmData = saved;
  initShedViews();
  const savedSilo = loadSiloData();
  if (savedSilo) siloData = savedSilo;
  render();

  if (syncFarmName && syncConnectedAt){
    if (syncLastSyncAt){ pullFromCloud(true).catch(() => {}); }
    else { pushToCloud().catch(() => {}); }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#cluckwiseBtn')){ window.open(CLUCKWISE_URL, '_blank', 'noopener'); return; }
    if (e.target.closest('#themeToggle')){ toggleTheme(); return; }
    if (e.target.closest('#settingsBtn')){ openSettingsDrawer(); return; }
    if (e.target.closest('#settingsDrawerClose')){ closeSettingsDrawer(); return; }
    if (e.target.closest('#settingsScrim')){ closeSettingsDrawer(); return; }
    if (e.target.closest('#newBatchBtn')){ openNewBatchModal(); return; }
    if (e.target.closest('#newBatchClose')){ closeNewBatchModal(); return; }
    if (e.target.closest('#batchHistoryClose')){ closeBatchHistoryModal(); return; }
    if (e.target.closest('#farmBatchPickerClose')){
      closeFarmBatchPickerModal();
      if (!syncConnectedAt){ syncFarmName = null; saveSyncState(); renderSettingsDrawerBody(); render(); }
      return;
    }
    if (e.target.closest('#syncModalClose')){ closeSyncModal(); return; }
    if (e.target.closest('#farmFoundClose')){ closeFarmFoundModal(); return; }
    if (e.target.closest('#manualPickupClose')){ closeManualPickupModal(); return; }
    if (e.target.closest('#sampleClose')){ closeSampleModal(); return; }
    if (e.target.closest('#predictedPickupClose')){ closePredictedPickupModal(); return; }
    if (e.target.closest('#deliveryClose')){ closeDeliveryModal(); return; }
    if (e.target.closest('#importConflictClose')){ closeImportConflictModal(); pendingImport = null; return; }
    if (e.target.closest('#importReviewClose')){ closeImportReviewModal(); return; }
    if (e.target.closest('#importBtn') || e.target.closest('#emptyImportBtn') || e.target.closest('#settingsImportBtn')){ triggerImport(); return; }
    if (e.target.closest('#emptyConnectBtn')){ openSyncModal(); return; }

    if (e.target.closest('#settingsConnectBtn')){
      const inp = document.getElementById('settingsFarmInput');
      const v = inp ? inp.value.trim() : '';
      if (!v){ showToast('Enter a farm name.', true); return; }
      handleConnectFarm(v);
      return;
    }
    if (e.target.closest('#settingsSyncNowBtn')){ pullFromCloud(false); return; }
    if (e.target.closest('#settingsChangeFarmBtn')){ openSyncModal(); return; }
    if (e.target.closest('#settingsDlExcelBtn')){ downloadExcelFromCloud(); return; }
    if (e.target.closest('#settingsDlBatchBtn')){ downloadCurrentBatchAsJson(); return; }
    if (e.target.closest('#settingsDisconnectBtn')){ disconnectSync(); return; }
    if (e.target.closest('#settingsBatchHistoryBtn')){ openBatchHistoryModal(); return; }

    if (e.target.closest('[data-toggle-adjustments]')){
      toggleAdjCollapse();
      return;
    }
    if (e.target.closest('[data-global-autofill]')){
      autoFillAllSheds();
      return;
    }
    if (e.target.closest('[data-global-clear-pickups]')){
      clearAllPredictedPickups();
      return;
    }

    const inlineTestBtn = e.target.closest('[data-inline-test]');
    if (inlineTestBtn){
      e.stopPropagation();
      const parts = inlineTestBtn.dataset.inlineTest.split('|');
      const g = Number(parts[0]);
      const dIso = parts[1];
      const inlineInput = inlineTestBtn.closest('.inline-del')?.querySelector('.inline-del-input');
      const amt = inlineInput ? Number(inlineInput.value) : NaN;
      if (!Number.isFinite(amt) || amt <= 0){ showToast('Enter a positive amount in tonnes.', true); inlineInput && inlineInput.focus(); return; }
      const ok = addTestDelivery(g, dIso, amt);
      if (ok){ inlineDeliveryState = null; render(); }
      return;
    }
    const inlineActualBtn = e.target.closest('[data-inline-actual]');
    if (inlineActualBtn){
      e.stopPropagation();
      const parts = inlineActualBtn.dataset.inlineActual.split('|');
      const g = Number(parts[0]);
      const dIso = parts[1];
      const inlineInput = inlineActualBtn.closest('.inline-del')?.querySelector('.inline-del-input');
      const amt = inlineInput ? Number(inlineInput.value) : NaN;
      const prefill = (Number.isFinite(amt) && amt > 0) ? amt : null;
      inlineDeliveryState = null;
      render();
      openDeliveryModal(g, dIso, prefill);
      return;
    }
    const inlineCancelBtn = e.target.closest('[data-inline-cancel]');
    if (inlineCancelBtn){
      e.stopPropagation();
      inlineDeliveryState = null;
      render();
      return;
    }

    const removeTestBtn = e.target.closest('[data-remove-test]');
    if (removeTestBtn){
      e.stopPropagation();
      const parts = removeTestBtn.dataset.removeTest.split('|');
      removeTestDelivery(Number(parts[0]), parts[1]);
      return;
    }
    const clearTestsBtn = e.target.closest('[data-clear-tests]');
    if (clearTestsBtn){
      clearTestDeliveries(Number(clearTestsBtn.dataset.clearTests));
      return;
    }

    const forecastRow = e.target.closest('[data-forecast-date]');
    if (forecastRow && !e.target.closest('.inline-del')){
      const g = Number(forecastRow.dataset.forecastGroup);
      const dIso = forecastRow.dataset.forecastDate;
      if (Number.isFinite(g) && dIso){
        if (forecastRow.dataset.blocked === '1'){
          showToast('⚠️ Official delivery already scheduled on this day — delete it in Scheduled Deliveries to unlock this row.', true);
          return;
        }
        if (inlineDeliveryState && inlineDeliveryState.group === g && inlineDeliveryState.dateIso === dIso){
          inlineDeliveryState = null;
        } else {
          inlineDeliveryState = { group: g, dateIso: dIso };
        }
        render();
      }
      return;
    }

    const gotoCardBtn = e.target.closest('[data-goto-predcard]');
    if (gotoCardBtn){
      const shedId = Number(gotoCardBtn.dataset.gotoPredcard);
      if (!Number.isFinite(shedId)) return;
      const group = Math.floor((shedId - 1) / 2) + 1;
      const isFirstOfGroup = (shedId % 2 === 1);
      activeTab = 'predictions';
      predState.predGroup = group;
      predState.predView = isFirstOfGroup ? 'shed1' : 'shed2';
      savePredState();
      render();
      const card = document.getElementById(`pred-shed-card-${shedId}`);
      if (card) card.scrollIntoView({ behavior: 'auto', block: 'start' });
      return;
    }

    const ppAddBtn = e.target.closest('[data-pp-add]');
    if (ppAddBtn){ openPredictedPickupModal(Number(ppAddBtn.dataset.ppAdd)); return; }
    const ppAutofillBtn = e.target.closest('[data-pp-autofill]');
    if (ppAutofillBtn){ autoFillPredictedPickupsForShed(Number(ppAutofillBtn.dataset.ppAutofill)); return; }
    const ppClearBtn = e.target.closest('[data-pp-clear]');
    if (ppClearBtn){ clearPredictedPickupsForShed(Number(ppClearBtn.dataset.ppClear)); return; }
    const ppEditBtn = e.target.closest('[data-pp-edit]');
    if (ppEditBtn){
      const parts = ppEditBtn.dataset.ppEdit.split('|');
      openPredictedPickupModal(Number(parts[0]), parts[1]);
      return;
    }
    const ppDeleteBtn = e.target.closest('[data-pp-delete]');
    if (ppDeleteBtn){
      const parts = ppDeleteBtn.dataset.ppDelete.split('|');
      deletePredictedPickup(Number(parts[0]), parts[1]);
      return;
    }

    const cycleApply = e.target.closest('[data-pred-cycle-apply]');
    if (cycleApply){
      const bar = cycleApply.closest('.pred-daily-range-bar');
      if (bar){
        const sEl = bar.querySelector('[data-pred-cycle="start"]');
        const eEl = bar.querySelector('[data-pred-cycle="end"]');
        if (sEl && eEl) setPredDailyCycle(sEl.value, eEl.value);
      }
      return;
    }

    const gotoBtn = e.target.closest('[data-goto-predpickup]');
    if (gotoBtn){
      const shedId = Number(gotoBtn.dataset.gotoPredpickup);
      if (!Number.isFinite(shedId)) return;
      const group = Math.floor((shedId - 1) / 2) + 1;
      const isFirstOfGroup = (shedId % 2 === 1);
      activeTab = 'predictions';
      predState.predGroup = group;
      predState.predView = isFirstOfGroup ? 'shed1' : 'shed2';
      savePredState();
      render();
      const card = document.getElementById(`pred-shed-card-${shedId}`);
      if (card) card.scrollIntoView({ behavior: 'auto', block: 'start' });
      openManualPickupModal(shedId);
      return;
    }

    const sampleAddBtn = e.target.closest('[data-sample-add]');
    if (sampleAddBtn){ openSampleModal(Number(sampleAddBtn.dataset.sampleAdd)); return; }
    const sampleEditBtn = e.target.closest('[data-sample-edit]');
    if (sampleEditBtn){
      const parts = sampleEditBtn.dataset.sampleEdit.split('|');
      openSampleModal(Number(parts[0]), Number(parts[1]));
      return;
    }
    const sampleDelBtn = e.target.closest('[data-sample-delete]');
    if (sampleDelBtn){
      const parts = sampleDelBtn.dataset.sampleDelete.split('|');
      deleteSample(Number(parts[0]), Number(parts[1]));
      return;
    }

    const addPickupBtn = e.target.closest('[data-pickup-add]');
    if (addPickupBtn){ openManualPickupModal(Number(addPickupBtn.dataset.pickupAdd)); return; }
    const actionsBtn = e.target.closest('[data-pickup-actions-btn]');
    if (actionsBtn){
      e.stopPropagation();
      const wrap = actionsBtn.closest('.pickup-actions');
      const wasOpen = wrap.classList.contains('open');
      closeAllPickupActionsMenus();
      if (!wasOpen) openPickupActionsMenu(wrap);
      return;
    }
    const editBtn = e.target.closest('[data-pickup-edit]');
    if (editBtn){
      closeAllPickupActionsMenus();
      const parts = editBtn.dataset.pickupEdit.split('|');
      openManualPickupModal(Number(parts[0]), parts[1]);
      return;
    }
    const revertBtn = e.target.closest('[data-pickup-revert]');
    if (revertBtn){
      closeAllPickupActionsMenus();
      const parts = revertBtn.dataset.pickupRevert.split('|');
      revertPickupTotalWeight(Number(parts[0]), parts[1]);
      return;
    }
    const deleteBtn = e.target.closest('[data-pickup-delete]');
    if (deleteBtn){
      closeAllPickupActionsMenus();
      const parts = deleteBtn.dataset.pickupDelete.split('|');
      deleteManualPickup(Number(parts[0]), parts[1]);
      return;
    }
    closeAllPickupActionsMenus();

    const pg = e.target.closest('[data-predgroup]');
    if (pg){ setPredGroup(Number(pg.dataset.predgroup)); return; }
    const pv = e.target.closest('[data-predview]');
    if (pv){ setPredView(pv.dataset.predview); return; }

    const toggleDel = e.target.closest('[data-toggle-deliveries]');
    if (toggleDel){
      predState.deliveriesOpen = !(predState.deliveriesOpen !== false);
      savePredState(); schedulePush(); render();
      return;
    }

    const ringBtn = e.target.closest('.ring-btn, .ring-off');
    if (ringBtn){
      const g = Number(ringBtn.dataset.siloGroup);
      const n = Number(ringBtn.dataset.siloNum);
      const raw = ringBtn.dataset.siloRing;
      if (Number.isFinite(g) && Number.isFinite(n)){
        if (raw === 'off') setSiloRingsForToday(g, n, null);
        else {
          const r = Number(raw);
          const latest = latestReading(g);
          const current = latest ? latest[`silo${n}Rings`] : null;
          if (current === r) setSiloRingsForToday(g, n, null);
          else setSiloRingsForToday(g, n, r);
        }
      }
      return;
    }

    const stab = e.target.closest('.stab[data-shedview]');
    if (stab){
      const g = Number(stab.dataset.group);
      const view = stab.dataset.shedview;
      if (g && view) setShedView(g, view);
      return;
    }

    const pill = e.target.closest('.fpill');
    if (pill){
      const shedVal = pill.dataset.days;
      const siloVal = pill.dataset.silodays;
      const predVal = pill.dataset.preddays;
      if (shedVal){
        const [s, e] = shedVal.split(',').map(Number);
        if (Number.isFinite(s) && Number.isFinite(e)){ shedRange = { start:s, end:e }; schedulePush(); render(); }
      } else if (siloVal){
        const [s, e] = siloVal.split(',').map(Number);
        if (Number.isFinite(s) && Number.isFinite(e)){ siloRange = { start:s, end:e }; schedulePush(); render(); }
      } else if (predVal){
        const [s, e] = predVal.split(',').map(Number);
        if (Number.isFinite(s) && Number.isFinite(e)){ setPredDailyPreset(s, e); }
      }
      return;
    }

    const addBtn = e.target.closest('[data-adddelivery]');
    if (addBtn){
      const g = Number(addBtn.dataset.adddelivery);
      const dateEl = document.getElementById(`newdel_date_${g}`);
      const amtEl  = document.getElementById(`newdel_amount_${g}`);
      const typEl  = document.getElementById(`newdel_type_${g}`);
      const noteEl = document.getElementById(`newdel_note_${g}`);
      addSiloDelivery(g, dateEl.value, amtEl.value, typEl.value, noteEl.value);
      return;
    }
    const rmBtn = e.target.closest('[data-removedelivery]');
    if (rmBtn){
      const g = Number(rmBtn.dataset.removedelivery);
      const id = rmBtn.dataset.deliveryId;
      if (confirm('Remove this delivery?')) removeSiloDelivery(g, id);
      return;
    }
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn){
      const t = tabBtn.dataset.tab;
      if (t){ activeTab = t; inlineDeliveryState = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      if (settingsDrawerOpen){
        closeSettingsDrawer();
        return;
      }
    }
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('inline-del-input')){
      e.preventDefault();
      const form = e.target.closest('.inline-del');
      if (form){
        const testBtn = form.querySelector('[data-inline-test]');
        if (testBtn) testBtn.click();
      }
    }
    if (e.key === 'Escape' && e.target.classList && e.target.classList.contains('inline-del-input')){
      inlineDeliveryState = null;
      render();
    }
  });

  document.getElementById('excelFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
  });
  document.getElementById('batchNumber').addEventListener('change', (e) => { setBatchNumber(e.target.value); });
  document.getElementById('batchNumber').addEventListener('blur', (e) => {
    const want = predState.batchNumber || (farmData ? farmData.batchNumber : '') || '';
    e.target.value = want;
  });
  document.getElementById('syncScrim').addEventListener('click', () => {
    closeSyncModal();
    closeFarmFoundModal();
    closeNewBatchModal();
    closeBatchHistoryModal();
    closeFarmBatchPickerModal();
    closeManualPickupModal();
    closeSampleModal();
    closePredictedPickupModal();
    closeDeliveryModal();
    closeImportConflictModal();
    closeImportReviewModal();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;

    if (t.dataset && t.dataset.predCycle){
      const bar = t.closest('.pred-daily-range-bar');
      if (bar){
        const sEl = bar.querySelector('[data-pred-cycle="start"]');
        const eEl = bar.querySelector('[data-pred-cycle="end"]');
        if (sEl && eEl) setPredDailyCycle(sEl.value, eEl.value);
      }
      return;
    }

    if (t.dataset && t.dataset.mortrateShed !== undefined){
      const sid = Number(t.dataset.mortrateShed);
      const val = Number(t.value);
      if (Number.isFinite(sid) && sid >= 1 && sid <= SHED_COUNT && Number.isFinite(val)){
        setShedMortRate(sid, val);
      }
      return;
    }

    if (t.dataset && t.dataset.shedTargetPickups){
      setShedTargetPickups(Number(t.dataset.shedTargetPickups), t.value);
      return;
    }
    if (t.dataset && t.dataset.densityUseGlobal){
      setShedDensityOverride(Number(t.dataset.densityUseGlobal), 'useGlobal', t.checked);
      return;
    }
    if (t.dataset && t.dataset.densityOverride){
      const parts = t.dataset.densityOverride.split('|');
      setShedDensityOverride(Number(parts[0]), parts[1], t.value);
      return;
    }
    if (t.id === 'densityTrigger'){ setDensityGlobal('triggerDensity', t.value); return; }
    if (t.id === 'densityTarget'){ setDensityGlobal('targetDensity', t.value); return; }
    if (t.id === 'densityMax'){ setDensityGlobal('maxDensity', t.value); return; }
    if (t.id === 'targetPickupsGlobal'){ setDensityGlobal('targetPickups', t.value); return; }

    if (t.dataset && t.dataset.targetShed !== undefined && t.dataset.targetDay !== undefined){
      setTargetCurveValue(Number(t.dataset.targetShed), Number(t.dataset.targetDay), t.value);
      return;
    }
    if (t.dataset && t.dataset.pickupShed !== undefined && t.dataset.pickupDate){
      setPickupTotalWeight(Number(t.dataset.pickupShed), t.dataset.pickupDate, t.value);
      return;
    }
    if (t.id && t.id.startsWith('predTargetWeight_')){
      const g = Number(t.id.replace('predTargetWeight_', ''));
      setTargetHarvestWeight(g, t.value);
      return;
    }

    if (t.id === 'predBetaSlider'){
      setPredBeta(t.value);
      scheduleRender(60);
      return;
    }
    if (t.id === 'predBetaNumber'){
      setPredBeta(t.value);
      scheduleRender(60);
      return;
    }

    if (t.id === 'biasSlider' || t.id === 'biasNumber'){
      scheduleRender(60);
      return;
    }

    if (t.dataset && t.dataset.customrangeCtx && t.dataset.customrangeBound){
      const ctx = t.dataset.customrangeCtx;
      const bound = t.dataset.customrangeBound;
      const val = Number(t.value);
      if (!Number.isFinite(val)) return;
      const clamped = Math.max(-90, Math.min(90, Math.floor(val)));
      const range = ctx === 'shed' ? { ...shedRange } : { ...siloRange };
      range[bound] = clamped;
      if (range.start > range.end) return;
      if (ctx === 'shed') shedRange = range;
      else siloRange = range;
      schedulePush(); render();
      return;
    }
    if (t.dataset && t.dataset.deliveryGroup !== undefined && t.dataset.deliveryId){
      const g = Number(t.dataset.deliveryGroup);
      const id = t.dataset.deliveryId;
      const field = t.dataset.field;
      if (field === 'date')     updateSiloDeliveryDate(g, id, t.value);
      if (field === 'amount')   updateSiloDeliveryAmount(g, id, t.value);
      if (field === 'feedType') updateSiloDeliveryFeedType(g, id, t.value);
      if (field === 'note')     updateSiloDeliveryNote(g, id, t.value);
      return;
    }
    if (t instanceof HTMLInputElement && t.dataset && t.dataset.shed !== undefined && t.dataset.field){
      updateShedField(Number(t.dataset.shed), t.dataset.field, t.value);
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;

    if (t.dataset && t.dataset.mortrateShed !== undefined){
      const sid = t.dataset.mortrateShed;
      const slider = document.getElementById(`mortRateSlider_${sid}`);
      const num = document.getElementById(`mortRateNum_${sid}`);
      if (t === slider && num) num.value = t.value;
      else if (t === num && slider) slider.value = t.value;
      return;
    }

    if (t.id === 'predBetaSlider'){
      const num = document.getElementById('predBetaNumber');
      if (num) num.value = Number(t.value).toFixed(3);
      setPredBeta(t.value);
      const chip = document.getElementById('adjChipBeta');
      if (chip) chip.innerHTML = `cFCR β <strong>${Number(t.value).toFixed(3)}</strong>`;
      return;
    }
    if (t.id === 'predBetaNumber'){
      const slider = document.getElementById('predBetaSlider');
      if (slider) slider.value = t.value;
      setPredBeta(t.value);
      const chip = document.getElementById('adjChipBeta');
      if (chip) chip.innerHTML = `cFCR β <strong>${Number(t.value).toFixed(3)}</strong>`;
      return;
    }

    if (t.id === 'farmFeedOverride'){
      setFarmFeedOverride(t.value);
      t.classList.toggle('manual', predState.farmFeedOverride != null);
      updateFarmKpiValues();
      return;
    }

    if (t.id === 'farmLeftoverInput'){
      setFarmLeftover(t.value);
      t.classList.toggle('manual', predState.farmLeftoverKg != null && predState.farmLeftoverKg > 0);
      updateFarmKpiValues();
      return;
    }

    if (t.id === 'biasSlider'){
      const num = document.getElementById('biasNumber');
      if (num) num.value = t.value;
      const v = Number(t.value);
      if (Number.isFinite(v)) setBiasFactor(v / 100);
      const chip = document.getElementById('adjChipScale');
      if (chip) chip.innerHTML = `Scale <strong>${t.value}%</strong>`;
      return;
    }
    if (t.id === 'biasNumber'){
      const slider = document.getElementById('biasSlider');
      if (slider) slider.value = t.value;
      const v = Number(t.value);
      if (Number.isFinite(v)) setBiasFactor(v / 100);
      const chip = document.getElementById('adjChipScale');
      if (chip) chip.innerHTML = `Scale <strong>${t.value}%</strong>`;
      return;
    }
    if (t.id === 'densityTrigger' || t.id === 'densityTarget'){
      const chip = document.getElementById('adjChipDensity');
      if (chip){
        const dg = predState.densityGlobal || { ...DEFAULT_DENSITY_GLOBAL };
        const trig = t.id === 'densityTrigger' ? t.value : dg.triggerDensity;
        const targ = t.id === 'densityTarget' ? t.value : dg.targetDensity;
        chip.innerHTML = `Density <strong>${trig}/${targ}</strong>`;
      }
      return;
    }
    if (t.id === 'targetPickupsGlobal'){
      const chip = document.getElementById('adjChipPickups');
      if (chip) chip.innerHTML = `Pickups <strong>${t.value}</strong>`;
      return;
    }

    if (t.dataset && t.dataset.shed !== undefined && t.dataset.field === 'mortality'){
      liveUpdateShedMortality(Number(t.dataset.shed), t.value);
      return;
    }
  });

  document.addEventListener('scroll', () => {
    closeAllPickupActionsMenus();
  }, { capture: true, passive: true });
  window.addEventListener('resize', () => {
    closeAllPickupActionsMenus();
    updateStickyHeaderHeight();
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden'){ flushPendingPush(); }
    else if (document.visibilityState === 'visible'){
      if (syncFarmName && syncConnectedAt){
        if (syncLastSyncAt){
          if (pushPending){ await runScheduledPush(); }
          pullFromCloud(true).catch(() => {});
        } else {
          await pushToCloud().catch(() => {});
        }
      }
    }
  });
  window.addEventListener('pagehide', flushPendingPush);
  window.addEventListener('beforeunload', flushPendingPush);
});
</script>

</body>
</html>
