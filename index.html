function renderFeedPlanner(group, sheds, today){
  const forecast = computeSiloForecast(group, siloRange);
  const latest = latestReading(group);
  const latestDate = latest ? dateOnly(latest.date) : null;
  const daysSinceReading = latestDate ? Math.max(0, daysBetween(latestDate, today)) : null;
  const projected = currentBalanceKg(group);
  const consumedSince = consumptionSinceLatestReading(group);
  const deliveredSince = deliveriesSinceLatestReading(group);
  const hasReading = !!latest;
  const depletedWithinWindow = !!forecast.depletedDate;
  const daysUntilDepletion = forecast.depletedDate ? Math.max(0, daysBetween(today, forecast.depletedDate)) : null;
  let statusTone = 'green';
  let statusText = 'Sufficient';
  let statusSub = `Feed lasts past ${siloRange.end} days`;
  if (!hasReading){ statusTone = 'amber'; statusText = 'No reading'; statusSub = 'Tap ring levels below'; }
  else if (depletedWithinWindow){
    if (daysUntilDepletion <= 2){ statusTone = 'red'; statusText = 'Critical'; statusSub = 'Order now!'; }
    else if (daysUntilDepletion <= 7){ statusTone = 'amber'; statusText = 'Low'; statusSub = 'Order soon'; }
    else { statusTone = 'green'; statusText = 'Planning needed'; statusSub = `Runs out in ${daysUntilDepletion} days`; }
  }
  const readingAgeBadge = hasReading
    ? (daysSinceReading === 0 ? 'Updated today' : `${daysSinceReading} day${daysSinceReading === 1 ? '' : 's'} ago`)
    : 'No reading yet';
  const deliveriesOpen = predState.deliveriesOpen !== false;

  return `
    <div class="planner-wrap">
      <div class="planner-summary">
        <div class="summary-card">
          <div class="sc-label">Projected Stock Today</div>
          <div class="sc-value amber">${hasReading ? fmtFeed(projected) : '—'}</div>
          <div class="sc-sub">${hasReading ? `${Math.round(projected).toLocaleString()} kg at end of today` : 'Tap ring levels below to record stock'}</div>
        </div>
        <div class="summary-card">
          <div class="sc-label">${depletedWithinWindow ? 'Depletes On' : 'Feed Lasts'}</div>
          <div class="sc-value ${statusTone}">${depletedWithinWindow ? fmtShort(forecast.depletedDate) : (hasReading ? `> ${siloRange.end} days` : '—')}</div>
          <div class="sc-sub">${depletedWithinWindow ? `${daysUntilDepletion} day${daysUntilDepletion === 1 ? '' : 's'} from now` : (hasReading ? `Balance at end: ${fmtFeed(forecast.endBalance)}` : '')}</div>
        </div>
        <div class="summary-card">
          <div class="sc-label">Status</div>
          <div class="sc-value ${statusTone}">${statusText}</div>
          <div class="sc-sub">${statusSub}</div>
        </div>
        <div class="summary-card">

function renderSiloForecastTable(forecast){
  if (forecast.rows.length === 0) return `<div class="forecast-empty">No forecast available.</div>`;
  const hasReading = forecast.rows.some(r => r.balance !== null);
  const rows = forecast.rows.map(r => {
    const rowClasses = [
      r.isWeekend ? 'is-weekend' : '',
      r.isPast ? 'is-past' : '',
      r.isToday ? 'is-today' : '',
      r.delivery > 0 ? 'pickup-day' : ''
    ].filter(Boolean).join(' ');
    let deliveryCell = '—';
    if (r.delivery > 0){
      const types = Array.from(new Set(r.deliveries.map(d => d.feedType).filter(Boolean)));
      const typeTags = types.map(t => feedTypeTagHtml(t)).join('');
      deliveryCell = `<span class="delivery-pill">+${(r.delivery / 1000).toFixed(1)} t</span> ${typeTags}`;
    }
    let balCell = '—';
    let balCls = '';
    let statusCell = '';
    if (r.balance !== null){
      const bal = r.balance;
      balCls = bal > 0 ? 'balance-pos' : 'balance-neg';
      balCell = Math.round(bal).toLocaleString() + ' kg';
      if (r.isPast) statusCell = '<span class="tag muted">Actual</span>';
      else if (bal <= 0 && r.consumption > 0) statusCell = '<span class="tag red">Empty</span>';
      else if (bal < 5000) statusCell = '<span class="tag amber">Low</span>';
    }
    const todayTag = r.isToday ? ' · <span style="color:var(--secondary);font-weight:700;">Today</span>' : '';
    const weekendTag = r.isWeekend ? ' <span class="weekend-pill">Weekend</span>' : '';
    return `
      <tr class="${rowClasses}">
        <td>${fmtShort(r.date)}${todayTag}${weekendTag}</td>
        <td class="num">${Math.round(r.consumption).toLocaleString()} kg</td>
        <td>${deliveryCell}</td>
        <td class="num ${balCls}">${balCell}</td>
        <td>${statusCell}</td>
      </tr>`;
  }).join('');
  return `
    <div class="forecast-table-wrap">
      <table class="forecast-table" style="min-width:640px;">
        <thead><tr><th>Date</th><th class="num">Daily Feed</th><th>Delivery</th>
          <th class="num">Balance (end of day)</th><th>Status</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td>Totals</td>
            <td class="num">${fmtFeed(forecast.totalConsumption)}</td>
            <td>${forecast.totalDelivered > 0 ? '+' + fmtFeed(forecast.totalDelivered) : '—'}</td>
            <td class="num ${(forecast.endBalance || 0) > 0 ? 'balance-pos' : 'balance-neg'}">${forecast.endBalance !== null ? fmtFeed(forecast.endBalance) : '—'}</td>
            <td>${hasReading ? (forecast.shortfall > 0 ? '<span class="tag red">Shortfall</span>' : '<span class="tag green">OK</span>') : '<span class="tag muted">—</span>'}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
}

/* ---------- Target curve panel ---------- */
function renderTargetCurvePanel(shed){
  const tc = shed.targetCurve || {};
  const hasTargets = hasTargetCurve(shed);
  const last = lastWeightedPickup(shed);
  const hasPickups = !!last;

  const inputs = TARGET_DAYS.map(day => {
    const v = tc[day];
    const filled = v != null && Number.isFinite(Number(v)) && Number(v) > 0;
    const ref = rossWeightKg(day).toFixed(3);
    let warn = false;
    if (filled){
      const num = Number(v);
      if (num < ROSS_308_WEIGHTS_KG[0] || num > 6) warn = true;
      const prevDay = TARGET_DAYS[TARGET_DAYS.indexOf(day) - 1];
      if (prevDay != null){
        const prevV = tc[prevDay];
        if (prevV != null && Number.isFinite(Number(prevV)) && Number(prevV) > 0 && num <= Number(prevV)) warn = true;
      }
    }
    const cls = warn ? 'warn' : (filled ? 'filled' : '');
    return `
      <div class="ptc-input">
        <label>Day ${day}</label>
        <div class="ptc-field">
          <input type="number" step="0.001" min="0" placeholder="${ref}"
            value="${filled ? Number(v).toFixed(3) : ''}"
            class="${cls}"
            data-target-shed="${shed.id}" data-target-day="${day}"
            title="Ross 308 reference: ${ref} kg" />
          <span class="unit">kg</span>
        </div>
        <span class="ref">Ross ref: ${ref} kg</span>
      </div>`;
  }).join('');

  let sourcePill, sourceText;
  if (hasPickups){
    sourcePill = '<span class="pill pickup">Pickup data</span>';
    const gain = observedDailyGain(shed);
    sourceText = gain != null
      ? `AI forecast uses official pickup weights · observed gain <strong>${(gain * 1000).toFixed(1)} g/day</strong>`
      : `AI forecast uses official pickup weights`;
  } else if (hasTargets){
    sourcePill = '<span class="pill target">Target curve</span>';
    sourceText = 'AI forecast uses the target curve you entered below';
  } else {
    sourcePill = '<span class="pill standard">Ross 308</span>';
    sourceText = 'Using Ross 308 reference curve — enter targets or pickup data to improve';
  }

  let compareHtml = '';
  if (hasPickups && hasTargets){
    const rows = TARGET_DAYS.map(day => {
      const target = tc[day];
      if (target == null || !Number.isFinite(Number(target)) || Number(target) <= 0) return '';
      const t = Number(target);
      const refDate = addDays(shed.placementDate, day);
      const now = dateOnly(new Date());
      if (now < dateOnly(refDate)){
        return `
          <div class="ptc-compare-row">
            <span class="ptc-day">Day ${day}</span>
            <span class="ptc-vals">Target ${t.toFixed(3)} kg · <span class="ptc-pending">not reached yet</span></span>
          </div>`;
      }
      const actual = actualWeightOn(shed, refDate);
      if (actual == null){
        return `
          <div class="ptc-compare-row">
            <span class="ptc-day">Day ${day}</span>
            <span class="ptc-vals">Target ${t.toFixed(3)} kg · <span class="ptc-pending">no data</span></span>
          </div>`;
      }
      const delta = actual - t;
      const deltaCls = delta > 0.005 ? 'pos' : (delta < -0.005 ? 'neg' : 'neu');
      const deltaStr = delta >= 0
        ? `▲ +${Math.round(delta * 1000)} g`
        : `▼ −${Math.abs(Math.round(delta * 1000))} g`;
      return `
        <div class="ptc-compare-row">
          <span class="ptc-day">Day ${day}</span>
          <span class="ptc-vals">
            Target ${t.toFixed(3)} · Actual ${actual.toFixed(3)} ·
            <span class="ptc-delta ${deltaCls}">${deltaStr}</span>
          </span>
        </div>`;
    }).filter(Boolean).join('');
    if (rows){
      compareHtml = `
        <div class="ptc-compare">
          <div class="ptc-compare-title">Target vs Actual comparison</div>
          ${rows}
        </div>`;
    }
  }

  return `
    <div class="pred-target-curve">
      <div class="ptc-head">
        <span class="ptc-title">🎯 Target Growth Curve</span>
        <span class="ptc-sub">Optional — AI projects forward from these weights until official pickup data arrives</span>
      </div>
      <div class="ptc-inputs">${inputs}</div>
      <div class="ptc-status">
        Using: ${sourcePill} · ${sourceText}
      </div>
      ${compareHtml}
    </div>`;
}

      <span class="pdrb-hint">Days from placement · milestone days (D7, D14, D21 …) are highlighted</span>
    </div>`;
}

/* ---------- Daily performance ---------- */
function renderDailyPerformance(shed){
  if (!shed.placementDate){
    return `
      <div class="pickups-block" style="margin-top:14px;">
        <h4>📅 Daily Performance — Actual + AI Forecast</h4>
        <div class="forecast-empty">No placement date set — forecast unavailable.</div>
      </div>`;
  }

  const today    = dateOnly(new Date());
  const last     = lastWeightedPickup(shed);
  const lastDate = last ? dateOnly(last.date) : null;

  const startDay = Math.max(0, Math.floor(predState.dailyRange.start));
  const endDay   = Math.max(startDay, Math.floor(predState.dailyRange.end));

  const rows = [];
  for (let day = startDay; day <= endDay; day++){
    const d        = addDays(shed.placementDate, day);
    const age      = day;
    const live     = liveAtStartOfDay(shed, d);
    const pickupsToday = (shed.pickups || []).filter(p => iso(p.date) === iso(d));
    const pickupsBirds = pickupsToday.reduce((s,p) => s + p.birds, 0);
    const isToday  = iso(d) === iso(today);
    const isPast   = d < today;
    const wknd     = isWeekend(d);
    const standard = age > 0 ? rossWeightKg(age) : 0;
    const isMilestone = isMilestoneDay(age);

    let weight = null;
    let weightType = null;
    if (age > 0){
      if (lastDate && d <= lastDate){
        weight = actualWeightOn(shed, d);
        if (weight != null) weightType = 'actual';
      } else {
        const f = forecastWeightModeAware(shed, d);
        if (f.kg != null) weight = f.kg;
        if      (f.mode === 'ai-pickup') weightType = 'ai-pickup';
        else if (f.mode === 'ai-target') weightType = 'ai-target';
        else if (f.mode === 'standard')  weightType = 'standard';
      }
    }

    let daysVar = null;
    if (weight != null && age > 0){
      daysVar = daysVsTarget(age, weight);
    }

    rows.push({
      date: d, day, age, live, pickupsBirds,
      standard, weight, weightType, daysVar,
      isToday, isPast, isWeekend: wknd, isMilestone
    });
  }

  let gainNote = '';
  if (last){
    const gain = observedDailyGain(shed);
    const n = weightedPickups(shed).length;
    gainNote = gain != null
      ? `AI forecast uses <strong>observed gain ${(gain * 1000).toFixed(1)} g/day</strong> from ${n} pickup${n === 1 ? '' : 's'}`
      : `AI forecast uses pickup weights`;
  } else if (hasTargetCurve(shed)){
    gainNote = `AI forecast interpolates between your <strong>target curve entries</strong>`;
  } else {
    gainNote = `No pickup or target data yet — using the <strong>Ross 308 reference curve</strong>`;
  }

  return `
    <div class="pickups-block" style="margin-top:14px;">
      <h4>📅 Daily Performance — Actual + AI Forecast
        <span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;">
          · Day ${startDay}–${endDay} of cycle · Standard = Ross 308 reference curve · ⭐ = milestone day
        </span>
      </h4>
      <div class="forecast-table-wrap">
        <table class="pred-daily-table" style="min-width:760px;">
          <thead>
            <tr>
              <th>Date</th>
              <th class="num">Age</th>
              <th class="num">Live birds</th>
              <th class="num">Weight (kg)</th>
              <th class="num">Ross standard (kg)</th>
              <th class="num">Days vs Ross</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const cls = [
                r.isToday ? 'is-today' : '',
                r.isWeekend ? 'is-weekend' : '',
                (r.weightType === 'ai-pickup' || r.weightType === 'ai-target') ? 'is-forecast-row' : ''
              ].filter(Boolean).join(' ');
              const todayTag = r.isToday ? ' · <span style="color:var(--secondary);font-weight:700;">Today</span>' : '';
              const wkndTag  = r.isWeekend ? ' <span class="weekend-pill">Weekend</span>' : '';
              const pickupNote = r.pickupsBirds > 0
                ? ` <span style="font-size:10px;color:var(--primary-dark);font-weight:700;">−${r.pickupsBirds.toLocaleString()}</span>`
                : '';
              const milestoneBadge = r.isMilestone ? `<span class="milestone-pill" title="Weight-curve milestone">★ D${r.age}</span>` : '';

              let weightCell = '—';
              if (r.weight != null){
                if      (r.weightType === 'actual')    weightCell = `<span class="w-actual">${r.weight.toFixed(3)}</span><span class="w-pill actual">Actual</span>`;
                else if (r.weightType === 'ai-pickup') weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill forecast">AI · pickup</span>`;
                else if (r.weightType === 'ai-target') weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill ai-target">AI · target</span>`;
                else if (r.weightType === 'standard')  weightCell = `<span class="w-forecast">${r.weight.toFixed(3)}</span><span class="w-pill standard">Ross</span>`;
              }

              let daysCell = '—';
              let daysCls  = '';
              if (r.daysVar != null){
                if (Math.abs(r.daysVar) < 0.1){
                  daysCell = 'On target'; daysCls = 'days-neu';
                } else if (r.daysVar > 0){
                  daysCell = `${r.daysVar.toFixed(1)}d ahead`; daysCls = 'days-pos';
                } else {
                  daysCell = `${Math.abs(r.daysVar).toFixed(1)}d behind`; daysCls = 'days-neg';
                }
              }

              const stdCell = r.age > 0 ? r.standard.toFixed(3) : '—';

              return `
                <tr class="${cls}">
                  <td>${fmtShort(r.date)}${todayTag}${wkndTag}</td>
                  <td class="num">${r.age}d${milestoneBadge}</td>
                  <td class="num">${r.live.toLocaleString()}${pickupNote}</td>
                  <td class="num">${weightCell}</td>
                  <td class="num" style="color:var(--muted);">${stdCell}</td>
                  <td class="num ${daysCls}">${daysCell}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;">
        ${gainNote} ·
        <strong>Actual</strong> shown up to the last pickup date ·
        <strong>AI</strong> rows are forward projections ·
        Standard = Ross 308 curve (Aviagen 2022, combined M/F average) ·
        Days vs Ross = Ross-equivalent day − actual age (positive = ahead, negative = behind) ·
        ⭐ milestone = every 7 days (D7, D14, D21, D28, D35, D42, D49, D56)
      </div>
    </div>`;
}

/* ---------- Days vs Ross ---------- */
function renderDaysBehind(shed){
  const today = dateOnly(new Date());
  const currentAge = ageInDays(shed, today);
  if (currentAge <= 0) return '';

  const last = lastWeightedPickup(shed);
  const hasTargets = hasTargetCurve(shed);
  if (!last && !hasTargets) return '';

  const lastDate = last ? dateOnly(last.date) : null;
  let currentWeight;
  let source;
  if (lastDate && today <= lastDate){
    currentWeight = actualWeightOn(shed, today);
    source = 'Actual';
  } else {
    const f = forecastWeightModeAware(shed, today);
    currentWeight = f.kg;
    if (f.mode === 'ai-pickup') source = 'AI forecast (pickup)';
    else if (f.mode === 'ai-target') source = 'AI forecast (target)';
    else if (f.mode === 'standard'){ currentWeight = rossWeightKg(currentAge); source = 'Ross 308'; }
  }
  if (currentWeight == null) return '';

  const daysVar = daysVsTarget(currentAge, currentWeight);
  const rossAge = findRossAgeForWeight(currentWeight);

  let status, cls, icon;
  if (daysVar == null || Math.abs(daysVar) < 0.5){ status = 'On Target';             cls = 'on-track';     icon = '✅'; }
  else if (daysVar > 0)                          { status = 'Ahead of Target';       cls = 'ahead';        icon = '🟢'; }
  else if (daysVar >= -3)                        { status = 'Slightly Behind';       cls = 'behind';       icon = '🟡'; }
  else                                           { status = 'Significantly Behind';  cls = 'behind-major'; icon = '🔴'; }

  let daysText;
  if (daysVar == null || Math.abs(daysVar) < 0.1){
    daysText = 'On target — matches Ross 308';
  } else if (daysVar > 0){
    const n = daysVar;
    daysText = `${n.toFixed(1)} day${Math.abs(n - 1) < 0.05 ? '' : 's'} ahead of Ross 308`;
  } else {
    const n = Math.abs(daysVar);
    daysText = `${n.toFixed(1)} day${Math.abs(n - 1) < 0.05 ? '' : 's'} behind Ross 308`;
  }

  let sourcePill = '<span class="w-pill actual">Actual</span>';
  if (source.startsWith('AI')){
    sourcePill = source.includes('target')
      ? '<span class="w-pill ai-target">AI · target</span>'
      : '<span class="w-pill forecast">AI · pickup</span>';
  } else if (source === 'Ross 308'){
    sourcePill = '<span class="w-pill standard">Ross 308</span>';
  }

  return `
    <div class="pred-days-behind ${cls}">
      <span class="dbi-lbl">📏 vs Ross 308 standard</span>
      <span class="dbi-val">${icon} ${status}</span>
      <span class="dbi-note">
        <strong>${daysText}</strong>
        · ${source} weight <strong>${currentWeight.toFixed(3)} kg</strong> at age <strong>${currentAge}d</strong>
        · Ross reaches that weight at <strong>day ${rossAge.toFixed(1)}</strong>
        ${sourcePill}
      </span>
    </div>`;
}

            return `
              <tr class="${p.isFinal ? 'is-final' : ''}">
                <td>${fmtShort(p.date)}</td>
                <td class="num">${p.age}d</td>
                <td class="num">${p.birds.toLocaleString()}</td>
                <td class="num">
                  <input class="pred-pickup-input ${isManual?'manual':''} ${warn?'warn':''}"

                    value="${totalValue}"
                    placeholder="${p.isEstWeight ? 'Ross est.' : 'total kg'}"
                    data-pickup-shed="${shed.id}" data-pickup-date="${iso(p.date)}"
                    title="${isManual ? 'Manually edited — click ↺ to revert to Excel' : (p.isEstWeight ? 'No Excel weight — using Ross curve estimate' : 'From Excel')}" />

        </div>
      </div>
      <div class="pred-shed-body">
        ${snapshotHtml}
        ${targetPanelHtml}

/* ---------- Event wiring ---------- */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(loadTheme());
  loadSyncState();
  loadPredState();

  const saved = loadState();
  if (saved) farmData = saved;
  initShedViews();
  const savedSilo = loadSiloData();
  if (savedSilo) siloData = savedSilo;
  renderSyncButton();
  render();

  if (syncFarmName && syncConnectedAt){
    if (syncLastSyncAt){
      pullFromCloud(true).catch(() => {});
    } else {
      pushToCloud().catch(() => {});
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#cluckwiseBtn')){ window.open(CLUCKWISE_URL, '_blank', 'noopener'); return; }
    if (e.target.closest('#themeToggle')){ toggleTheme(); return; }
    if (e.target.closest('#syncBtn')){ openSyncModal(); return; }
    if (e.target.closest('#newBatchBtn')){ openNewBatchModal(); return; }
    if (e.target.closest('#batchHistoryBtn')){ openBatchHistoryModal(); return; }
    if (e.target.closest('#newBatchClose')){ closeNewBatchModal(); return; }
    if (e.target.closest('#batchHistoryClose')){ closeBatchHistoryModal(); return; }
    if (e.target.closest('#farmFoundClose')){ closeFarmFoundModal(); return; }
    if (e.target.closest('#importBtn') || e.target.closest('#emptyImportBtn')){ triggerImport(); return; }
    if (e.target.closest('#emptyConnectBtn')){ openSyncModal(); return; }

    const pg = e.target.closest('[data-predgroup]');
    if (pg){ setPredGroup(Number(pg.dataset.predgroup)); return; }
    const pv = e.target.closest('[data-predview]');
    if (pv){ setPredView(pv.dataset.predview); return; }

    const rv = e.target.closest('[data-pickup-revert-shed]');
    if (rv){ revertPickupTotalWeight(Number(rv.dataset.pickupRevertShed), rv.dataset.pickupRevertDate); return; }

    const toggleDel = e.target.closest('[data-toggle-deliveries]');
    if (toggleDel){
      predState.deliveriesOpen = !(predState.deliveriesOpen !== false);
      savePredState(); schedulePush(); render();
      return;
    }

    const ringBtn = e.target.closest('.ring-btn, .ring-off');
    if (ringBtn){
      const g = Number(ringBtn.dataset.siloGroup);
      const n = Number(ringBtn.dataset.siloNum);
      const raw = ringBtn.dataset.siloRing;
      if (Number.isFinite(g) && Number.isFinite(n)){
        if (raw === 'off') setSiloRingsForToday(g, n, null);
        else {
          const r = Number(raw);
          const latest = latestReading(g);
          const current = latest ? latest[`silo${n}Rings`] : null;
          if (current === r) setSiloRingsForToday(g, n, null);
          else setSiloRingsForToday(g, n, r);
        }
      }
      return;
    }

    const stab = e.target.closest('.stab[data-shedview]');
    if (stab){
      const g = Number(stab.dataset.group);
      const view = stab.dataset.shedview;
      if (g && view) setShedView(g, view);
      return;
    }

    const pill = e.target.closest('.fpill');
    if (pill){
      const shedVal = pill.dataset.days;
      const siloVal = pill.dataset.silodays;
      if (shedVal){
        const [s, e] = shedVal.split(',').map(Number);
        if (Number.isFinite(s) && Number.isFinite(e)){ shedRange = { start:s, end:e }; schedulePush(); render(); }
      } else if (siloVal){
        const [s, e] = siloVal.split(',').map(Number);
        if (Number.isFinite(s) && Number.isFinite(e)){ siloRange = { start:s, end:e }; schedulePush(); render(); }
      }
      return;
    }

    const addBtn = e.target.closest('[data-adddelivery]');
    if (addBtn){
      const g = Number(addBtn.dataset.adddelivery);
      const dateEl = document.getElementById(`newdel_date_${g}`);
      const amtEl  = document.getElementById(`newdel_amount_${g}`);
      const typEl  = document.getElementById(`newdel_type_${g}`);
      const noteEl = document.getElementById(`newdel_note_${g}`);
      addSiloDelivery(g, dateEl.value, amtEl.value, typEl.value, noteEl.value);
      return;
    }
    const rmBtn = e.target.closest('[data-removedelivery]');
    if (rmBtn){
      const g = Number(rmBtn.dataset.removedelivery);
      const id = rmBtn.dataset.deliveryId;
      if (confirm('Remove this delivery?')) removeSiloDelivery(g, id);
      return;
    }
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn){
      const t = tabBtn.dataset.tab;
      if (t){ activeTab = t; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      return;
    }
  });

  document.getElementById('excelFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleFile(f);
  });
  document.getElementById('batchNumber').addEventListener('change', (e) => { setBatchNumber(e.target.value); });
  document.getElementById('batchNumber').addEventListener('blur', (e) => {
    const want = predState.batchNumber || (farmData ? farmData.batchNumber : '') || '';
    e.target.value = want;
  });
  document.getElementById('syncScrim').addEventListener('click', () => {
    closeSyncModal();
    closeFarmFoundModal();
    closeNewBatchModal();
    closeBatchHistoryModal();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;

    if (t.dataset && t.dataset.targetShed !== undefined && t.dataset.targetDay !== undefined){
      setTargetCurveValue(Number(t.dataset.targetShed), Number(t.dataset.targetDay), t.value);
      return;
    }
    if (t.dataset && t.dataset.pickupShed !== undefined && t.dataset.pickupDate){
      setPickupTotalWeight(Number(t.dataset.pickupShed), t.dataset.pickupDate, t.value);
      return;
    }
    if (t.id && t.id.startsWith('predTargetWeight_')){
      const g = Number(t.id.replace('predTargetWeight_', ''));
      setTargetHarvestWeight(g, t.value);
      return;
    }
    if (t.id === 'predBetaNumber'){ setPredBeta(t.value); return; }

    if (t.dataset && t.dataset.predDaily){
      const bar = t.closest('.pred-daily-range-bar');
      if (bar){
        const sEl = bar.querySelector('[data-pred-daily="start"]');
        const eEl = bar.querySelector('[data-pred-daily="end"]');
        if (sEl && eEl) setPredDailyRange(sEl.value, eEl.value);
      }
      return;
    }

    if (t.dataset && t.dataset.customrangeCtx && t.dataset.customrangeBound){
      const ctx = t.dataset.customrangeCtx;
      const bound = t.dataset.customrangeBound;
      const val = Number(t.value);
      if (!Number.isFinite(val)) return;
      const clamped = Math.max(-90, Math.min(90, Math.floor(val)));
      const range = ctx === 'shed' ? { ...shedRange } : { ...siloRange };
      range[bound] = clamped;
      if (range.start > range.end) return;
      if (ctx === 'shed') shedRange = range;
      else siloRange = range;
      schedulePush(); render();
      return;
    }
    if (t.dataset && t.dataset.deliveryGroup !== undefined && t.dataset.deliveryId){
      const g = Number(t.dataset.deliveryGroup);
      const id = t.dataset.deliveryId;
      const field = t.dataset.field;
      if (field === 'date')     updateSiloDeliveryDate(g, id, t.value);
      if (field === 'amount')   updateSiloDeliveryAmount(g, id, t.value);
      if (field === 'feedType') updateSiloDeliveryFeedType(g, id, t.value);
      if (field === 'note')     updateSiloDeliveryNote(g, id, t.value);
      return;
    }
    if (t instanceof HTMLInputElement && t.dataset && t.dataset.shed !== undefined && t.dataset.field){
      updateShedField(Number(t.dataset.shed), t.dataset.field, t.value);
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'predBetaSlider'){ setPredBeta(t.value); return; }
    if (t.id === 'farmFeedOverride'){
      setFarmFeedOverride(t.value);
      t.classList.toggle('manual', predState.farmFeedOverride != null);
      updateFarmKpiValues();
      return;
    }
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'hidden'){ flushPendingPush(); }
    else if (document.visibilityState === 'visible'){
      if (syncFarmName && syncConnectedAt){
        if (syncLastSyncAt){
          if (pushPending){ await runScheduledPush(); }
          pullFromCloud(true).catch(() => {});
        } else {
          await pushToCloud().catch(() => {});
        }
      }
    }
  });
  window.addEventListener('pagehide', flushPendingPush);
  window.addEventListener('beforeunload', flushPendingPush);
});
</script>

</body>
</html>
