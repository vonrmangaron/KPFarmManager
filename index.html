<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --surface-soft:#F6F1E8; --line:#E8DFD1;
  --ink:#2B2116; --muted:#8C7B68;
  --primary:#E0A339; --primary-dark:#A8721F; --primary-soft:#F6E4C1;
  --secondary:#B08463; --secondary-soft:#F0E4D6;
  --danger:#C1502E; --danger-soft:#F5DDD2;
  --success:#4C7A3B; --success-soft:#E4EFDD;
  --past-row: rgba(140,123,104,0.06);
  --pickup-row: #FCF6E6;
  --pickup-final-row: #F8ECD0;
  --weekend-tint: rgba(249,115,22,0.22);
  --weekend-border: #EA580C;
  --sticky-header-h: 130px;
  --shadow-sm:0 1px 2px rgba(43,33,22,0.06);
  --shadow-md:0 8px 22px rgba(43,33,22,0.09);
  --shadow-lg:0 16px 40px rgba(43,33,22,0.16);
}
body.theme-dark{
  --bg:#1A2438; --surface:#28324D; --surface-soft:#212A42; --line:#3C4869;
  --ink:#EAEEF7; --muted:#9AA6BE;
  --primary:#F0A840; --primary-dark:#FFC876; --primary-soft:#3D3320;
  --secondary:#6FA8E8; --secondary-soft:#20304E;
  --danger:#F0685A; --danger-soft:#3A2321;
  --success:#6FB85C; --success-soft:#24382A;
  --past-row: rgba(154,166,190,0.06);
  --pickup-row: rgba(240,168,64,0.14);
  --pickup-final-row: rgba(240,168,64,0.26);
  --weekend-tint: rgba(240,168,64,0.24);
  --weekend-border: #F97316;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.30);
  --shadow-md:0 8px 22px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;}
h1,h2,h3,h4,.brand,.btn-primary,.tab-btn,.fpill,.stab{font-family:'Sora',sans-serif;}

.shell{min-height:100%;display:flex;flex-direction:column;}
.sticky-header{position:sticky; top:0; z-index:100;}
.sticky-header .topbar{box-shadow:none;}
.sticky-header::after{content:"";display:block;height:1px;background:var(--line);box-shadow:var(--shadow-sm);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);
  flex-wrap:wrap;}
.brand{font-weight:700;font-size:20px;letter-spacing:0.1px;color:var(--ink);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.brand-icon{width:30px;height:30px;border-radius:7px;display:inline-block;
  vertical-align:middle;flex-shrink:0;}
.brand .accent{background:linear-gradient(135deg,var(--primary),var(--secondary));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.theme-btn{border:1px solid var(--line);background:var(--surface-soft);
  color:var(--ink);width:40px;height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;transition:background .15s ease,transform .12s ease;}
.theme-btn:hover{background:var(--primary-soft);color:var(--primary-dark);transform:translateY(-1px);}

.settings-btn{border:1px solid var(--line);background:var(--surface-soft);
  color:var(--ink);width:40px;height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;transition:background .15s ease,transform .12s ease;}
.settings-btn:hover{background:var(--primary-soft);color:var(--primary-dark);transform:translateY(-1px);}

.new-batch-btn{border:1px solid var(--primary);background:var(--primary-soft);
  color:var(--primary-dark);height:40px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;padding:0 16px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  transition:background .15s ease,transform .12s ease,color .15s ease;
  white-space:nowrap;}
.new-batch-btn:hover{background:var(--primary);color:#fff;transform:translateY(-1px);}
body.theme-dark .new-batch-btn{border-color:var(--primary-dark);background:var(--primary-soft);color:var(--primary-dark);}
body.theme-dark .new-batch-btn:hover{background:var(--primary-dark);color:#1A2438;}

/* ============ SETTINGS DRAWER ============ */
.settings-scrim{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.55);
  z-index:9990;
  display:none; opacity:0;
  transition:opacity .22s ease;
}
body.theme-dark .settings-scrim{background:rgba(0,0,0,0.68);}
.settings-scrim.open{display:block; opacity:1;}

.settings-drawer{
  position:fixed;
  top:0; right:0; bottom:0;
  width:460px;
  max-width:calc(100vw - 24px);
  background:var(--surface);
  border-left:1px solid var(--line);
  box-shadow:-8px 0 32px rgba(0,0,0,0.20);
  z-index:9991;
  display:flex; flex-direction:column;
  transform:translateX(100%);
  transition:transform .22s ease;
  overflow:hidden;
}
body.theme-dark .settings-drawer{box-shadow:-8px 0 32px rgba(0,0,0,0.55);}
.settings-drawer.open{transform:translateX(0);}
.settings-drawer-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--line);
  background:var(--surface-soft); flex-shrink:0;
}
.settings-drawer-head h3{
  margin:0; font-family:'Sora',sans-serif; font-weight:800; font-size:16px;
  color:var(--ink); display:flex; align-items:center; gap:8px;
}
.settings-drawer-close{
  border:none; background:transparent; color:var(--muted);
  cursor:pointer; font-size:20px; line-height:1;
  width:32px; height:32px; border-radius:8px;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s ease,color .15s ease;
}
.settings-drawer-close:hover{background:var(--danger-soft); color:var(--danger);}
.settings-drawer-body{
  flex:1; overflow-y:auto; padding:16px 20px 24px;
  display:flex; flex-direction:column; gap:14px;
}

/* ============ SETTINGS CARDS ============ */
.settings-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;box-shadow:var(--shadow-sm);}
.settings-card h3{margin:0 0 12px;font-size:14.5px;font-weight:800;
  display:flex;align-items:center;gap:8px;color:var(--ink);flex-wrap:wrap;}
.settings-card h3 .sub{font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--muted);margin-left:auto;}
.settings-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 12px;}

.settings-btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.settings-action-btn{
  border:1px solid var(--line);
  background:var(--surface-soft);
  color:var(--ink);
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:13.5px;
  padding:14px 18px;
  border-radius:12px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .15s ease, transform .1s ease, border-color .15s ease, color .15s ease;
  min-height:52px;
}
.settings-action-btn:hover{background:var(--primary-soft);color:var(--primary-dark);border-color:var(--primary-soft);transform:translateY(-1px);}
.settings-action-btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent;}
.settings-action-btn.primary:hover{filter:brightness(1.06);color:#fff;transform:translateY(-1px);}
.settings-action-btn:disabled{opacity:0.6;cursor:default;filter:none;transform:none;}
body.theme-dark .settings-action-btn.primary{color:#1A2438;}
body.theme-dark .settings-action-btn.primary:hover{color:#1A2438;}

.sync-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:9999;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);
  width:460px;max-width:calc(100vw - 32px);max-height:88vh;
  display:none;flex-direction:column;overflow:hidden;}
.sync-modal.open{display:flex;}
.sync-modal.wide{width:600px;}
.sync-modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--line);}
.sync-modal-head h3{margin:0;font-size:16px;font-weight:800;
  display:flex;align-items:center;gap:8px;}
.sync-modal-head button{border:none;background:transparent;font-size:20px;
  color:var(--muted);cursor:pointer;line-height:1;}
.sync-modal-head button:hover{color:var(--danger);}
.sync-modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.sync-modal-body label{font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.sync-modal-body input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-soft);color:var(--ink);padding:11px 13px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:15px;}
.sync-modal-body input[type="text"]:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);}
.sync-hint{font-size:11.5px;color:var(--muted);line-height:1.5;}
.sync-hint strong{color:var(--danger);font-weight:700;}
.sync-status-card{background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.sync-status-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
.sync-status-row .lbl{color:var(--muted);font-weight:600;}
.sync-status-row .val{color:var(--ink);font-weight:700;font-family:'Sora',sans-serif;
  text-align:right;word-break:break-word;}
.sync-status-row .val.ok{color:var(--success);}
.sync-status-row .val.err{color:var(--danger);}
.sync-actions{display:flex;flex-direction:column;gap:8px;}
.sync-btn-row{display:flex;gap:8px;}
.sync-btn-row > *{flex:1;}
.btn-sync-primary{border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;
  padding:11px 18px;transition:filter .15s ease;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;}
.btn-sync-primary:hover{filter:brightness(1.06);}
.btn-sync-primary:disabled{opacity:0.5;cursor:default;filter:none;}
.btn-sync-primary.ghost{background:var(--surface-soft);color:var(--ink);border:1px solid var(--line);}
.btn-sync-primary.ghost:hover{background:var(--primary-soft);color:var(--primary-dark);}
.btn-sync-primary.danger{background:linear-gradient(135deg,#C1502E,#8F3B22);}
.btn-sync-primary.success{background:linear-gradient(135deg,var(--success),#36602A);}
body.theme-dark .btn-sync-primary{color:#1A2438;}
body.theme-dark .btn-sync-primary.ghost{color:var(--ink);}
.sync-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:9998;display:none;}
.sync-scrim.open{display:block;}

.new-batch-checkbox-label{display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;font-size:12.5px;color:var(--ink);cursor:pointer;
  text-transform:none;letter-spacing:0;font-weight:500;font-family:'Inter',sans-serif;}
.new-batch-checkbox-label input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary-dark);cursor:pointer;flex-shrink:0;}
.new-batch-checkbox-label:hover{background:var(--primary-soft);border-color:var(--primary-soft);}
.nb-question{font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink);margin:2px 0 -2px;}

.batch-list{display:flex;flex-direction:column;gap:8px;}
.batch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;transition:background .15s ease,border-color .15s ease,transform .1s ease;}
.batch-row:hover{transform:translateY(-1px);border-color:var(--primary-soft);}
.batch-row.current{background:linear-gradient(135deg,rgba(76,122,59,0.10),rgba(76,122,59,0.04));border-color:var(--success);}
.batch-row-info{flex:1;min-width:0;}
.batch-row-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:'Sora',sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
.batch-row.current .batch-row-title{color:var(--success);}
.batch-current-badge{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 7px;
  border-radius:999px;letter-spacing:0.06em;text-transform:uppercase;
  background:var(--success);color:#fff;font-family:'Sora',sans-serif;}
.batch-row-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
.batch-row-actions{display:flex;gap:6px;flex-shrink:0;}
.batch-open-btn{border:none;border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;
  padding:7px 14px;cursor:pointer;transition:filter .12s ease,transform .1s ease;}
.batch-open-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
body.theme-dark .batch-open-btn{color:#1A2438;}
.batch-list-status{text-align:center;padding:24px 20px;color:var(--muted);
  font-size:13px;font-style:italic;}
.batch-list-status.error{color:var(--danger);font-style:normal;}

.farm-found-body{padding:20px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.farm-found-icon{font-size:42px;line-height:1;text-align:center;margin-bottom:2px;}
.farm-found-title{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;
  text-align:center;color:var(--ink);margin-bottom:2px;}
.farm-found-title strong{color:var(--primary-dark);}
.farm-found-sub{font-size:12.5px;color:var(--muted);text-align:center;
  line-height:1.5;margin-bottom:4px;}
.farm-found-meta{background:var(--surface-soft);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;}
.ff-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
.ff-row .lbl{color:var(--muted);font-weight:600;}
.ff-row .val{color:var(--ink);font-weight:700;font-family:'Sora',sans-serif;
  text-align:right;word-break:break-word;max-width:60%;}
.ff-choices{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.ff-choice{border:1px solid var(--line);background:var(--surface-soft);
  border-radius:12px;padding:12px 14px;cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;
  font-family:'Inter',sans-serif;transition:background .15s ease,transform .1s ease,border-color .15s ease;}
.ff-choice:hover{transform:translateY(-1px);}
.ff-choice .ff-icon{font-size:22px;line-height:1;flex-shrink:0;width:28px;text-align:center;}
.ff-choice .ff-choice-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:var(--ink);}
.ff-choice .ff-choice-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.ff-choice.primary{background:linear-gradient(135deg,rgba(76,122,59,0.10),rgba(76,122,59,0.04));border-color:var(--success);}
.ff-choice.primary:hover{background:var(--success-soft);}
.ff-choice.primary .ff-choice-title{color:var(--success);}
.ff-choice.secondary{background:linear-gradient(135deg,rgba(176,132,99,0.10),rgba(176,132,99,0.04));border-color:var(--secondary);}
.ff-choice.secondary:hover{background:var(--secondary-soft);}
.ff-choice.secondary .ff-choice-title{color:var(--secondary);}
.ff-choice.danger{border-color:var(--danger-soft);}
.ff-choice.danger:hover{background:var(--danger-soft);}
.ff-choice.danger .ff-choice-title{color:var(--danger);}
.ff-cancel{border:none;background:transparent;color:var(--muted);
  font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;
  padding:8px;cursor:pointer;text-align:center;width:100%;}
.ff-cancel:hover{color:var(--danger);}

.batch-input{display:flex;align-items:center;gap:8px;background:var(--surface-soft);
  border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 14px;}
.batch-input label{font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.batch-input input{border:none;background:transparent;outline:none;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;
  color:var(--ink);min-width:110px;padding:3px 0;}
.batch-input input::placeholder{color:var(--muted);font-weight:500;}
.batch-input input[readonly]{color:var(--primary-dark);cursor:default;}

.btn-primary{border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:999px;
  box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:8px;
  transition:transform .12s ease,filter .12s ease;font-family:'Sora',sans-serif;}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);}
body.theme-dark .btn-primary{color:#1A2438;}

.btn-cloud{border:1.5px dashed var(--secondary);background:var(--secondary-soft);
  color:var(--secondary);cursor:pointer;font-weight:700;font-size:16px;
  padding:14px 28px;border-radius:14px;font-family:'Sora',sans-serif;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .15s ease,color .15s ease;}
.btn-cloud:hover{background:var(--secondary);color:#fff;}

.barn-stripe{height:4px;background:linear-gradient(90deg,var(--primary),var(--secondary));}

.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line);
  padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs{display:flex;gap:4px;padding:10px 0;min-width:max-content;}
.tab-btn{border:1px solid transparent;background:transparent;color:var(--muted);
  font-weight:700;font-size:14px;padding:9px 18px;border-radius:999px;cursor:pointer;
  transition:background .15s ease,color .15s ease;white-space:nowrap;}
.tab-btn:hover{background:var(--surface-soft);color:var(--ink);}
.tab-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;box-shadow:var(--shadow-sm);}
.tab-btn.tab-predictions{background:linear-gradient(135deg,rgba(76,122,59,0.14),rgba(76,122,59,0.06));
  color:var(--success);border:1px dashed var(--success);}
.tab-btn.tab-predictions:hover{background:var(--success-soft);}
.tab-btn.tab-predictions.active{background:linear-gradient(135deg,var(--success),#36602A);
  color:#fff;border-color:transparent;border-style:solid;}
body.theme-dark .tab-btn.active{color:#1A2438;}
body.theme-dark .tab-btn.tab-predictions.active{color:#1A2438;}
.tab-btn.tab-cluckwise{background:linear-gradient(135deg,rgba(31,122,140,0.14),rgba(31,122,140,0.06));
  color:#1F7A8C;border:1px dashed #7BC9D4;}
.tab-btn.tab-cluckwise:hover{background:#1F7A8C;color:#fff;border-color:#1F7A8C;border-style:solid;}

.adj-collapse-body{padding:0 18px 16px;display:none;
  border-top:1px dashed var(--line);margin-top:0;padding-top:14px;}
.adj-collapse.open .adj-collapse-body{display:block;}
.adj-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;font-size:12.5px;margin-bottom:10px;}
.adj-row:last-child{margin-bottom:0;}
.adj-row > label{font-weight:700;text-transform:uppercase;
  font-size:10.5px;letter-spacing:0.06em;color:var(--muted);min-width:150px;}
.adj-row input[type="range"]{flex:1;min-width:120px;accent-color:var(--primary);}
.adj-row input[type="number"]{width:72px;padding:5px 8px;
  border:1px solid var(--line);border-radius:7px;background:var(--surface);
  color:var(--ink);font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
  text-align:center;-moz-appearance:textfield;appearance:textfield;}
.adj-row input[type="number"]::-webkit-outer-spin-button,
.adj-row input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.adj-row input[type="number"]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.adj-unit{font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0;}
.adj-hint{flex-basis:100%;width:100%;font-size:11px;color:var(--muted);
  font-weight:500;line-height:1.4;margin-top:-2px;}

.pred-grid{display:grid;grid-template-columns:1fr;gap:18px;}
.pred-grid.compare{grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:1000px){.pred-grid.compare{grid-template-columns:1fr;}}

.pred-shed-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:var(--shadow-sm);min-width:0;}
.pred-shed-head{padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--surface-soft);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;}
.pred-shed-head h3{margin:0;font-size:16px;font-weight:800;
  display:flex;align-items:center;gap:8px;color:var(--ink);}
.pred-shed-body{padding:14px 18px 18px;}

.pred-snapshot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.pred-snap-item{background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;}
.pred-snap-item .lbl{font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.pred-snap-item .val{font-family:'Sora',sans-serif;font-weight:800;
  font-size:16px;color:var(--ink);margin-top:2px;}
.pred-snap-item .sub{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.3;}

.pred-target-curve{margin-top:14px;padding:12px 14px;background:var(--surface-soft);
  border:1px solid var(--line);border-radius:12px;}
.ptc-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.ptc-title{font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:var(--ink);}
.ptc-sub{font-size:11px;color:var(--muted);}
.ptc-inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:640px){.ptc-inputs{grid-template-columns:repeat(2,1fr);}}
.ptc-input{background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;}
.ptc-input label{font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.ptc-input .ptc-field{display:flex;align-items:center;gap:8px;min-width:0;}
.ptc-input input{flex:1 1 auto;min-width:0;width:100%;
  border:1px solid var(--line);border-radius:7px;
  background:var(--surface-soft);color:var(--ink);
  padding:6px 10px;font-family:'Sora',sans-serif;font-weight:800;font-size:14px;
  text-align:right;transition:border-color .15s ease,box-shadow .15s ease;
  -moz-appearance:textfield;appearance:textfield;}
.ptc-input input::-webkit-outer-spin-button,
.ptc-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ptc-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.ptc-input input.warn{border-color:var(--danger);background:var(--danger-soft);}
.ptc-input input.filled{border-color:var(--primary);background:var(--primary-soft);}
.ptc-input input::placeholder{color:var(--muted);opacity:0.55;font-weight:600;font-style:italic;
  font-size:12.5px;letter-spacing:0;}
.ptc-input .unit{font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0;}
.ptc-input .ref{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.ptc-status{margin-top:10px;padding:8px 10px;background:var(--surface);
  border:1px dashed var(--line);border-radius:8px;font-size:11.5px;
  color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ptc-status strong{color:var(--ink);}
.ptc-status .pill{display:inline-block;font-size:9.5px;font-weight:800;
  padding:2px 7px;border-radius:999px;letter-spacing:0.05em;text-transform:uppercase;}
.ptc-status .pill.pickup{background:var(--success-soft);color:var(--success);}
.ptc-status .pill.target{background:var(--primary-soft);color:var(--primary-dark);}
.ptc-status .pill.standard{background:var(--surface-soft);color:var(--muted);border:1px solid var(--line);}
.ptc-status .pill.gompertz{background:linear-gradient(135deg,#E0A339,#A8721F);color:#fff;}

.pred-estimates-head{margin-top:14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--muted);}
.pred-estimates-head .sub{font-weight:500;text-transform:none;letter-spacing:0;font-size:11px;color:var(--muted);}
.pred-estimates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
.pred-est-tile{background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;
  display:flex;flex-direction:column;gap:2px;
  transition:box-shadow .12s ease,border-color .12s ease;}
.pred-est-tile:hover{box-shadow:var(--shadow-sm);}
.pred-est-tile .lbl{font-size:10.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;}
.pred-est-tile .val{font-family:'Sora',sans-serif;font-weight:800;
  font-size:19px;color:var(--ink);line-height:1.15;}
.pred-est-tile.amber .val{color:var(--primary-dark);}
.pred-est-tile.green .val{color:var(--success);}
.pred-est-tile.red .val{color:var(--danger);}

.pred-confidence{display:flex;align-items:center;gap:8px;margin-top:14px;
  padding:10px 12px;background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;font-size:12.5px;}
.pred-confidence .bar{flex:1;height:6px;background:var(--line);
  border-radius:999px;overflow:hidden;position:relative;}
.pred-confidence .bar-fill{height:100%;border-radius:999px;transition:width .3s ease;}
.pred-confidence .bar-fill.low{background:#C1502E;}
.pred-confidence .bar-fill.medium{background:#E0A339;}
.pred-confidence .bar-fill.high{background:#4C7A3B;}
.pred-confidence .pct{font-family:'Sora',sans-serif;font-weight:800;font-size:14px;}

.pred-empty{padding:32px 24px;text-align:center;background:var(--surface);
  border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:14px;}
.pred-empty strong{color:var(--ink);}

.pred-pickup-input{width:90px;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface);color:var(--ink);
  font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
  text-align:right;-moz-appearance:textfield;appearance:textfield;}
.pred-pickup-input::-webkit-outer-spin-button,
.pred-pickup-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.pred-pickup-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.pred-pickup-input.manual{border-color:var(--primary);background:var(--primary-soft);}
.pred-pickup-input.warn{border-color:var(--danger);background:var(--danger-soft);}

.pred-avg-cell{font-family:'Sora',sans-serif;font-weight:800;color:var(--primary-dark);
  text-align:right;font-variant-numeric:tabular-nums;}

.pred-daily-range-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin:14px 0;box-shadow:var(--shadow-sm);}
.pred-daily-range-bar > label{font-family:'Sora',sans-serif;font-weight:700;font-size:12px;
  color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-right:4px;}
.pred-daily-range-bar .pdrb-sep{font-size:11px;color:var(--muted);font-weight:600;
  text-transform:none;letter-spacing:0;margin:0 2px;}
.pdrb-cycle-inputs{display:inline-flex;align-items:center;gap:5px;
  background:var(--surface-soft);border:1px solid var(--line);border-radius:9px;padding:3px 8px;}
.pdrb-cycle-inputs span{font-size:11.5px;color:var(--muted);font-weight:700;font-family:'Sora',sans-serif;}
.pdrb-cycle-inputs input[type="number"]{width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);color:var(--ink);
  font-family:'Sora',sans-serif;font-weight:800;font-size:12.5px;text-align:center;
  -moz-appearance:textfield;appearance:textfield;}
.pdrb-cycle-inputs input[type="number"]::-webkit-outer-spin-button,
.pdrb-cycle-inputs input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.pdrb-cycle-inputs input[type="number"]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.pdrb-apply{border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary-dark);
  font-family:'Sora',sans-serif;font-weight:700;font-size:11px;
  padding:5px 11px;border-radius:7px;cursor:pointer;
  transition:background .15s ease,color .15s ease;white-space:nowrap;
  text-transform:uppercase;letter-spacing:0.05em;}
.pdrb-apply:hover{background:var(--primary);color:#fff;}
body.theme-dark .pdrb-apply:hover{color:#1A2438;}
.pdrb-resolved{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;
  text-transform:none;letter-spacing:0;}
@media(max-width:900px){.pdrb-resolved{margin-left:0;}}
@media(max-width:640px){
  .pdrb-cycle-inputs{padding:3px 6px;}
  .pdrb-cycle-inputs input[type="number"]{width:48px;}
}

.pred-daily-table{width:100%;border-collapse:collapse;font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.pred-daily-table th{background:var(--surface-soft);font-family:'Sora',sans-serif;
  font-weight:700;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);}
.pred-daily-table td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--ink);}
.pred-daily-table tr:last-child td{border-bottom:none;}
.pred-daily-table .num{text-align:right;font-variant-numeric:tabular-nums;}
.pred-daily-table tr.is-today td{background:var(--primary-soft);font-weight:700;}
.pred-daily-table tr.is-today td:first-child{border-left:3px solid var(--primary);}
.pred-daily-table tr.is-weekend td{background:var(--weekend-tint);}
.pred-daily-table tr.is-weekend td:first-child{border-left:3px solid var(--weekend-border);
  color:var(--weekend-border);font-weight:800;}
.pred-daily-table tr.is-today.is-weekend td{background:var(--weekend-tint);}
.pred-daily-table tr.is-today.is-weekend td:first-child{border-left:3px solid var(--weekend-border);}
.pred-daily-table tr.is-forecast-row td{background:rgba(176,132,99,0.08);}
.pred-daily-table tr.is-forecast-row.is-weekend td{background:var(--weekend-tint);}
.pred-daily-table tr.predicted-pickup-row td{background:rgba(176,132,99,0.14);}
.pred-daily-table .w-actual{font-weight:800;color:var(--success);}
.pred-daily-table .w-forecast{font-weight:800;color:var(--primary-dark);font-style:italic;}
.pred-daily-table .w-sample{font-weight:800;color:var(--secondary);}
.pred-daily-table .var-pos{color:var(--success);font-weight:700;}
.pred-daily-table .var-neg{color:var(--danger);font-weight:700;}
.pred-daily-table .var-neu{color:var(--muted);font-weight:700;}
.pred-daily-table .days-pos{color:var(--success);font-weight:800;}
.pred-daily-table .days-neg{color:var(--danger);font-weight:800;}
.pred-daily-table .days-neu{color:var(--muted);font-weight:800;}
.pred-daily-table .conf-band{font-size:10px;color:var(--muted);font-weight:600;margin-left:3px;}

.milestone-pill{display:inline-block;font-size:9px;font-weight:800;
  padding:1px 6px;border-radius:999px;margin-left:5px;
  letter-spacing:0.05em;text-transform:uppercase;vertical-align:middle;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-family:'Sora',sans-serif;
  box-shadow:0 1px 3px rgba(168,114,31,0.30);}
body.theme-dark .milestone-pill{color:#1A2438;}

.sample-pill{display:inline-block;font-size:9px;font-weight:800;
  padding:1px 6px;border-radius:999px;margin-left:5px;
  letter-spacing:0.05em;text-transform:uppercase;vertical-align:middle;
  background:linear-gradient(135deg,#B08463,#5E2E22);
  color:#fff;font-family:'Sora',sans-serif;}
body.theme-dark .sample-pill{color:#1A2438;}

.w-pill{display:inline-block;font-size:9px;font-weight:800;
  padding:1px 6px;border-radius:999px;margin-left:4px;
  letter-spacing:0.06em;text-transform:uppercase;vertical-align:middle;}
.w-pill.actual{background:var(--success-soft);color:var(--success);}
.w-pill.forecast{background:var(--secondary-soft);color:var(--secondary);}
.w-pill.ai-target{background:var(--primary-soft);color:var(--primary-dark);}
.w-pill.standard{background:var(--surface-soft);color:var(--muted);border:1px solid var(--line);}
.w-pill.gompertz{background:linear-gradient(135deg,#E0A339,#A8721F);color:#fff;}
.w-pill.sample{background:linear-gradient(135deg,#B08463,#5E2E22);color:#fff;}

.pred-days-behind{display:flex;align-items:center;gap:10px;margin-top:14px;
  padding:10px 14px;background:var(--surface-soft);border:1px solid var(--line);
  border-radius:10px;font-size:13px;flex-wrap:wrap;}
.pred-days-behind .dbi-lbl{font-weight:700;text-transform:uppercase;
  font-size:10.5px;letter-spacing:0.06em;color:var(--muted);}
.pred-days-behind .dbi-val{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;}
.pred-days-behind.ahead .dbi-val{color:var(--success);}
.pred-days-behind.on-track .dbi-val{color:var(--success);}
.pred-days-behind.behind .dbi-val{color:var(--primary-dark);}
.pred-days-behind.behind-major .dbi-val{color:var(--danger);}
.pred-days-behind .dbi-note{font-size:11.5px;color:var(--muted);}
.pred-days-behind .dbi-note strong{color:var(--ink);}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);
  background:#2B2116;color:#fff;padding:12px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  z-index:10000;max-width:calc(100vw - 32px);text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.error{background:var(--danger);}

footer{text-align:center;font-size:11.5px;color:var(--muted);padding:16px 12px;
  border-top:1px solid var(--line);background:var(--surface);margin-top:30px;}
</style>
</head>

<div class="shell">
  <div class="sticky-header">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="brandBg" x1="0" y1="0" x2="1" y2="1">

          <circle cx="38" cy="26" r="10" fill="url(#brandChick)"/>
          <path d="M 35 16 Q 37 13 39 15 Q 41 12 43 15 Q 42 18 39 17 Q 37 18.5 35 16 Z" fill="#C1502E"/>

        ProdWise<span class="accent">.VM</span>

        <button class="theme-btn" id="themeToggle" type="button" title="Toggle dark mode">🌙</button>

          <label for="batchNumber">Batch</label>
          <input id="batchNumber" type="text" placeholder="—" maxlength="32" />

          🔄 New Batch

          ⚙️

  <main id="app"></main>

  <footer>Made by Von Mangaron • Personal use only • not for commercial use</footer>
</div>

<input type="file" id="excelFile" accept=".xlsx,.xls" hidden />
<div class="toast" id="toast"></div>

<!-- Settings slide-in drawer -->
<div class="settings-scrim" id="settingsScrim"></div>
<aside class="settings-drawer" id="settingsDrawer" aria-hidden="true" aria-label="Settings">
  <div class="settings-drawer-head">
    <h3><span>⚙️</span> Settings</h3>
    <button type="button" class="settings-drawer-close" id="settingsDrawerClose" aria-label="Close settings">✕</button>
  </div>
  <div class="settings-drawer-body" id="settingsDrawerBody"></div>
</aside>

<div class="sync-scrim" id="syncScrim"></div>

<div class="sync-modal" id="syncModal">

    <h3><span>☁️</span> Cloud Sync</h3>
    <button type="button" id="syncModalClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="syncModalBody"></div>
</div>

<div class="sync-modal" id="farmFoundModal">
  <div class="sync-modal-head">
    <h3><span>☁️</span> Cloud Sync</h3>
    <button type="button" id="farmFoundClose" aria-label="Close">✕</button>
  </div>
  <div class="farm-found-body" id="farmFoundBody"></div>
</div>

<div class="sync-modal" id="newBatchModal">
  <div class="sync-modal-head">
    <h3><span>🔄</span> New Batch</h3>
    <button type="button" id="newBatchClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="newBatchModalBody"></div>
</div>

<div class="sync-modal wide" id="batchHistoryModal">
  <div class="sync-modal-head">
    <h3><span>📁</span> Batch History</h3>
    <button type="button" id="batchHistoryClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="batchHistoryModalBody"></div>
</div>

<div class="sync-modal wide" id="farmBatchPickerModal">
  <div class="sync-modal-head">
    <h3><span>📁</span> Choose a batch</h3>
    <button type="button" id="farmBatchPickerClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="farmBatchPickerBody"></div>
</div>

<div class="sync-modal" id="manualPickupModal">
  <div class="sync-modal-head">
    <h3 id="manualPickupModalTitle"><span>📝</span> Pickup</h3>
    <button type="button" id="manualPickupClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="manualPickupModalBody"></div>
</div>

<div class="sync-modal" id="sampleModal">
  <div class="sync-modal-head">
    <h3 id="sampleModalTitle"><span>📏</span> Extra Reading Day</h3>
    <button type="button" id="sampleClose" aria-label="Close">✕</button>
  </div>
  <div class="sync-modal-body" id="sampleModalBody"></div>
</div>

<div class="sync-modal" id="predictedPickupModal">

/* ---------- Date helpers ---------- */
function dateOnly(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function iso(d){
  if (!d) return '';
  const x = dateOnly(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function addDays(d, n){ const x = new Date(dateOnly(d)); x.setDate(x.getDate()+n); return dateOnly(x); }
function daysBetween(a, b){ return Math.round((dateOnly(b) - dateOnly(a)) / 86400000); }
function isWeekend(d){ const day = dateOnly(d).getDay(); return day === 0 || day === 6; }
function isMilestoneDay(age){ return Number.isFinite(age) && age > 0 && age % 7 === 0; }
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(d){
  if (!d) return '—';
  const x = dateOnly(d);
  return `${WD[x.getDay()]} ${String(x.getDate()).padStart(2,'0')} ${MO[x.getMonth()]} ${x.getFullYear()}`;
}
function fmtShortNoYear(d){
  if (!d) return '—';
  const x = dateOnly(d);
  return `${WD[x.getDay()]} ${String(x.getDate()).padStart(2,'0')} ${MO[x.getMonth()]}`;
}
function todayIso(){ return iso(new Date()); }
function fmtRelativeTime(ts){
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'} ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
  const days = Math.floor(hrs / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}
function fmtBytes(n){
  if (!Number.isFinite(n) || n <= 0) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
  return `${(n/1024/1024).toFixed(2)} MB`;
}
function uid(prefix){

}
function fmtBlocks(n){

function parseExcelDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v.getTime())) return dateOnly(v);
  if (typeof v === 'number' && isFinite(v)){
    if (v <= 0) return null;
    const ms = Math.round((v - 25569) * 86400 * 1000);
    const utc = new Date(ms);
    return dateOnly(new Date(utc.getUTCFullYear(), utc.getUTCMonth(), utc.getUTCDate()));
  }
  let s = String(v).trim();
  if (!s) return null;
  s = s.split(' ')[0].trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m){
    const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  s = s.replace(/[-.]/g, '/');
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m){
    const d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if (m){
    const yy2 = Number(m[3]);
    const yy = yy2 <= 79 ? 2000 + yy2 : 1900 + yy2;
    const d = new Date(yy, Number(m[2])-1, Number(m[1]));
    return isNaN(d.getTime()) ? null : dateOnly(d);
  }
  return null;
}
function isInvalidCleanout(v){
  if (v == null || v === '') return true;
  if (typeof v === 'number' && v === 0) return true;
  const s = String(v).trim();
  if (!s || s === '0/1/1900' || s === '1/1/1900' || s === '1900-01-01') return true;
  return parseExcelDate(v) === null;
}
function parseBool(v){
  const s = String(v ?? '').trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === 'y' || s === '1';
}
function getVal(row, keys){

/* ---------- Ross 308 curve ---------- */
function rossWeightKg(ageDays){
  if (!Number.isFinite(ageDays)) return ROSS_308_WEIGHTS_KG[0];
  if (ageDays <= 0) return ROSS_308_WEIGHTS_KG[0];
  if (ageDays >= 56) return ROSS_308_WEIGHTS_KG[56];
  const ages = Object.keys(ROSS_308_WEIGHTS_KG).map(Number).sort((a,b) => a-b);
  for (let i = 0; i < ages.length - 1; i++){
    const a0 = ages[i], a1 = ages[i+1];
    if (ageDays >= a0 && ageDays <= a1){
      const t = (ageDays - a0) / (a1 - a0);
      return ROSS_308_WEIGHTS_KG[a0] + t * (ROSS_308_WEIGHTS_KG[a1] - ROSS_308_WEIGHTS_KG[a0]);
    }
  }
  return ROSS_308_WEIGHTS_KG[56];
}
function findRossAgeForWeight(weightKg){
  const w = Number(weightKg);
  if (!Number.isFinite(w) || w <= ROSS_308_WEIGHTS_KG[0]) return 0;
  if (w >= ROSS_308_WEIGHTS_KG[56]) return 56;
  const ages = Object.keys(ROSS_308_WEIGHTS_KG).map(Number).sort((a,b) => a-b);
  for (let i = 0; i < ages.length - 1; i++){
    const a0 = ages[i], a1 = ages[i+1];
    const w0 = ROSS_308_WEIGHTS_KG[a0], w1 = ROSS_308_WEIGHTS_KG[a1];
    if (w >= w0 && w <= w1){
      const t = (w - w0) / (w1 - w0);
      return a0 + t * (a1 - a0);
    }
  }
  return 56;
}

/* ---------- Pickup / sample Age helpers ---------- */
function pickupAge(shed, pickup){
  if (pickup && pickup.ageOverride != null && Number.isFinite(Number(pickup.ageOverride))){
    return Math.max(0, Math.floor(Number(pickup.ageOverride)));
  }
  if (!shed || !shed.placementDate || !pickup || !pickup.date) return 0;
  return Math.max(0, daysBetween(shed.placementDate, pickup.date));
}
function sampleAge(shed, sample){
  if (sample && sample.ageOverride != null && Number.isFinite(Number(sample.ageOverride))){
    return Math.max(0, Math.floor(Number(sample.ageOverride)));
  }
  if (!shed || !shed.placementDate || !sample || !sample.date) return 0;
  return Math.max(0, daysBetween(shed.placementDate, sample.date));
}

/* ---------- Chick weight / scale correction helpers ---------- */
function shedChickWeight(shed){
  if (!shed) return DEFAULT_CHICK_WEIGHT_KG;
  const v = Number(shed.chickWeightKg);
  if (!Number.isFinite(v) || v <= 0) return DEFAULT_CHICK_WEIGHT_KG;
  return Math.max(MIN_CHICK_WEIGHT_KG, Math.min(MAX_CHICK_WEIGHT_KG, v));
}
function currentBiasFactor(){
  if (farmData && Number.isFinite(Number(farmData.biasFactor))){
    const v = Number(farmData.biasFactor);
    return Math.max(MIN_BIAS_FACTOR, Math.min(MAX_BIAS_FACTOR, v));
  }
  return DEFAULT_BIAS_FACTOR;
}

/* ---------- Mortality rate helpers ---------- */
function shedMortRate(shed){
  if (!shed) return DEFAULT_MORT_RATE_PCT;
  const v = Number(shed.mortalityRatePercent);
  if (!Number.isFinite(v) || v < 0) return DEFAULT_MORT_RATE_PCT;
  return Math.max(0, Math.min(MAX_MORT_RATE_PCT, v));
}
function estimateShedFinalMortality(shed, finalAge, currentAge){
  const initialPop = Number(shed.initialPopulation) || 0;
  if (initialPop <= 0){
    return { currentMortEffective: 0, estFinalMort: 0, estFinalLive: 0, estLivability: 0 };
  }
  const actualMort = Math.max(0, Number(shed.mortality) || 0);
  const ratePercent = shedMortRate(shed);
  const dailyRate = ratePercent / 100;

  let liveAtNow, mortAtNow;
  if (actualMort > 0){
    liveAtNow = Math.max(0, initialPop - actualMort);
    mortAtNow = actualMort;
  } else {
    liveAtNow = initialPop;
    mortAtNow = 0;
    const simDays = Math.max(0, Math.floor(currentAge));
    for (let d = 0; d < simDays; d++){
      const loss = liveAtNow * dailyRate;
      liveAtNow = Math.max(0, liveAtNow - loss);
      mortAtNow += loss;
    }
    mortAtNow = Math.round(mortAtNow);
    liveAtNow = Math.max(0, initialPop - mortAtNow);
  }
  let projectedLive = liveAtNow;
  let projectedMort = mortAtNow;
  const daysRemaining = Math.max(0, Math.floor(finalAge - currentAge));
  for (let d = 0; d < daysRemaining; d++){
    const loss = projectedLive * dailyRate;
    projectedLive = Math.max(0, projectedLive - loss);
    projectedMort += loss;
  }
  const estFinalMort = Math.min(initialPop, Math.round(projectedMort));
  const estFinalLive = Math.max(0, initialPop - estFinalMort);
  const estLivability = (estFinalLive / initialPop) * 100;
  return {
    currentMortEffective: Math.round(mortAtNow),
    estFinalMort, estFinalLive, estLivability
  };
}

/* =========================================================
   DENSITY SETTINGS + PREDICTED PICKUPS
========================================================= */
function getShedDensitySettings(shed){
  const g = predState.densityGlobal || { ...DEFAULT_DENSITY_GLOBAL };
  const o = (shed && shed.densitySettings) || {};
  const useGlobal = (o.useGlobal === false) ? false : true;

  let targetPickups = DEFAULT_DENSITY_GLOBAL.targetPickups;
  if (shed && shed.targetPickups != null && Number.isFinite(Number(shed.targetPickups))){
    targetPickups = Math.floor(Number(shed.targetPickups));
  } else if (Number.isFinite(Number(g.targetPickups))){
    targetPickups = Math.floor(Number(g.targetPickups));
  } else if (Number.isFinite(Number(g.minPickupsBeforeCleanout))){
    targetPickups = Math.floor(Number(g.minPickupsBeforeCleanout));
  }
  targetPickups = Math.max(MIN_PICKUPS_PER_SHED, Math.min(MAX_PICKUPS_PER_SHED, targetPickups));

  if (useGlobal){
    return {
      maxDensity: Number.isFinite(Number(g.maxDensity)) ? Number(g.maxDensity) : DEFAULT_DENSITY_GLOBAL.maxDensity,
      triggerDensity: Number.isFinite(Number(g.triggerDensity)) ? Number(g.triggerDensity) : DEFAULT_DENSITY_GLOBAL.triggerDensity,
      targetDensity: Number.isFinite(Number(g.targetDensity)) ? Number(g.targetDensity) : DEFAULT_DENSITY_GLOBAL.targetDensity,
      targetPickups,
      useGlobal: true
    };
  }
  return {
    maxDensity: Number.isFinite(Number(o.maxDensity)) ? Number(o.maxDensity) : g.maxDensity,
    triggerDensity: Number.isFinite(Number(o.triggerDensity)) ? Number(o.triggerDensity) : g.triggerDensity,
    targetDensity: Number.isFinite(Number(o.targetDensity)) ? Number(o.targetDensity) : g.targetDensity,
    targetPickups,
    useGlobal: false
  };
}

function computeEffectivePickups(shed){
  if (!shed) return [];
  const real = (shed.pickups || []).map(p => ({ ...p, __source: 'real' }));
  const realDates = new Set(real.map(p => iso(p.date)));
  const predicted = (shed.predictedPickups || [])
    .filter(pp => !realDates.has(iso(pp.date)))
    .map(pp => ({
      date: pp.date,
      birds: Number(pp.birds) || 0,
      isFinal: !!pp.isFinal,
      variance: null,
      totalWeightKg: null,
      totalWeightKgFromExcel: null,
      totalWeightKgManual: false,
      source: 'predicted',
      ageOverride: null,
      __source: 'predicted',
      __id: pp.id
    }));
  const all = [...real, ...predicted].sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  return all;
}

function densityOnDate(shed, D, extraPredicted, excludePredictedId){
  const d = dateOnly(D);
  if (!shed.placementDate) return { live: 0, weight: 0, density: 0, age: 0 };
  const age = ageInDays(shed, d);
  const weight = (forecastWeightModeAware(shed, d).kg) || 0;
  const real = (shed.pickups || []);
  const realDates = new Set(real.map(p => iso(p.date)));
  const predicted = (shed.predictedPickups || [])
    .filter(pp => pp.id !== excludePredictedId)
    .filter(pp => !realDates.has(iso(pp.date)))
    .map(pp => ({ date: pp.date, birds: Number(pp.birds) || 0 }));
  const extra = (extraPredicted || []).map(pp => ({ date: pp.date, birds: Number(pp.birds) || 0 }));
  const allPickups = [...real, ...predicted, ...extra].sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  const beforeD = allPickups
    .filter(p => dateOnly(p.date) < d)
    .reduce((s,p) => s + (Number(p.birds) || 0), 0);
  const live = Math.max(0, (shed.initialPopulation || 0) - Number(shed.mortality || 0) - beforeD);
  const density = (live * weight) / FIXED_FLOOR_AREA_M2;
  return { live, weight, density, age };
}

function recommendPickupForDate(shed, dateIso, opts){
  opts = opts || {};
  const ds = getShedDensitySettings(shed);
  const d = parseExcelDate(dateIso);
  if (!d) return null;
  const info = densityOnDate(shed, d, opts.extraPredicted || null, opts.excludePredictedId);
  const targetDensity = ds.targetDensity;
  const targetBirds = Math.floor((targetDensity * FIXED_FLOOR_AREA_M2) / Math.max(0.0001, info.weight));
  let remove = info.live - targetBirds;
  if (remove > 0) remove = Math.floor(remove / 50) * 50;
  else remove = 0;
  const afterBirds = Math.max(0, info.live - remove);
  const afterDensity = (afterBirds * info.weight) / FIXED_FLOOR_AREA_M2;
  return {
    age: info.age,
    live: info.live,
    weight: info.weight,
    densityBefore: info.density,
    targetDensity,
    recommendedRemove: Math.max(0, remove),
    densityAfter: afterDensity,
    maxDensity: ds.maxDensity,
    triggerDensity: ds.triggerDensity
  };
}

function computeLiveBirdsBefore(shed, dateObj, extraPredicted){
  const d = dateOnly(dateObj);
  if (!shed || !shed.placementDate) return 0;
  if (d < dateOnly(shed.placementDate)) return 0;
  const realBefore = (shed.pickups || [])
    .filter(p => dateOnly(p.date) < d)
    .reduce((s,p) => s + (Number(p.birds) || 0), 0);
  const extraBefore = (extraPredicted || [])
    .filter(p => dateOnly(p.date) < d)
    .reduce((s,p) => s + (Number(p.birds) || 0), 0);
  return Math.max(0, (shed.initialPopulation || 0) - Number(shed.mortality || 0) - realBefore - extraBefore);
}

function autoFillPredictedPickups(shed){
  if (!shed || !shed.placementDate) return [];
  const ds = getShedDensitySettings(shed);
  const trigger = ds.triggerDensity;
  const targetN = ds.targetPickups;

  const realPickups = shed.pickups || [];
  const hasRealFinal = realPickups.some(p => p.isFinal);
  if (hasRealFinal) return [];

  const realCount = realPickups.length;
  const needed = targetN - realCount;
  if (needed <= 0) return [];

  const regularNeeded = Math.max(0, needed - 1);

  const result = [];
  const tempShed = { ...shed, predictedPickups: [] };
  const today = dateOnly(new Date());
  const cleanout = shed.cleanoutDate ? dateOnly(shed.cleanoutDate) : addDays(today, 50);
  if (cleanout <= today) return [];

  if (regularNeeded > 0){
    let searchStart = addDays(today, 1);
    let safety = 0;
    const maxDay = addDays(cleanout, -2);
    while (result.length < regularNeeded && safety < 30){
      safety++;
      let foundDate = null;
      let cursor = searchStart;
      while (cursor <= maxDay){
        const info = densityOnDate(tempShed, cursor, result);
        if (info.density >= trigger){ foundDate = cursor; break; }
        cursor = addDays(cursor, 1);
      }
      if (!foundDate) break;
      const rec = recommendPickupForDate(tempShed, iso(foundDate), { extraPredicted: result });
      if (!rec || rec.recommendedRemove < 500) break;
      result.push({ id: uid('pp'), date: foundDate, birds: rec.recommendedRemove, isFinal: false });
      searchStart = addDays(foundDate, 3);
    }
  }

  const finalBirds = computeLiveBirdsBefore(shed, cleanout, result);
  if (finalBirds > 0){
    result.push({
      id: uid('pp'),
      date: cleanout,
      birds: finalBirds,
      isFinal: true
    });
  }

  return result;
}

function reconcilePredictedPickups(shed){
  if (!shed) return;
  const real = shed.pickups || [];
  if (real.some(p => p.isFinal)){
    shed.predictedPickups = [];
    return;
  }
  const realDates = new Set(real.map(p => iso(p.date)));
  shed.predictedPickups = (shed.predictedPickups || []).filter(pp => !realDates.has(iso(pp.date)));
  if (shed.cleanoutDate){
    (shed.predictedPickups || []).forEach(pp => {
      if (pp.isFinal) pp.date = dateOnly(shed.cleanoutDate);
    });
    shed.predictedPickups.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
  }
}

/* ---------- AI GROWTH CURVE FITTING ---------- */
function collectShedWeightAnchors(shed){
  const anchors = [];
  const bias = currentBiasFactor();
  const chickW = shedChickWeight(shed);
  anchors.push({ t: 0, w: chickW, wgt: 1.0, source: 'day-old' });

  const tc = shed.targetCurve || {};
  const gridDays = new Set();
  TARGET_DAYS.forEach(day => {
    const v = Number(tc[day]);
    if (Number.isFinite(v) && v > 0){
      anchors.push({ t: day, w: v * bias, wgt: 0.65, source: 'in-yard-grid' });
      gridDays.add(day);
    }
  });

  (shed.inYardSamples || []).forEach(s => {
    if (!s.date || !(s.avgWeightKg > 0)) return;
    const age = sampleAge(shed, s);
    if (age <= 0) return;
    if (gridDays.has(age)) return;
    const scaled = s.isOfficial ? s.avgWeightKg : (s.avgWeightKg * bias);
    const wgt = s.isOfficial ? 1.0 : 0.55;
    anchors.push({ t: age, w: scaled, wgt, source: s.isOfficial ? 'official-sample' : 'in-yard-custom' });
  });

  (shed.pickups || []).forEach(p => {
    const avg = pickupAvgKg(p);
    if (!avg || avg <= 0) return;
    const age = pickupAge(shed, p);
    if (age <= 0) return;
    anchors.push({ t: age, w: avg, wgt: 1.0, source: 'pickup' });
  });

  return anchors;
}

function fitLinearGompertz(anchors, k){
  let sW = 0, sWz = 0, sWy = 0, sWzz = 0, sWzy = 0;
  for (const a of anchors){
    if (!(a.w > 0)) continue;
    const z = Math.exp(-k * a.t);
    const y = Math.log(a.w);
    sW += a.wgt;
    sWz += a.wgt * z;
    sWy += a.wgt * y;
    sWzz += a.wgt * z * z;
    sWzy += a.wgt * z * y;
  }
  const denom = sW * sWzz - sWz * sWz;
  if (Math.abs(denom) < 1e-12) return null;
  const c = (sWy * sWzz - sWz * sWzy) / denom;
  const m = (sW * sWzy - sWz * sWy) / denom;
  const lnA = c;
  const b = -m;
  if (!isFinite(lnA) || !isFinite(b)) return null;
  if (b <= 0) return null;
  const A = Math.exp(lnA);
  if (!isFinite(A) || A <= 0 || A > GOMPERTZ_A_MAX) return null;

  let err = 0, totW = 0;
  for (const a of anchors){
    if (!(a.w > 0)) continue;
    const pred = A * Math.exp(-b * Math.exp(-k * a.t));
    if (!(pred > 0)) return null;
    const e = Math.log(pred) - Math.log(a.w);
    err += a.wgt * e * e;
    totW += a.wgt;
  }
  const sigma = totW > 0 ? Math.sqrt(err / totW) : 0;
  return { A, b, k, err, sigma };
}

function fitGompertz(anchors){
  if (!anchors || anchors.length < 3) return null;
  let best = null;
  for (let k = GOMPERTZ_K_MIN; k <= GOMPERTZ_K_MAX; k += 0.002){
    const fit = fitLinearGompertz(anchors, k);
    if (fit && (!best || fit.err < best.err)) best = fit;
  }
  if (!best) return null;
  const k0 = best.k;
  const kLo = Math.max(GOMPERTZ_K_MIN, k0 - 0.005);
  const kHi = Math.min(GOMPERTZ_K_MAX, k0 + 0.005);
  for (let k = kLo; k <= kHi; k += 0.0002){
    const fit = fitLinearGompertz(anchors, k);
    if (fit && fit.err < best.err) best = fit;
  }
  return best;
}

function computeShedGompertzFit(shed){
  if (!shed || !shed.placementDate) return null;
  const anchors = collectShedWeightAnchors(shed);
  if (anchors.length < 3) return null;
  let lastT = 0;
  for (const a of anchors){ if (a.t > lastT) lastT = a.t; }
  const fit = fitGompertz(anchors);
  if (!fit) return null;
  fit.lastT = lastT;
  fit.anchorCount = anchors.length;
  fit.pickupCount = anchors.filter(a => a.source === 'pickup').length;
  fit.sampleCount = anchors.filter(a => a.source === 'in-yard-grid' || a.source === 'in-yard-custom' || a.source === 'official-sample').length;
  return fit;
}

function getShedGompertzFit(shed){
  if (!shed) return null;
  if (gompertzCache.has(shed.id)) return gompertzCache.get(shed.id);
  const fit = computeShedGompertzFit(shed);
  gompertzCache.set(shed.id, fit);
  return fit;
}

function gompertzWeightAt(fit, age){
  if (!fit) return null;
  if (!Number.isFinite(age) || age < 0) return null;
  const val = fit.A * Math.exp(-fit.b * Math.exp(-fit.k * age));
  return (Number.isFinite(val) && val > 0) ? val : null;
}

function gompertzBandFraction(fit, age){
  if (!fit) return MAX_UNCERTAINTY;
  const sigmaBase = Math.max(0.018, fit.sigma || 0);
  const daysBeyond = Math.max(0, age - (fit.lastT || 0));
  const extrap = 0.004 * daysBeyond;
  const total = Math.sqrt(sigmaBase * sigmaBase + extrap * extrap);
  return Math.min(MAX_UNCERTAINTY, total);
}

/* ---------- Excel parse ---------- */
function parseShedsFromWorkbook(workbook){
  const sheetName =
    workbook.SheetNames.find(n => String(n).toLowerCase() === 'sheds')
    || workbook.SheetNames[0];
  if (!sheetName) throw new Error('No worksheet found in the file.');
  const ws = workbook.Sheets[sheetName];
  if (!ws) throw new Error('The worksheet appears to be empty.');

  const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false, dateNF: 'dd/mm/yyyy' });
  if (!rows.length) throw new Error('No data rows found in the file.');

  const sheds = Array.from({length: SHED_COUNT}, (_, i) => ({
    id: i + 1, placementDate: null, initialPopulation: 0, cleanoutDate: null,
    mortality: 0, customFeedKg: null, pickups: [],
    targetCurve: { 7: null, 14: null, 21: null, 28: null },
    mortalityRatePercent: DEFAULT_MORT_RATE_PCT,
    chickWeightKg: DEFAULT_CHICK_WEIGHT_KG,
    inYardSamples: [],
    predictedPickups: [],
    targetPickups: null,
    densitySettings: { useGlobal: true, maxDensity: null, triggerDensity: null, targetDensity: null }
  }));

  let batchNumber = '', matched = 0, skipped = 0;

  for (const row of rows){
    const shedId = Number(getVal(row, KEYS.shedId));
    if (!Number.isFinite(shedId) || shedId < 1 || shedId > SHED_COUNT){ skipped++; continue; }
    const idx = shedId - 1;

    const bn = String(getVal(row, KEYS.batch) || '').trim();
    if (!batchNumber && bn) batchNumber = bn;

    const placement  = parseExcelDate(getVal(row, KEYS.placement));
    const population = Number(getVal(row, KEYS.population));
    const mortality  = Number(getVal(row, KEYS.mortality));
    const customFeed = Number(getVal(row, KEYS.customFeed));
    const cleanoutRaw = getVal(row, KEYS.cleanout);

    if (placement) sheds[idx].placementDate = placement;
    if (Number.isFinite(population) && population > 0) sheds[idx].initialPopulation = Math.floor(population);
    if (Number.isFinite(mortality)) sheds[idx].mortality = Math.floor(mortality);
    if (Number.isFinite(customFeed) && customFeed > 0) sheds[idx].customFeedKg = customFeed;

    let cleanout = parseExcelDate(cleanoutRaw);
    if (isInvalidCleanout(cleanoutRaw) && placement) cleanout = addDays(placement, 52);
    sheds[idx].cleanoutDate = cleanout;

    const pickups = [];
    for (let p = 1; p <= 5; p++){
      const dRaw = getVal(row, [`Pickup${p}Date`, `Pickup ${p} Date`, `P${p}Date`, `P${p} Date`]);
      const bRaw = getVal(row, [`Pickup${p}Birds`, `Pickup ${p} Birds`, `P${p}Birds`, `P${p} Birds`]);
      const fRaw = getVal(row, [`Pickup${p}Final`, `Pickup ${p} Final`, `P${p}Final`]);
      const vRaw = getVal(row, [`Pickup${p}Variance`, `Pickup ${p} Variance`, `P${p}Variance`]);
      const wRaw = getVal(row, [
        `Pickup${p}Weight`, `Pickup ${p} Weight`,
        `Pickup${p}TotalWeight`, `Pickup ${p} Total Weight`,
        `Pickup${p}TotalWt`, `Pickup ${p} Total Wt`,
        `P${p}Weight`, `P${p} Weight`
      ]);
      const d = parseExcelDate(dRaw);
      const b = Number(bRaw);
      const w = Number(wRaw);
      if (d && Number.isFinite(b) && b > 0){
        const totalWeight = (Number.isFinite(w) && w > 0) ? w : null;
        pickups.push({
          date: d, birds: Math.floor(b),
          isFinal: parseBool(fRaw),
          variance: Number.isFinite(Number(vRaw)) ? Number(vRaw) : null,
          totalWeightKg: totalWeight,
          totalWeightKgFromExcel: totalWeight,
          totalWeightKgManual: false,
          source: 'excel',
          ageOverride: null
        });
      }
    }

    pickups.sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
    let finalSeen = false;
    for (const p of pickups){
      if (p.isFinal && !finalSeen) finalSeen = true;
      else if (p.isFinal && finalSeen) p.isFinal = false;
    }
    if (pickups.length === 5 && !pickups.some(p => p.isFinal)) pickups[4].isFinal = true;

    const fp = pickups.find(p => p.isFinal);
    if (fp){
      sheds[idx].cleanoutDate = dateOnly(fp.date);
      const totalPicked = pickups.reduce((s,p) => s + p.birds, 0);
      sheds[idx].mortality = Math.max(0, sheds[idx].initialPopulation - totalPicked);
    }

    sheds[idx].pickups = pickups;
    matched++;
  }

  if (matched === 0){
    throw new Error("No shed rows found. Make sure the 'Shed' column contains numbers 1 through 8.");
  }
  return { sheds, batchNumber, matched, skipped, sheetName };
}

      s.pickups = (s.pickups || []).map(p => ({

        birds: Number(p.birds) || 0,
        isFinal: !!p.isFinal,
        variance: (p.variance != null && Number.isFinite(Number(p.variance))) ? Number(p.variance) : null,
        totalWeightKg: (p.totalWeightKg != null && Number.isFinite(Number(p.totalWeightKg))) ? Number(p.totalWeightKg) : null,
        totalWeightKgFromExcel: (p.totalWeightKgFromExcel != null && Number.isFinite(Number(p.totalWeightKgFromExcel))) ? Number(p.totalWeightKgFromExcel) : null,
        totalWeightKgManual: !!p.totalWeightKgManual,
        source: (p.source === 'manual') ? 'manual' : 'excel',
        ageOverride: (p.ageOverride != null && Number.isFinite(Number(p.ageOverride))) ? Number(p.ageOverride) : null
      }));
      s.inYardSamples = (s.inYardSamples || []).map(x => ({
        date: x.date ? dateOnly(x.date) : null,
        ageOverride: (x.ageOverride != null && Number.isFinite(Number(x.ageOverride))) ? Math.floor(Number(x.ageOverride)) : null,
        birds: Number(x.birds) || 0,
        avgWeightKg: Number(x.avgWeightKg) || 0,
        isOfficial: !!x.isOfficial
      })).filter(x => x.date && x.avgWeightKg > 0);
      s.predictedPickups = (s.predictedPickups || []).map(pp => ({
        id: pp.id || uid('pp'),
        date: pp.date ? dateOnly(pp.date) : null,
        birds: Number(pp.birds) || 0,
        isFinal: !!pp.isFinal
      })).filter(pp => pp.date && pp.birds >= 0);
      s.targetPickups = (s.targetPickups != null && Number.isFinite(Number(s.targetPickups)))
        ? Math.max(MIN_PICKUPS_PER_SHED, Math.min(MAX_PICKUPS_PER_SHED, Math.floor(Number(s.targetPickups))))
        : null;
      s.densitySettings = {
        useGlobal: (s.densitySettings && s.densitySettings.useGlobal === false) ? false : true,
        maxDensity: (s.densitySettings && Number.isFinite(Number(s.densitySettings.maxDensity))) ? Number(s.densitySettings.maxDensity) : null,
        triggerDensity: (s.densitySettings && Number.isFinite(Number(s.densitySettings.triggerDensity))) ? Number(s.densitySettings.triggerDensity) : null,
        targetDensity: (s.densitySettings && Number.isFinite(Number(s.densitySettings.targetDensity))) ? Number(s.densitySettings.targetDensity) : null
      };
      const cw = Number(s.chickWeightKg);
      s.chickWeightKg = (Number.isFinite(cw) && cw > 0)
        ? Math.max(MIN_CHICK_WEIGHT_KG, Math.min(MAX_CHICK_WEIGHT_KG, cw))
        : DEFAULT_CHICK_WEIGHT_KG;
      const tc = s.targetCurve || {};
      s.targetCurve = {
        7: (tc[7] != null && Number.isFinite(Number(tc[7])) && Number(tc[7]) > 0) ? Number(tc[7]) : null,
        14: (tc[14] != null && Number.isFinite(Number(tc[14])) && Number(tc[14]) > 0) ? Number(tc[14]) : null,
        21: (tc[21] != null && Number.isFinite(Number(tc[21])) && Number(tc[21]) > 0) ? Number(tc[21]) : null,
        28: (tc[28] != null && Number.isFinite(Number(tc[28])) && Number(tc[28]) > 0) ? Number(tc[28]) : null
      };
      const mr = Number(s.mortalityRatePercent);
      s.mortalityRatePercent = (Number.isFinite(mr) && mr >= 0) ? Math.max(0, Math.min(MAX_MORT_RATE_PCT, mr)) : DEFAULT_MORT_RATE_PCT;
    });
    const bf = Number(parsed.biasFactor);
    parsed.biasFactor = (Number.isFinite(bf) && bf > 0)
      ? Math.max(MIN_BIAS_FACTOR, Math.min(MAX_BIAS_FACTOR, bf))
      : DEFAULT_BIAS_FACTOR;
    return parsed;
  } catch(e){ return null; }
}

          };
          const r1 = toRings(s.silo1Kg);
          const r2 = toRings(s.silo2Kg);
          const r3 = toRings(s.silo3Kg);
          const hasAny = (r1 !== null || r2 !== null || r3 !== null);
          out[g] = {

        return out;
      }
    }

function normalizeRing(r){
  if (r === null || r === undefined || r === '') return null;
  const n = Number(r);
  if (!Number.isFinite(n) || n < 0) return null;
  return Math.max(0, Math.min(MAX_RINGS, Math.floor(n)));
}

/* =========================================================
   WEIGHT HELPERS
========================================================= */
function weightedPickups(shed){
  return (shed.pickups || [])
    .filter(p => p.totalWeightKg && p.totalWeightKg > 0 && p.birds > 0)
    .slice()
    .sort((a,b) => dateOnly(a.date) - dateOnly(b.date));
}
function lastWeightedPickup(shed){
  const arr = weightedPickups(shed);
  return arr.length ? arr[arr.length - 1] : null;
}
function pickupAvgKg(p){
  if (!p || !p.totalWeightKg || !p.birds) return null;
  return p.totalWeightKg / p.birds;
}
function observedDailyGain(shed){
  const arr = weightedPickups(shed);
  if (arr.length === 0) return null;
  if (arr.length === 1){
    const p = arr[0];
    const age = pickupAge(shed, p);
    const avg = pickupAvgKg(p);
    if (age <= 0 || avg == null) return null;
    return (avg - ROSS_308_WEIGHTS_KG[0]) / age;
  }
  const first = arr[0];
  const last = arr[arr.length - 1];
  const a0 = pickupAge(shed, first);
  const a1 = pickupAge(shed, last);
  const w0 = pickupAvgKg(first);
  const w1 = pickupAvgKg(last);
  if (a1 <= a0 || w0 == null || w1 == null) return null;
  return (w1 - w0) / (a1 - a0);
}

function forecastFromPickups(shed, date){
  const last = lastWeightedPickup(shed);
  if (!last) return null;
  const lastAge = pickupAge(shed, last);
  const lastW = pickupAvgKg(last);
  const targetAge = ageInDays(shed, date);
  if (targetAge <= lastAge) return lastW;
  const g = observedDailyGain(shed) || 0;
  return lastW + (targetAge - lastAge) * g;
}

function getTargetCurve(shed){
  const t = shed.targetCurve || {};
  const pts = [];
  TARGET_DAYS.forEach(day => {
    const v = Number(t[day]);
    if (Number.isFinite(v) && v > 0) pts.push({ day, kg: v });
  });
  return pts.sort((a,b) => a.day - b.day);
}
function hasTargetCurve(shed){
  return getTargetCurve(shed).length > 0;
}
function forecastFromTargetCurve(shed, date){
  const pts = getTargetCurve(shed);
  if (pts.length === 0) return null;
  const age = ageInDays(shed, date);
  if (age <= 0) return ROSS_308_WEIGHTS_KG[0];
  const anchors = [{ day: 0, kg: ROSS_308_WEIGHTS_KG[0] }, ...pts];
  if (age <= anchors[0].day) return anchors[0].kg;
  if (age >= anchors[anchors.length-1].day){
    const last = anchors[anchors.length-1];
    const prev = anchors[anchors.length-2] || { day: 0, kg: ROSS_308_WEIGHTS_KG[0] };
    const slope = (last.kg - prev.kg) / (last.day - prev.day);
    return Math.max(0, last.kg + (age - last.day) * slope);
  }
  for (let i = 0; i < anchors.length - 1; i++){
    const a0 = anchors[i], a1 = anchors[i+1];
    if (age >= a0.day && age <= a1.day){
      const t = (age - a0.day) / (a1.day - a0.day);
      return a0.kg + t * (a1.kg - a0.kg);
    }
  }
  return null;
}

function forecastWeightModeAware(shed, date){
  const age = ageInDays(shed, date);
  const fit = getShedGompertzFit(shed);
  if (fit){
    const kg = gompertzWeightAt(fit, age);
    if (kg != null){
      const band = gompertzBandFraction(fit, age);
      return { kg, mode: 'gompertz', band, fit };
    }
  }
  const anchors = collectShedWeightAnchors(shed);
  if (anchors.length === 2){
    const last = anchors[1];
    const rossAtLast = rossWeightKg(last.t);
    if (rossAtLast > 0){
      const ratio = last.w / rossAtLast;
      const kg = rossWeightKg(age) * ratio;
      return { kg, mode: 'ross-scaled', band: 0.10 };
    }
  }
  const last = lastWeightedPickup(shed);
  if (last){ return { kg: forecastFromPickups(shed, date), mode: 'ai-pickup', band: 0.10 }; }
  if (hasTargetCurve(shed)){
    const kg = forecastFromTargetCurve(shed, date);
    if (kg != null) return { kg, mode: 'ai-target', band: 0.12 };
  }
  return { kg: rossWeightKg(age), mode: 'standard', band: 0.15 };
}

function daysVsTarget(currentAge, currentWeightKg){
  if (!Number.isFinite(currentAge) || !Number.isFinite(currentWeightKg) || currentWeightKg <= 0) return null;
  const rossAge = findRossAgeForWeight(currentWeightKg);
  return rossAge - currentAge;
}

function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}
function base64ToBlob(base64, mime){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function fetchFromCloud(){
  if (!syncFarmName) return { ok: false, reason: 'no-farm' };
  try {
    const res = await fetch(buildSyncUrl(syncFarmName));
    if (res.status === 404) return { ok: true, notFound: true };
    if (!res.ok) return { ok: false, reason: 'http-' + res.status };
    const result = await res.json();
    if (result.notFound) return { ok: true, notFound: true };
    return { ok: true, data: result.data, sha: result.sha };
  } catch (e){ return { ok: false, reason: e.message || 'network-error' }; }
}
async function pullFromCloud(silent){
  if (!syncFarmName) return false;
  syncState = 'pulling'; renderSettingsDrawerBody();
  const r = await fetchFromCloud();
  if (!r.ok){
    syncState = 'error'; renderSettingsDrawerBody();
    if (!silent) showToast('Could not sync — check your connection.', true);
    return false;
  }
  if (r.notFound){
    syncState = 'idle'; renderSettingsDrawerBody();
    await pushToCloud();
    if (!silent) showToast('Connected — created a new file for this farm.');
    return true;
  }
  syncSha = r.sha || null;
  const ok = applyCloudPayload(r.data);
  if (!ok){
    syncState = 'error'; renderSettingsDrawerBody();
    if (!silent) showToast('Cloud file is not a ProdWise backup.', true);
    return false;
  }
  syncLastSyncAt = Date.now(); saveSyncState();
  syncState = 'idle'; renderSettingsDrawerBody(); render();
  if (!silent) showToast('Synced ✓');
  return true;
}
async function pushToCloud(){
  if (!syncFarmName) return false;
  syncState = 'pushing'; renderSettingsDrawerBody();
  try {
    const body = { sha: syncSha, data: buildCloudPayload() };
    const res = await fetch(buildSyncUrl(syncFarmName), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.status === 409){
      const fresh = await fetch(buildSyncUrl(syncFarmName)).then(r => r.json()).catch(() => null);
      if (fresh && fresh.sha){
        syncSha = fresh.sha;
        const retry = await fetch(buildSyncUrl(syncFarmName), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha: syncSha, data: buildCloudPayload() })
        });
        if (!retry.ok) throw new Error('Sync retry failed');
        const rr = await retry.json();
        if (rr && rr.sha) syncSha = rr.sha;
      } else throw new Error('Could not refresh cloud state');
    } else if (!res.ok) throw new Error('Sync server responded ' + res.status);
    else {
      const result = await res.json();
      if (result && result.sha) syncSha = result.sha;
    }
    syncLastSyncAt = Date.now(); saveSyncState();
    syncState = 'idle'; renderSettingsDrawerBody();
    return true;
  } catch (e){
    console.error('Push failed', e);
    syncState = 'error'; renderSettingsDrawerBody();
    return false;
  }
}
function schedulePush(){
  if (!syncFarmName || !syncConnectedAt) return;
  pushPending = true;
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(runScheduledPush, 2000);
  if (!pushMaxWaitTimer) pushMaxWaitTimer = setTimeout(runScheduledPush, 30000);
}
async function runScheduledPush(){
  clearTimeout(pushDebounceTimer); pushDebounceTimer = null;
  clearTimeout(pushMaxWaitTimer); pushMaxWaitTimer = null;
  if (!pushPending) return;
  if (pushInFlight){ pushDebounceTimer = setTimeout(runScheduledPush, 2000); return; }
  pushPending = false; pushInFlight = true;
  try { await pushToCloud(); } finally { pushInFlight = false; }
}
function flushPendingPush(){
  if (!pushPending) return;
  clearTimeout(pushDebounceTimer); pushDebounceTimer = null;
  clearTimeout(pushMaxWaitTimer); pushMaxWaitTimer = null;
  pushPending = false; pushToCloud();
}
async function uploadExcelToCloud(file){
  if (!syncFarmName) return false;
  syncState = 'pushing'; renderSettingsDrawerBody();
  try {
    const buf = await file.arrayBuffer();
    const base64 = arrayBufferToBase64(buf);
    const uploadedAt = new Date().toISOString();
    const wrapperData = { name: file.name || 'sheds.xlsx', size: file.size || buf.byteLength, uploadedAt, base64 };
    let res = await fetch(buildExcelWrapperUrl(syncFarmName), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: syncExcelSha, data: wrapperData })
    });
    if (res.status === 409){
      const fresh = await fetch(buildExcelWrapperUrl(syncFarmName)).then(r => r.json()).catch(() => null);
      if (fresh && fresh.sha){
        syncExcelSha = fresh.sha;
        res = await fetch(buildExcelWrapperUrl(syncFarmName), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sha: syncExcelSha, data: wrapperData })
        });
      }
    }
    if (!res.ok) throw new Error('Excel upload failed: ' + res.status);
    const result = await res.json().catch(() => null);
    if (result && result.sha) syncExcelSha = result.sha;
    syncExcelMeta = { name: wrapperData.name, size: wrapperData.size, uploadedAt };
    saveSyncState();
    await pushToCloud();
    syncState = 'idle'; renderSettingsDrawerBody();
    return true;
  } catch (e){
    console.error('Excel upload failed', e);
    syncState = 'error'; renderSettingsDrawerBody();
    showToast('Excel saved locally, but cloud upload failed.', true);
    return false;
  }
}
async function downloadExcelFromCloud(){
  if (!syncFarmName) return;
  try {
    const res = await fetch(buildExcelWrapperUrl(syncFarmName));
    if (!res.ok){ showToast('Could not fetch the stored Excel.', true); return; }
    const result = await res.json();
    const wrapper = result && result.data;
    if (!wrapper || !wrapper.base64){ showToast('No stored Excel found.', true); return; }
    const blob = base64ToBlob(wrapper.base64, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = wrapper.name || 'sheds.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('Stored Excel downloaded.');
  } catch (e){ console.error(e); showToast('Download failed.', true); }
}

/* ============================================================
   CONNECT FLOW (hardened)
   ============================================================ */
async function listFarmBatches(farmName){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(buildListingUrl(farmName), { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok){
      return { ok: false, reason: 'http-' + res.status, files: [] };
    }
    const result = await res.json();
    const rawFiles = (result && Array.isArray(result.files)) ? result.files : [];
    const parsed = [];
    for (const f of rawFiles){
      const info = parseBatchFileInfo(farmName, f.name);
      if (!info) continue;
      parsed.push({ ...info, size: f.size, sha: f.sha, fileName: f.name });
    }
    parsed.sort((a, b) => {
      if (a.isLegacy && !b.isLegacy) return 1;
      if (b.isLegacy && !a.isLegacy) return -1;
      return compareBatchKeys(a.batchKey, b.batchKey);
    });
    return { ok: true, files: parsed };
  } catch (e){
    clearTimeout(timer);
    return {
      ok: false,
      reason: (e && e.name === 'AbortError') ? 'timeout' : ((e && e.message) || 'network-error'),
      files: []
    };
  }
}

async function handleConnectFarm(farmName){
  const clean = sanitizeUserFarmName(farmName);
  if (!clean){ showToast('Enter a farm name.', true); return; }

  /* Visual feedback on the connect button. */
  const btn = document.getElementById('settingsConnectBtn');
  const oldBtnHTML = btn ? btn.innerHTML : null;
  if (btn){
    btn.disabled = true;
    btn.innerHTML = '⏳ Connecting…';
  }

  try {
    const isSwitch = !!syncFarmName && syncFarmName !== clean;
    if (isSwitch && syncConnectedAt && pushPending){
      try { await runScheduledPush(); } catch(e){}
    }

    const listing = await listFarmBatches(clean);

    if (!listing.ok){
      const msg = listing.reason === 'timeout'
        ? '⏱️ Cloud did not respond — check your connection and try again.'
        : 'Could not reach the cloud — check your connection.';
      showToast(msg, true);
      return;
    }

    if (listing.files.length === 0){
      if (!confirm(`Farm "${clean}" not found in the cloud.\n\nCreate a new farm?`)) return;
      syncFarmName = clean;
      syncSha = null;
      syncExcelSha = null;
      syncExcelMeta = null;
      syncConnectedAt = null;
      syncLastSyncAt = null;
      saveSyncState();
      closeSyncModal();
      closeSettingsDrawer();
      newBatchModalPhase = 'batchNumber';
      openNewBatchModal();
      return;
    }

    if (listing.files.length === 1){
      await loadFarmBatchFromCloud(clean, listing.files[0].batchKey);
      return;
    }

    syncFarmName = clean;
    closeSettingsDrawer();
    openFarmBatchPickerModal(clean, listing.files);
  } finally {
    if (btn && oldBtnHTML !== null){
      btn.disabled = false;
      btn.innerHTML = oldBtnHTML;
    }
  }
}

async function loadFarmBatchFromCloud(farmName, batchKey){
  resetAllToDefaults(batchKey);
  syncFarmName = farmName;
  syncSha = null;
  syncExcelSha = null;
  syncExcelMeta = null;
  syncConnectedAt = Date.now();
  syncLastSyncAt = null;

  closeFarmBatchPickerModal();
  closeSyncModal();
  closeSettingsDrawer();
  syncState = 'pulling'; renderSettingsDrawerBody();

  let payload = null, sha = null;
  try {
    const res = await fetch(buildBatchUrl(farmName, batchKey));
    if (res.ok){
      const result = await res.json();
      if (!result.notFound && result.data){
        payload = result.data;
        sha = result.sha || null;
      }
    }
  } catch (e){}

  if (payload){
    applyCloudPayload(payload, { isFirstPull: true });
    syncSha = sha;
    syncLastSyncAt = Date.now();
    showToast(`✅ Loaded ${batchKey ? 'batch ' + batchKey : 'legacy batch'}.`);
  } else {
    showToast('No data found — starting with default sheds.');
  }

  saveSyncState();
  syncState = 'idle'; renderSettingsDrawerBody(); render();
}
